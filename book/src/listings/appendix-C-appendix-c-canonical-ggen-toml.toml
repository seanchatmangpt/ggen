# Canonical `ggen.toml` — declarative-rules schema (schema 1).
# Live-verified against the installed binary (ggen 26.10.11): dry-run + real
# sync rendered out/things.rs; scratch repro 2026-11-03, SA-6.
# `ggen.toml` has TWO mutually exclusive schemas; mixing them refuses with
# [FM-CONFIG-101]. Schema 2 (pack-composition: [ontology].imports +
# [templates].dir + [packs]) is what book/ggen.toml itself uses.
[project]
name = "chapter-appendix-c-canonical-ggen-toml"
version = "1.0.0"
description = "Appendix C — Canonical `ggen.toml`"
authors = ["ggen-book"]
license = "MIT"

[ontology]
source = "ontology.ttl"
standard_only = false

[generation]
output_dir = "."

[[generation.rules]]
name = "things"
query = { file = "queries/extract.rq" }
template = { file = "templates/thing.tera" }
output_file = "out/things.rs"
mode = "Overwrite"
