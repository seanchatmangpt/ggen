version = 2
policy = "Syntactically invalid Turtle is refused unless it is either historical archive state under examples/archive or an exact negative fixture under packs/*/fixtures with a bound executable Chicago falsifier. Archive invalids must not be referenced by live packs, marketplace descriptors, or non-archive consumers."

