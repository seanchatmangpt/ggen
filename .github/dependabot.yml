version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Enable version updates for Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Group minor and patch updates
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # NOTE (fixed 2026-09-06): this file previously carried three more cargo
  # entries here -- directory: "/cli", "/ggen-core", "/utils" -- left over
  # from before commit fceb5149a ("refactor: reorganize workspace into
  # crates structure") moved those trees under crates/. All three had been
  # failing every week since with "dependency_file_not_found" (e.g.
  # "/utils/Cargo.toml not found") because the paths no longer exist:
  #   - cli/     -> crates/ggen-cli   (still exists, and is already a
  #                 `[workspace] members` entry in the root Cargo.toml)
  #   - ggen-core -> removed entirely 2026-07-17 (docs/jira/v26.7.16/
  #                 14-GGEN-CORE-REMOVAL-PROPOSAL.md), replaced by the
  #                 unrelated crates/ggen-engine, itself already a
  #                 `[workspace] members` entry
  #   - utils/   -> crates/ggen-utils, which no longer exists as a
  #                 standalone crate either
  # Every surviving successor crate is already a member of the root
  # workspace Cargo.toml, so the "cargo" / directory: "/" entry above
  # already resolves and updates their dependencies via the shared
  # Cargo.lock -- these three entries were pure duplication of that
  # coverage even before their paths went stale, not a distinct workspace
  # dependabot needed real per-crate visibility into. Removed rather than
  # re-pointed at crates/ggen-cli, since re-pointing would just recreate
  # the same redundant-with-root-workspace duplication under a new path.

  # Erlang/Hex.pm dependencies (TPS Jidoka)
  - package-ecosystem: "mix"
    directory: "/crates/tps-jidoka"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "erlang"
      - "hex.pm"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    allow:
      - dependency-type: "direct"

  # Erlang/Hex.pm dependencies (TAI Erlang Autonomics)
  - package-ecosystem: "mix"
    directory: "/crates/tai-erlang-autonomics"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "erlang"
      - "hex.pm"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
