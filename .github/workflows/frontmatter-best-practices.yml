name: Frontmatter best practices

on:
  push:
    branches:
      - agent/frontmatter-maximalism
    paths:
      - '.github/workflows/frontmatter-best-practices.yml'

permissions:
  contents: write

concurrency:
  group: frontmatter-best-practices
  cancel-in-progress: false

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Provision siblings and pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          components: rustfmt
          cache-key-suffix: frontmatter-best-practices

      - name: Apply semantic and pre-actuation best practices
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          # -----------------------------------------------------------------
          # template.rs: explicit topology + one semantic contract
          # -----------------------------------------------------------------
          path = Path('crates/ggen-engine/src/template.rs')
          text = path.read_text()

          text = replace_once(
              text,
              '''    #[serde(default)]
              pub for_each: Option<String>,
              /// Optional CONSTRUCT query whose result feeds the template.
          ''',
              '''    #[serde(default)]
              pub for_each: Option<String>,
              /// Explicit projection topology. `auto` preserves historical
              /// inference; `fan_out` and `aggregate` require `for_each` and
              /// remove output cardinality from Tera source-text heuristics.
              #[serde(default)]
              pub projection: ProjectionTopology,
              /// Optional CONSTRUCT query whose result feeds the template.
          ''',
              'projection field',
          )

          marker = '''}

          /// Backward-compatible textual selector used by `before`, `after`, and
          /// `skip_if`.
          '''
          insertion = r'''}

          /// User-declared projection topology.
          #[derive(Debug, Clone, Copy, Default, PartialEq, Eq, Deserialize, JsonSchema)]
          #[serde(rename_all = "snake_case")]
          pub enum ProjectionTopology {
              /// Preserve compatibility: a `to` containing `{{` fans out;
              /// otherwise explicit `for_each` aggregates; otherwise one whole output.
              #[default]
              Auto,
              /// Render one complete output per selected row.
              FanOut,
              /// Render every selected row into one output and require invariant
              /// output-phase authority across rows.
              Aggregate,
          }

          /// Effective materialization plan after resolving `projection: auto`.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum ProjectionPlan {
              Whole,
              FanOut,
              Aggregate,
          }

          impl Frontmatter {
              /// Resolve the effective output topology while preserving the old
              /// `to`-contains-`{{` convention only under `projection: auto`.
              #[must_use]
              pub fn projection_plan(&self) -> ProjectionPlan {
                  match self.projection {
                      ProjectionTopology::FanOut => ProjectionPlan::FanOut,
                      ProjectionTopology::Aggregate => ProjectionPlan::Aggregate,
                      ProjectionTopology::Auto if self.to.contains("{{") => ProjectionPlan::FanOut,
                      ProjectionTopology::Auto if self.for_each.is_some() => ProjectionPlan::Aggregate,
                      ProjectionTopology::Auto => ProjectionPlan::Whole,
                  }
              }

              /// Validate semantic coherence independently of YAML shape. Called
              /// once after parse and again after output-phase Tera rendering.
              pub fn validate_semantics(&self) -> std::result::Result<(), String> {
                  if self.to.trim().is_empty() {
                      return Err("`to` must not be blank. Remediation: declare one project-relative output path.".to_string());
                  }
                  for (name, query) in &self.sparql {
                      if name.trim().is_empty() || query.trim().is_empty() {
                          return Err("`sparql` names and query bodies must not be blank. Remediation: remove empty entries or provide a named query.".to_string());
                      }
                  }
                  if let Some(driver) = self.for_each.as_deref() {
                      if driver.trim().is_empty() {
                          return Err("`for_each` must not be blank. Remediation: name one declared `sparql` result.".to_string());
                      }
                      if !self.sparql.contains_key(driver) {
                          return Err(format!("`for_each: {driver}` does not name a declared `sparql` result. Remediation: correct the name or add that query."));
                      }
                  }
                  if self.projection != ProjectionTopology::Auto && self.for_each.is_none() {
                      return Err("explicit `projection: fan_out|aggregate` requires `for_each`. Remediation: name the driving query or use `projection: auto`.".to_string());
                  }
                  if self.inject && self.force {
                      return Err("`inject` and `force` are competing ownership modes. Remediation: retain exactly one write authority.".to_string());
                  }
                  if self.unless_exists && (self.inject || self.force) {
                      return Err("`unless_exists` makes `inject`/`force` unreachable for existing targets. Remediation: choose create-once, injection, or overwrite semantics.".to_string());
                  }
                  let placements = usize::from(self.before.is_some())
                      + usize::from(self.after.is_some())
                      + usize::from(self.at_line.is_some());
                  if placements > 0 && !self.inject {
                      return Err("`before`, `after`, and `at_line` require `inject: true`. Remediation: enable injection or remove placement authority.".to_string());
                  }
                  if placements > 1 {
                      return Err("exactly one of `before`, `after`, or `at_line` may be configured. Remediation: retain one structural port.".to_string());
                  }
                  if self.at_line == Some(0) {
                      return Err("`at_line` is one-based and cannot be zero. Remediation: use a value of 1 or greater.".to_string());
                  }
                  if self.backup && !(self.inject || self.force) {
                      return Err("`backup` has no effect without `inject` or `force`. Remediation: remove it or declare the mutation mode it protects.".to_string());
                  }
                  match self.freeze_policy {
                      Some(FreezePolicy::Checksum) => {
                          if self.freeze_slots_dir.as_deref().is_none_or(|v| v.trim().is_empty()) {
                              return Err("`freeze_policy: checksum` requires a nonblank `freeze_slots_dir`. Remediation: provide a project-relative ownership-slot directory.".to_string());
                          }
                      }
                      _ if self.freeze_slots_dir.is_some() => {
                          return Err("`freeze_slots_dir` is meaningful only with `freeze_policy: checksum`. Remediation: remove it or select checksum ownership.".to_string());
                      }
                      _ => {}
                  }
                  let has_overlay = !self.rdf.is_empty() || !self.rdf_inline.is_empty();
                  if !has_overlay && (!self.prefixes.is_empty() || self.base.is_some()) {
                      return Err("`prefixes` and `base` require `rdf` or `rdf_inline`; otherwise they are silently inert. Remediation: declare overlay RDF or remove the unused prolog.".to_string());
                  }
                  if self.shape.iter().any(|value| value.trim().is_empty()) {
                      return Err("`shape` entries must not be blank. Remediation: remove empty entries or provide a project-relative governing input.".to_string());
                  }
                  for (label, hook) in [("sh_before", self.sh_before.as_deref()), ("sh_after", self.sh_after.as_deref())] {
                      if hook.is_some_and(|value| value.trim().is_empty()) {
                          return Err(format!("`{label}` must not be blank. Remediation: remove the no-op hook or provide an admitted command."));
                      }
                  }
                  for (label, spec) in [
                      ("before", self.before.as_ref()),
                      ("after", self.after.as_ref()),
                      ("skip_if", self.skip_if.as_ref()),
                  ] {
                      if let Some(MatchSpec::Structured(rule)) = spec {
                          if rule.pattern.trim().is_empty() {
                              return Err(format!("`{label}.pattern` must not be blank. Remediation: provide a concrete structural matcher."));
                          }
                          if rule.index == 0 {
                              return Err(format!("`{label}.index` is one-based. Remediation: use 1 or greater."));
                          }
                          if rule.occurrence != MatchOccurrence::Nth && rule.index != 1 {
                              return Err(format!("`{label}.index` is used only with `occurrence: nth`. Remediation: set occurrence to nth or remove the ignored index."));
                          }
                      }
                  }
                  Ok(())
              }
          }

          /// Backward-compatible textual selector used by `before`, `after`, and
          /// `skip_if`.
          '''
          text = replace_once(text, marker, insertion, 'semantic contract insertion')

          text = replace_once(
              text,
              '''        })?;
                  Ok(Self {
                      frontmatter,
          ''',
              '''        })?;
                  frontmatter.validate_semantics().map_err(|violation| {
                      AppError::fm_tpl(23, format!("frontmatter contract invalid: {violation}"))
                  })?;
                  Ok(Self {
                      frontmatter,
          ''',
              'parse semantic validation',
          )
          text = text.replace('to, sparql, for_each, construct,', 'to, sparql, for_each, projection, construct,', 1)
          path.write_text(text)

          # -----------------------------------------------------------------
          # sync.rs: explicit topology, rendered validation, true preflight
          # -----------------------------------------------------------------
          path = Path('crates/ggen-engine/src/sync.rs')
          text = path.read_text()
          text = replace_once(
              text,
              '    template::{build_tera, sparql_to_value, Frontmatter, MatchSpec, Template},\n',
              '    template::{build_tera, sparql_to_value, Frontmatter, MatchSpec, ProjectionPlan, ProjectionTopology, Template},\n',
              'sync template imports',
          )
          text = replace_once(
              text,
              '''        plan_write, preflight_checksum_slot, preflight_structured_matchers,
                      validate_match_specs, WriteOutcome, MAX_OUTPUT_BYTES,
          ''',
              '''        plan_write, preflight_checksum_slot, preflight_host_contract,
                      validate_match_specs, WriteOutcome, MAX_OUTPUT_BYTES,
          ''',
              'sync write imports',
          )

          block = re.compile(
              r'(?ms)^        let fan_out = tpl\.frontmatter\.to\.contains\("\{\{"\);\n'
              r'.*?^        }\n(?=    }\n\n    // `\[templates\] aggregate_modules)',
          )
          replacement = r'''        match tpl.frontmatter.projection_plan() {
                      ProjectionPlan::Aggregate => {
                          let Some((body, frontmatter)) = render_aggregate_projection(
                              active_tera,
                              &tpl.body,
                              tpl_path,
                              &tpl.frontmatter,
                              &named,
                              &results,
                          )?
                          else {
                              continue;
                          };
                          admit_shape_files(root, tpl_path, &frontmatter.shape, &mut closure)?;
                          check_determinism(
                              active_tera,
                              &tpl.body,
                              tpl_path,
                              &tpl.frontmatter,
                              determinism_recheck.as_ref(),
                              ProjectionMode::Aggregate,
                              &body,
                              &frontmatter,
                          )?;
                          pending.push(PendingWrite {
                              to: frontmatter.to.clone(),
                              body,
                              frontmatter,
                          });
                      }
                      ProjectionPlan::FanOut => {
                          for (row_index, row) in results.iter().enumerate() {
                              let ctx = row_context(&named, &results, row);
                              let to = render_str(active_tera, &tpl.frontmatter.to, &ctx, tpl_path)?;
                              let body = render_str(active_tera, &tpl.body, &ctx, tpl_path)?;
                              let frontmatter = render_output_frontmatter(
                                  active_tera,
                                  &tpl.frontmatter,
                                  &ctx,
                                  tpl_path,
                                  &to,
                              )?;
                              admit_shape_files(root, tpl_path, &frontmatter.shape, &mut closure)?;
                              check_determinism(
                                  active_tera,
                                  &tpl.body,
                                  tpl_path,
                                  &tpl.frontmatter,
                                  determinism_recheck.as_ref(),
                                  ProjectionMode::Row(row_index),
                                  &body,
                                  &frontmatter,
                              )?;
                              pending.push(PendingWrite {
                                  to,
                                  body,
                                  frontmatter,
                              });
                          }
                      }
                      ProjectionPlan::Whole => {
                          let ctx = base_context(&named, &results);
                          let to = render_str(active_tera, &tpl.frontmatter.to, &ctx, tpl_path)?;
                          let body = render_str(active_tera, &tpl.body, &ctx, tpl_path)?;
                          let frontmatter = render_output_frontmatter(
                              active_tera,
                              &tpl.frontmatter,
                              &ctx,
                              tpl_path,
                              &to,
                          )?;
                          admit_shape_files(root, tpl_path, &frontmatter.shape, &mut closure)?;
                          check_determinism(
                              active_tera,
                              &tpl.body,
                              tpl_path,
                              &tpl.frontmatter,
                              determinism_recheck.as_ref(),
                              ProjectionMode::Whole,
                              &body,
                              &frontmatter,
                          )?;
                          pending.push(PendingWrite {
                              to,
                              body,
                              frontmatter,
                          });
                      }
                  }
          '''
          text, changed = block.subn(replacement, text, count=1)
          if changed != 1:
              raise SystemExit(f'projection dispatch patch count={changed}')

          text = replace_once(
              text,
              '''                for_each: None,
                          construct: None,
          ''',
              '''                for_each: None,
                          projection: ProjectionTopology::Auto,
                          construct: None,
          ''',
              'aggregator projection field',
          )

          text = replace_once(
              text,
              '''    rendered.shape = source
                      .shape
                      .iter()
                      .map(|shape| render_str(tera, shape, ctx, tpl_path))
                      .collect::<Result<Vec<_>>>()?;
                  Ok(rendered)
          ''',
              '''    rendered.shape = source
                      .shape
                      .iter()
                      .map(|shape| render_str(tera, shape, ctx, tpl_path))
                      .collect::<Result<Vec<_>>>()?;
                  rendered.validate_semantics().map_err(|violation| {
                      AppError::fm_tpl(
                          23,
                          format!(
                              "{}: rendered frontmatter contract invalid: {violation}",
                              tpl_path.display()
                          ),
                      )
                  })?;
                  Ok(rendered)
          ''',
              'rendered semantic validation',
          )

          text = replace_once(
              text,
              '''        body.push_str(&render_str(tera, body_template, &ctx, tpl_path)?);
                      let candidate =
                          render_output_frontmatter(tera, frontmatter, &ctx, tpl_path, &frontmatter.to)?;
          ''',
              '''        body.push_str(&render_str(tera, body_template, &ctx, tpl_path)?);
                      let rendered_to = render_str(tera, &frontmatter.to, &ctx, tpl_path)?;
                      let candidate =
                          render_output_frontmatter(tera, frontmatter, &ctx, tpl_path, &rendered_to)?;
          ''',
              'aggregate path rendering',
          )
          text = text.replace('static `to:` with `for_each` produced row-varying output-phase', 'aggregate projection produced row-varying output-phase', 1)
          text = text.replace('include a row binding in `to:` to fan out.', 'use `projection: fan_out` or make every rendered authority field invariant.', 1)

          text = replace_once(
              text,
              '''    let total_rendered_bytes = pending
          ''',
              '''    if let Some(oversized) = pending.iter().find(|pw| pw.body.len() > MAX_OUTPUT_BYTES) {
                      return Err(AppError::fm_tpl(
                          22,
                          format!(
                              "rendered body for `{}` is {} bytes, over the {MAX_OUTPUT_BYTES}-byte cap. Remediation: split the artifact or constrain its selected rows.",
                              oversized.to,
                              oversized.body.len()
                          ),
                      ));
                  }
                  let total_rendered_bytes = pending
          ''',
              'pre-actuation per-output limit',
          )

          text = text.replace('preflight_structured_matchers(root, rel_to, frontmatter)?', 'preflight_host_contract(root, rel_to, body, frontmatter)?')
          text = replace_once(
              text,
              '        let metadata = std::fs::metadata(&shape_path).map_err(|error| {',
              '        let metadata = std::fs::symlink_metadata(&shape_path).map_err(|error| {',
              'shape symlink metadata',
          )
          text = replace_once(
              text,
              '        if !metadata.is_file() {',
              '        if !metadata.file_type().is_file() {',
              'shape regular file check',
          )
          path.write_text(text)

          # -----------------------------------------------------------------
          # write.rs: preflight all composition + collision-safe backups
          # -----------------------------------------------------------------
          path = Path('crates/ggen-engine/src/write.rs')
          text = path.read_text()

          validator = re.compile(
              r'(?ms)^pub\(crate\) fn validate_match_specs\(frontmatter: &Frontmatter\) -> Result<\(\)> \{\n'
              r'.*?^    for \(spec, use_\) in \[',
          )
          validator_replacement = '''pub(crate) fn validate_match_specs(frontmatter: &Frontmatter) -> Result<()> {
              frontmatter.validate_semantics().map_err(|violation| {
                  AppError::fm_write(10, format!("frontmatter contract invalid: {violation}"))
              })?;
              for (spec, use_) in ['''
          text, changed = validator.subn(validator_replacement, text, count=1)
          if changed != 1:
              raise SystemExit(f'write semantic validator patch count={changed}')

          preflight = re.compile(
              r'(?ms)^/// Observe structured selectors against the current host state before shell or\n'
              r'.*?^pub\(crate\) fn preflight_structured_matchers\(\n'
              r'.*?^}\n\n(?=/// Compute the injected file content:)',
          )
          preflight_replacement = r'''/// Admit host composition, backup state, and final injection size before
          /// shell or filesystem actuation. Literal and structured markers share the
          /// same prospective composition path; structured selectors additionally emit
          /// receipt evidence.
          pub(crate) fn preflight_host_contract(
              root: &Path, rel_to: &str, rendered_body: &str, frontmatter: &Frontmatter,
          ) -> Result<Vec<String>> {
              validate_match_specs(frontmatter)?;
              if rendered_body.len() > MAX_OUTPUT_BYTES {
                  return Err(AppError::fm_write(
                      7,
                      format!(
                          "rendered output for `{rel_to}` is {} bytes, over the {MAX_OUTPUT_BYTES}-byte cap. Remediation: split the artifact or constrain its selected rows.",
                          rendered_body.len()
                      ),
                  ));
              }
              let target = resolve_target(root, rel_to)?;
              let content = match std::fs::read_to_string(&target) {
                  Ok(content) => content,
                  Err(error) if error.kind() == std::io::ErrorKind::NotFound && frontmatter.inject => {
                      return Err(AppError::fm_write(
                          3,
                          format!(
                              "inject target {} does not exist. Remediation: create the host file first or remove `inject: true`.",
                              target.display()
                          ),
                      ));
                  }
                  Err(error) if error.kind() == std::io::ErrorKind::NotFound => return Ok(Vec::new()),
                  Err(error) => return Err(error.into()),
              };

              if frontmatter.inject {
                  let prospective = inject_into(&content, rendered_body, frontmatter)?;
                  if prospective.len() > MAX_OUTPUT_BYTES {
                      return Err(AppError::fm_write(
                          7,
                          format!(
                              "injected output for `{rel_to}` is {} bytes, over the {MAX_OUTPUT_BYTES}-byte cap. Remediation: split the host artifact or reduce the injected projection.",
                              prospective.len()
                          ),
                      ));
                  }
              }
              preflight_backup_slot(&target, &content, frontmatter)?;

              let mut evidence = Vec::new();
              for (spec, use_) in [
                  (frontmatter.before.as_ref(), MatchUse::Before),
                  (frontmatter.after.as_ref(), MatchUse::After),
                  (frontmatter.skip_if.as_ref(), MatchUse::SkipIf),
              ] {
                  if let Some(spec @ MatchSpec::Structured(_)) = spec {
                      let observation = observe_match(&content, spec, use_)?;
                      evidence.push(format!("{}: {}", use_.label(), observation.describe()));
                  }
              }
              Ok(evidence)
          }

          '''
          text, changed = preflight.subn(preflight_replacement, text, count=1)
          if changed != 1:
              raise SystemExit(f'host contract preflight patch count={changed}')

          backup = re.compile(
              r'(?ms)^/// If `frontmatter\.backup` is set, copy `existing_content` to `<target>\.bak`\n'
              r'.*?^fn maybe_backup\(target: &Path, existing_content: &str, frontmatter: &Frontmatter\) -> Result<\(\)> \{\n'
              r'.*?^}\n\n(?=/// Resolve `rel_to`)',
          )
          backup_replacement = r'''fn backup_path(target: &Path) -> PathBuf {
              let mut path = target.as_os_str().to_owned();
              path.push(".bak");
              PathBuf::from(path)
          }

          /// Refuse an existing backup slot unless it is the identical witness.
          /// This prevents a later generation from silently destroying the only
          /// recovery artifact from an earlier mutation.
          fn preflight_backup_slot(
              target: &Path, existing_content: &str, frontmatter: &Frontmatter,
          ) -> Result<()> {
              if !frontmatter.backup {
                  return Ok(());
              }
              let backup = backup_path(target);
              match std::fs::symlink_metadata(&backup) {
                  Ok(metadata) if !metadata.file_type().is_file() => Err(AppError::fm_write(
                      12,
                      format!(
                          "backup slot `{}` is not a regular file. Remediation: remove or relocate the conflicting filesystem object after review.",
                          backup.display()
                      ),
                  )),
                  Ok(_) => {
                      let bytes = std::fs::read(&backup)?;
                      if bytes == existing_content.as_bytes() {
                          Ok(())
                      } else {
                          Err(AppError::fm_write(
                              12,
                              format!(
                                  "backup slot `{}` already contains a different recovery witness. Remediation: archive or remove it explicitly before overwriting the target.",
                                  backup.display()
                              ),
                          ))
                      }
                  }
                  Err(error) if error.kind() == std::io::ErrorKind::NotFound => Ok(()),
                  Err(error) => Err(error.into()),
              }
          }

          /// If `backup` is set, create `<target>.bak` without ever clobbering a
          /// different existing recovery witness.
          fn maybe_backup(target: &Path, existing_content: &str, frontmatter: &Frontmatter) -> Result<()> {
              if !frontmatter.backup {
                  return Ok(());
              }
              preflight_backup_slot(target, existing_content, frontmatter)?;
              let backup = backup_path(target);
              if !backup.exists() {
                  std::fs::write(backup, existing_content)?;
              }
              Ok(())
          }

          '''
          text, changed = backup.subn(backup_replacement, text, count=1)
          if changed != 1:
              raise SystemExit(f'backup best-practice patch count={changed}')
          path.write_text(text)

          # -----------------------------------------------------------------
          # lint.rs: match the actual render context and all rendered fields
          # -----------------------------------------------------------------
          path = Path('crates/ggen-engine/src/lint.rs')
          text = path.read_text()
          projected = re.compile(
              r'(?ms)^pub fn projected_vars\(fm: &Frontmatter\) -> Projection \{\n'
              r'.*?^}\n\n(?=/// Result of scanning one query)',
          )
          projected_replacement = r'''pub fn projected_vars(fm: &Frontmatter) -> Projection {
              let row_context = fm.projection_plan() != crate::template::ProjectionPlan::Whole;
              let mut vars = BTreeSet::new();
              vars.insert("results".to_string());
              if row_context {
                  vars.insert("row".to_string());
              }
              for (name, query) in &fm.sparql {
                  vars.insert(name.clone());
                  match select_projection(query) {
                      SelectProjection::Wildcard if row_context => return Projection::Wildcard,
                      SelectProjection::Vars(cols) if row_context => vars.extend(cols),
                      SelectProjection::Wildcard
                      | SelectProjection::Vars(_)
                      | SelectProjection::NotSelect => {}
                  }
              }
              Projection::Vars(vars)
          }

          '''
          text, changed = projected.subn(projected_replacement, text, count=1)
          if changed != 1:
              raise SystemExit(f'lint context patch count={changed}')

          anchor = '''            for var in consumed_vars(&t.frontmatter.to) {
                      if !projected.contains(&var) {
                          errors.push(AppError::fm_tpl(
                              4,
                              format!(
                                  "template `{}`: `to:` path consumes `{{{{ {var} }}}}` but no \\
                                   frontmatter SPARQL query projects `?{var}`. \\
                                   Remediation: add `?{var}` to a SELECT clause or fix the \\
                                   variable name in the `to:` pattern.",
                                  tpl_path.display()
                              ),
                          ));
                      }
                  }
          '''
          addition = anchor + r'''            let mut output_sources: Vec<(&str, &str)> = Vec::new();
                  if let Some(spec) = t.frontmatter.before.as_ref() {
                      output_sources.push(("before", spec.pattern()));
                  }
                  if let Some(spec) = t.frontmatter.after.as_ref() {
                      output_sources.push(("after", spec.pattern()));
                  }
                  if let Some(spec) = t.frontmatter.skip_if.as_ref() {
                      output_sources.push(("skip_if", spec.pattern()));
                  }
                  if let Some(value) = t.frontmatter.sh_before.as_deref() {
                      output_sources.push(("sh_before", value));
                  }
                  if let Some(value) = t.frontmatter.sh_after.as_deref() {
                      output_sources.push(("sh_after", value));
                  }
                  if let Some(value) = t.frontmatter.freeze_slots_dir.as_deref() {
                      output_sources.push(("freeze_slots_dir", value));
                  }
                  for value in &t.frontmatter.shape {
                      output_sources.push(("shape", value));
                  }
                  for (field, source) in output_sources {
                      for var in consumed_vars(source) {
                          if !projected.contains(&var) {
                              errors.push(AppError::fm_tpl(
                                  24,
                                  format!(
                                      "template `{}`: `{field}` consumes `{{{{ {var} }}}}` but that binding is unavailable in the effective projection context. Remediation: project `?{var}`, use the named query array, or select a row-based projection.",
                                      tpl_path.display()
                                  ),
                              ));
                          }
                      }
                  }
          '''
          text = replace_once(text, anchor, addition, 'lint output-phase sources')
          path.write_text(text)

          # -----------------------------------------------------------------
          # TTL schema: exact field set and truthful semantics
          # -----------------------------------------------------------------
          path = Path('crates/ggen-engine/schema/frontmatter-schema.ttl')
          text = path.read_text()
          text = replace_once(
              text,
              '        ggenspec:Frontmatter-for_each ,\n        ggenspec:Frontmatter-construct ,',
              '        ggenspec:Frontmatter-for_each ,\n        ggenspec:Frontmatter-projection ,\n        ggenspec:Frontmatter-construct ,',
              'ttl projection field list',
          )
          text = replace_once(
              text,
              '''ggenspec:Frontmatter-construct
          ''',
              '''ggenspec:Frontmatter-projection
              a ggenspec:Field ; ggenspec:name "projection" ; ggenspec:type ggenspec:ProjectionTopology ;
              ggenspec:required false ;
              rdfs:comment "Explicit output topology: auto|fan_out|aggregate. Explicit fan_out/aggregate require for_each; auto preserves historical inference." .

          ggenspec:ProjectionTopology
              a ggenspec:EnumType ;
              ggenspec:enumValue "auto" , "fan_out" , "aggregate" .

          ggenspec:Frontmatter-construct
          ''',
              'ttl projection declaration',
          )
          text = text.replace('xsd:nonNegativeInteger', 'xsd:positiveInteger', 1)
          text = text.replace('Before overwriting an existing file (force or inject), copy it to <path>.bak first. Defaults to false.', 'With force or inject, create <path>.bak before mutation; a different existing backup witness is never overwritten. Defaults to false.', 1)
          text = text.replace('LIMITATION: existence-checked only — no SHACL engine runs in this crate yet, so listed shapes are not evaluated against rendered output.', 'Paths are safely admitted as readable non-symlink regular files and their BLAKE3 bytes enter the receipt closure. LIMITATION: no SHACL conformance engine evaluates rendered output.', 1)
          text = text.replace('Required when that policy is set; ignored otherwise.', 'Required when that policy is set; rejected otherwise.', 1)
          text = text.replace('Extra Turtle @prefix declarations (prefix name -> IRI) prepended before parsing rdf:/rdf_inline: content. Defaults to empty.', 'Extra Turtle @prefix declarations prepended before parsing rdf:/rdf_inline: content. Rejected when no overlay RDF is declared. Defaults to empty.', 1)
          text = text.replace('RDF base IRI (@base) prepended before parsing rdf:/rdf_inline: content.', 'RDF base IRI (@base) prepended before parsing rdf:/rdf_inline: content. Rejected when no overlay RDF is declared.', 1)
          text = text.replace('Defaults: matcher=contains, scope=auto, occurrence=first, index=1, case_sensitive=true, trim=false.', 'Defaults: matcher=contains, scope=auto, occurrence=first, index=1, case_sensitive=true, trim=false. index is meaningful only with occurrence=nth.', 1)
          path.write_text(text)

          # -----------------------------------------------------------------
          # Canonical architectural reference: remove syntax heuristics as law
          # -----------------------------------------------------------------
          Path('docs/reference/frontmatter-maximalism.md').write_text(r'''# Frontmatter maximalism

          ggen frontmatter is a closed ontology-to-infrastructure lifecycle program. Its Hygen lineage remains visible in creation, preservation, injection, and native lifecycle hooks. ggen extends that grammar with RDF overlays, SPARQL views, explicit projection topology, semantic validation, bounded manufacturing, freeze ownership, and chained receipts.

          The executable contract is `template.rs` + `sync.rs` + `write.rs`; the TTL vocabulary and tests are required mirrors, not independent authorities.

          ## Effective phase law

          | Phase | Properties | Best-practice law |
          |---|---|---|
          | Resolve | `from`, `rdf`, `rdf_inline`, `prefixes`, `base` | Prolog fields require an actual overlay; inert configuration is refused. |
          | Derive/extract | `construct`, `when`, `sparql`, `for_each` | A named result explicitly supplies the row set. |
          | Topology | `projection` | `fan_out` and `aggregate` are explicit; `auto` exists only for compatibility. |
          | Output projection | `to`, body, match patterns, hooks, shapes, freeze slots | Every rendered lifecycle field is validated and linted in the same effective context. |
          | Write law | `inject`, placement, `unless_exists`, `force`, `skip_empty`, `backup`, freeze policy | Contradictory and unreachable authority combinations are refused. |

          ## Explicit topology

          ```yaml
          sparql:
            services: |
              SELECT ?service ?module WHERE { ... } ORDER BY ?service
          for_each: services
          projection: fan_out
          to: "src/{{ row.module }}.rs"
          ```

          `projection: fan_out` creates one complete lifecycle projection per row. `projection: aggregate` concatenates row-rendered bodies into one output and requires the rendered path, matchers, hooks, shapes, and ownership law to be invariant across rows. `projection: auto` preserves the historical `to`-contains-`{{` inference and should be treated as a migration mode rather than new-authoring guidance.

          ## Semantic contract

          YAML shape alone is insufficient. The frontmatter validator rejects:

          - blank paths, query names, query bodies, hooks, shapes, and structured patterns;
          - `for_each` names that do not exist;
          - explicit topology without `for_each`;
          - `inject` combined with `force`;
          - `unless_exists` combined with mutation authority;
          - placement fields without injection or multiple placement fields;
          - zero-based line/index values and ignored non-`nth` indexes;
          - inert `backup`, `freeze_slots_dir`, `prefixes`, or `base` declarations.

          Validation runs after parse and again after Tera rendering, so a nonblank template expression that renders to an invalid value still fails closed.

          ## Pre-actuation admission

          Before `sh_before`, ggen now proves:

          - target containment and canonical uniqueness;
          - per-query, per-output, output-count, and aggregate byte budgets;
          - checksum ownership readability;
          - injection target existence;
          - literal and structured marker feasibility;
          - `at_line` range;
          - final prospective injected size;
          - backup-slot compatibility;
          - governing-shape path, non-symlink regular-file type, readability, and receipt hash.

          A different existing `.bak` file is a recovery witness, not scratch space, and is never silently overwritten.

          ## Static lint parity

          Whole-output templates receive named query arrays and `results`; they do not receive `row` or flattened SELECT columns. Fan-out and aggregate templates do. The linter now uses that exact context and checks every Tera-rendered lifecycle field, not only body and `to`.

          ## Bounded projection policy

          ```text
          one named query result       <= 4,096 rows
          one sync                     <= 8,192 outputs
          one rendered artifact        <= 10 MiB
          all rendered bodies per sync <= 64 MiB
          ```

          These limits are receipt-bound governing inputs.

          ## Shell boundary

          `sh_before` and `sh_after` remain raw `sh -c` compatibility surfaces protected only by a bounded denylist. They are executable supply-chain authority, not data. This checkpoint improves everything that can be proved before invocation, but does not claim sandboxing, capability isolation, transactionality, rollback, or complete receipts for arbitrary shell effects.

          ## Hygen lineage

          ```text
          Hygen: add -> preserve -> inject -> execute
          ggen:  admit -> derive -> project -> compose -> actuate -> verify -> receipt -> replay
          ```

          Maximalism means maximum lawful consequence under explicit phase and authority—not maximum simultaneous options.
          ''')

          # Keep the long lifecycle reference truthful at its highest-impact seams.
          path = Path('docs/reference/template-directives.md')
          text = path.read_text()
          text = text.replace('exactly 25 properties', 'exactly 26 properties')
          text = text.replace('for_each: 00_driver\n', 'for_each: 00_driver\nprojection: fan_out\n', 1)
          text = text.replace('| `for_each` | optional named result; default absent | cardinality | explicitly selects rows for fan-out or aggregation | ALIVE |', '| `for_each` | optional named result; default absent | cardinality | explicitly selects the driving rows | ALIVE |\n| `projection` | `auto`, `fan_out`, `aggregate`; default `auto` | topology | explicitly selects whole/fan-out/aggregate behavior | ALIVE |', 1)
          text = text.replace('| `skip_empty` | boolean; default `false` | apply | suppresses empty rendered artifacts | ALIVE with path-preflight gap |', '| `skip_empty` | boolean; default `false` | apply | suppresses empty rendered artifacts after target admission | ALIVE |', 1)
          text = text.replace('| `backup` | boolean; default `false` | write | writes `<target>.bak` before force/inject mutation | PARTIAL_ALIVE |', '| `backup` | boolean; default `false` | preflight/write | preserves a non-clobbering recovery witness before force/inject mutation | ALIVE |', 1)
          text = text.replace('| `shape` | string list; default empty | render/preflight | declares and existence-checks governing paths | PARTIAL_ALIVE |', '| `shape` | string list; default empty | render/preflight | admits non-symlink regular governing inputs and receipt-binds their bytes | ALIVE for input admission; SHACL evaluation unsupported |', 1)
          text = text.replace('1. `skip_empty` may skip before matcher or path preflight;', '1. the rendered target is admitted before `skip_empty`;')
          text = text.replace('except for the skip-path gaps recorded in section 8.', 'before any skip or hook decision.')
          text = text.replace('existence-checks governing paths', 'admits readable regular governing inputs')
          path.write_text(text)

          # -----------------------------------------------------------------
          # Real-boundary tests
          # -----------------------------------------------------------------
          Path('crates/ggen-engine/tests/frontmatter_best_practices_e2e.rs').write_text(r'''use std::path::Path;

          use ggen_engine::sync::{sync, SyncOptions};
          use tempfile::TempDir;

          const MANIFEST: &str = r#"
          [project]
          name = "frontmatter-best-practices"

          [ontology]
          source = "ontology.ttl"

          [templates]
          dir = "templates"
          "#;

          fn scaffold(root: &Path, ontology: &str) {
              std::fs::write(root.join("ggen.toml"), MANIFEST).unwrap();
              std::fs::write(root.join("ontology.ttl"), ontology).unwrap();
              std::fs::create_dir_all(root.join("templates")).unwrap();
          }

          fn template(root: &Path, name: &str, source: &str) {
              std::fs::write(root.join("templates").join(name), source).unwrap();
          }

          const TWO_ROWS: &str = r#"
          @prefix ex: <http://example.org/> .
          ex:a ex:name "a" ; ex:group "shared" .
          ex:b ex:name "b" ; ex:group "shared" .
          "#;

          #[test]
          fn explicit_fan_out_does_not_depend_on_interpolation_syntax() {
              let dir = TempDir::new().unwrap();
              scaffold(dir.path(), TWO_ROWS);
              template(dir.path(), "fanout.tmpl", r#"---
          to: '{% if row.name == "a" %}a.txt{% else %}b.txt{% endif %}'
          sparql:
            rows: |
              PREFIX ex: <http://example.org/>
              SELECT ?name WHERE { ?s ex:name ?name } ORDER BY ?name
          for_each: rows
          projection: fan_out
          ---
          {{ row.name }}
          "#);
              sync(dir.path(), SyncOptions::default()).unwrap();
              assert_eq!(std::fs::read_to_string(dir.path().join("a.txt")).unwrap(), "a\n");
              assert_eq!(std::fs::read_to_string(dir.path().join("b.txt")).unwrap(), "b\n");
          }

          #[test]
          fn explicit_aggregate_allows_invariant_rendered_path() {
              let dir = TempDir::new().unwrap();
              scaffold(dir.path(), TWO_ROWS);
              template(dir.path(), "aggregate.tmpl", r#"---
          to: "{{ row.group }}.txt"
          sparql:
            rows: |
              PREFIX ex: <http://example.org/>
              SELECT ?name ?group WHERE { ?s ex:name ?name ; ex:group ?group } ORDER BY ?name
          for_each: rows
          projection: aggregate
          ---
          {{ row.name }}
          "#);
              sync(dir.path(), SyncOptions::default()).unwrap();
              assert_eq!(std::fs::read_to_string(dir.path().join("shared.txt")).unwrap(), "a\nb\n");
          }

          #[test]
          fn contradictory_write_authority_refuses_at_parse() {
              let dir = TempDir::new().unwrap();
              scaffold(dir.path(), "@prefix ex: <http://example.org/> .\n");
              template(dir.path(), "bad.tmpl", "---\nto: out.txt\ninject: true\nforce: true\nsh_before: 'echo ran > hook.log'\n---\nbody\n");
              let error = sync(dir.path(), SyncOptions::default()).unwrap_err();
              assert!(error.to_string().contains("FM-TPL-023"), "{error}");
              assert!(!dir.path().join("hook.log").exists());
          }

          #[test]
          fn explicit_projection_requires_driver() {
              let dir = TempDir::new().unwrap();
              scaffold(dir.path(), "@prefix ex: <http://example.org/> .\n");
              template(dir.path(), "bad.tmpl", "---\nto: out.txt\nprojection: fan_out\n---\nbody\n");
              let error = sync(dir.path(), SyncOptions::default()).unwrap_err();
              assert!(error.to_string().contains("FM-TPL-023"), "{error}");
          }

          #[test]
          fn literal_marker_and_backup_are_preflighted_before_hook() {
              let dir = TempDir::new().unwrap();
              scaffold(dir.path(), "@prefix ex: <http://example.org/> .\n");
              std::fs::write(dir.path().join("host.rs"), "host\n").unwrap();
              template(dir.path(), "inject.tmpl", "---\nto: host.rs\ninject: true\nbefore: '// MISSING'\nbackup: true\nsh_before: 'echo ran > hook.log'\n---\ngenerated\n");
              let error = sync(dir.path(), SyncOptions::default()).unwrap_err();
              assert!(error.to_string().contains("FM-WRITE-004"), "{error}");
              assert!(!dir.path().join("hook.log").exists());
              assert!(!dir.path().join("host.rs.bak").exists());
          }

          #[test]
          fn missing_injection_target_refuses_before_hook() {
              let dir = TempDir::new().unwrap();
              scaffold(dir.path(), "@prefix ex: <http://example.org/> .\n");
              template(dir.path(), "inject.tmpl", "---\nto: absent.rs\ninject: true\nsh_before: 'echo ran > hook.log'\n---\ngenerated\n");
              let error = sync(dir.path(), SyncOptions::default()).unwrap_err();
              assert!(error.to_string().contains("FM-WRITE-003"), "{error}");
              assert!(!dir.path().join("hook.log").exists());
          }

          #[test]
          fn different_existing_backup_is_never_clobbered() {
              let dir = TempDir::new().unwrap();
              scaffold(dir.path(), "@prefix ex: <http://example.org/> .\n");
              std::fs::write(dir.path().join("out.txt"), "current\n").unwrap();
              std::fs::write(dir.path().join("out.txt.bak"), "older witness\n").unwrap();
              template(dir.path(), "force.tmpl", "---\nto: out.txt\nforce: true\nbackup: true\nsh_before: 'echo ran > hook.log'\n---\nnew\n");
              let error = sync(dir.path(), SyncOptions::default()).unwrap_err();
              assert!(error.to_string().contains("FM-WRITE-012"), "{error}");
              assert!(!dir.path().join("hook.log").exists());
              assert_eq!(std::fs::read_to_string(dir.path().join("out.txt")).unwrap(), "current\n");
              assert_eq!(std::fs::read_to_string(dir.path().join("out.txt.bak")).unwrap(), "older witness\n");
          }

          #[cfg(unix)]
          #[test]
          fn shape_symlink_refuses_before_hook() {
              use std::os::unix::fs::symlink;
              let dir = TempDir::new().unwrap();
              scaffold(dir.path(), "@prefix ex: <http://example.org/> .\n");
              std::fs::create_dir_all(dir.path().join("shapes")).unwrap();
              std::fs::write(dir.path().join("shapes/real.ttl"), "@prefix sh: <http://www.w3.org/ns/shacl#> .\n").unwrap();
              symlink("real.ttl", dir.path().join("shapes/link.ttl")).unwrap();
              template(dir.path(), "shape.tmpl", "---\nto: out.txt\nshape:\n  - shapes/link.ttl\nsh_before: 'echo ran > hook.log'\n---\nbody\n");
              let error = sync(dir.path(), SyncOptions::default()).unwrap_err();
              assert!(error.to_string().contains("FM-TPL-014"), "{error}");
              assert!(!dir.path().join("hook.log").exists());
          }
          ''')

          Path('crates/ggen-engine/tests/frontmatter_lint_best_practices.rs').write_text(r'''use std::path::Path;

          use ggen_engine::{lint::lint_template, template::Template};

          #[test]
          fn whole_projection_does_not_claim_flattened_row_bindings() {
              let template = Template::parse(r#"---
          to: out.txt
          sparql:
            rows: "SELECT ?name WHERE { ?s ?p ?name } ORDER BY ?name"
          ---
          {{ name }}
          "#).unwrap();
              let errors = lint_template(Path::new("whole.tmpl"), &template);
              assert!(errors.iter().any(|error| error.to_string().contains("FM-TPL-003")));
          }

          #[test]
          fn row_projection_lints_every_rendered_lifecycle_field() {
              let template = Template::parse(r#"---
          to: "{{ row.name }}.txt"
          sparql:
            rows: "SELECT ?name WHERE { ?s ?p ?name } ORDER BY ?name"
          for_each: rows
          projection: fan_out
          sh_after: "echo {{ missing }}"
          ---
          {{ row.name }}
          "#).unwrap();
              let errors = lint_template(Path::new("row.tmpl"), &template);
              assert!(errors.iter().any(|error| error.to_string().contains("FM-TPL-024")));
          }
          ''')
          PY

          cargo fmt --all
          git diff --check

      - name: Execute frontmatter falsifiers
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p ggen-engine --lib template::tests -- --nocapture
          cargo test -p ggen-engine --lib write::tests -- --nocapture
          cargo test -p ggen-engine --lib lint::tests -- --nocapture
          cargo test -p ggen-engine --test frontmatter_best_practices_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_lint_best_practices -- --nocapture
          cargo test -p ggen-engine --test frontmatter_fortune5_hardening_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_cardinality_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_matchers_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_maximalism_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_schema_match -- --nocapture

      - name: Publish verified best practices
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/frontmatter-best-practices.yml
          git diff --check
          git config user.name "ggen frontmatter best practices"
          git config user.email "actions@github.com"
          git add crates/ggen-engine/src/template.rs \
                  crates/ggen-engine/src/sync.rs \
                  crates/ggen-engine/src/write.rs \
                  crates/ggen-engine/src/lint.rs \
                  crates/ggen-engine/schema/frontmatter-schema.ttl \
                  crates/ggen-engine/tests/frontmatter_best_practices_e2e.rs \
                  crates/ggen-engine/tests/frontmatter_lint_best_practices.rs \
                  docs/reference/frontmatter-maximalism.md \
                  docs/reference/template-directives.md \
                  .github/workflows/frontmatter-best-practices.yml
          git commit -m "feat(engine): enforce frontmatter best practices"
          git push origin HEAD:agent/frontmatter-maximalism
