name: Agent ontology import startup repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-ontology-import-startup-repair
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: ""

jobs:
  replay-verified-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Replay verified source transformation
        run: bash .github/agent/apply-ontology-import-fix.sh

      - name: Reproduce formatting receipt
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Reproduce bounded-diff receipt
        run: |
          git diff --check
          git diff --stat
          test -n "$(git diff -- crates/ggen-engine/src/graph.rs crates/ggen-engine/src/generation_rules.rs crates/ggen-engine/src/sync.rs crates/ggen-engine/src/verbs/handlers.rs)"

      - name: Remove branch-only actuator
        run: |
          rm -f .github/agent/apply-ontology-import-fix.sh
          rmdir .github/agent 2>/dev/null || true
          rm -f .github/workflows/agent-ontology-import-fix.yml

      - name: Commit receipt-backed repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(engine): batch ontology imports atomically"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
