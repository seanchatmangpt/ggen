name: Agent ontology import startup repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-ontology-import-startup-repair
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: ""

jobs:
  implement-verify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Capture baseline Clippy diagnostics
        run: cargo clippy -p ggen-engine --lib --no-deps --message-format=json > /tmp/clippy-base.json

      - name: Apply bounded source repair
        run: bash .github/agent/apply-ontology-import-fix.sh

      - name: Format
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Compile ggen-engine
        run: cargo check -p ggen-engine --lib

      - name: Run ontology batch boundary tests
        run: cargo test -p ggen-engine --lib ontology_batch -- --nocapture

      - name: Run startup benchmark receipt
        run: cargo test -p ggen-engine --lib ontology_batch_startup_benchmark_receipt -- --ignored --nocapture

      - name: Capture patched Clippy diagnostics
        run: cargo clippy -p ggen-engine --lib --no-deps --message-format=json > /tmp/clippy-patched.json

      - name: Refuse new Clippy diagnostics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def diagnostics(path: str):
              found = set()
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get("reason") != "compiler-message":
                      continue
                  message = event.get("message") or {}
                  if message.get("level") != "warning":
                      continue
                  primary = next(
                      (span for span in message.get("spans", []) if span.get("is_primary")),
                      {},
                  )
                  code = (message.get("code") or {}).get("code", "")
                  source = "\n".join(
                      fragment.get("text", "").strip()
                      for fragment in primary.get("text", [])
                  )
                  found.add(
                      (
                          code,
                          message.get("message", ""),
                          primary.get("file_name", ""),
                          source,
                      )
                  )
              return found

          baseline = diagnostics("/tmp/clippy-base.json")
          patched = diagnostics("/tmp/clippy-patched.json")
          introduced = sorted(patched - baseline)
          if introduced:
              print("new Clippy diagnostics introduced by ontology import repair:")
              for code, message, file_name, source in introduced:
                  print(f"- {file_name}: {code}: {message}")
                  if source:
                      print(f"  {source}")
              raise SystemExit(1)
          print(
              json.dumps(
                  {
                      "baseline_diagnostics": len(baseline),
                      "patched_diagnostics": len(patched),
                      "introduced_diagnostics": 0,
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Remove branch-only actuator
        run: |
          rm -f .github/agent/apply-ontology-import-fix.sh
          rmdir .github/agent 2>/dev/null || true
          rm -f .github/workflows/agent-ontology-import-fix.yml

      - name: Review bounded diff
        run: |
          git status --short
          git diff --check
          git diff --stat

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(engine): batch ontology imports atomically"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
