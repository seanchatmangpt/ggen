name: BBlock Bootstrap

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bblock-bootstrap-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  manufacture:
    name: Manufacture and verify cloud building blocks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: ""
      GGEN_ARCHITECTURE_OBSERVED_AT: synthetic-cloud-bblock-v1
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/ggen-architecture
            .

      - name: Expand admitted payload
        run: |
          cat .github/bblock-bootstrap/payload.* > /tmp/bblock-payload.b64
          base64 --decode /tmp/bblock-payload.b64 > /tmp/bblock-payload.tar.gz
          tar -xzf /tmp/bblock-payload.tar.gz -C .
          cat .github/bblock-bootstrap/script.* > /tmp/bblock-bootstrap.sh.gz.b64
          base64 --decode /tmp/bblock-bootstrap.sh.gz.b64 | gzip -d > /tmp/bblock-bootstrap.sh
          chmod +x /tmp/bblock-bootstrap.sh

      - name: Implement, verify, and publish exact source
        run: /tmp/bblock-bootstrap.sh
