name: ggen Self-Host Retrofit

on:
  pull_request:
    paths:
      - "self-host/**"
      - "packs/ggen-self-host-pack/**"
      - "packs/gall-core-pack/**"
      - ".github/workflows/ggen-self-host.yml"
      - "Cargo.toml"
      - "ggen.toml"
      - "crates/**"
      - "packs/**"
      - ".specify/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ggen-self-host-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe-manufacture-falsify-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Provision pinned ggen build
        uses: ./.github/actions/setup-ggen-build

      - name: Prove seed fails closed before observation
        run: |
          cargo build -p ggen-cli-lib --bin ggen
          set +e
          (cd self-host && ../target/debug/ggen sync run) >/tmp/pre-observation.out 2>/tmp/pre-observation.err
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "GGEN_SELF_HOST_OBSERVATION_INCOMPLETE" /tmp/pre-observation.err

      - name: Execute observer unit witnesses and falsifiers
        run: python3 -m unittest discover -s self-host/tests -p 'test_*.py' -v

      - name: Observe exact Git tree and normalize live authority
        run: python3 self-host/scripts/observe_self_host.py

      - name: Independently verify revision, Git-object path set, bytes, and receipt
        run: python3 self-host/scripts/verify_observation.py

      - name: Manufacture self-hosting and Gall consequences
        run: |
          cd self-host
          ../target/debug/ggen sync run
          ../target/debug/ggen receipt verify
          test -s generated/BOOTSTRAP_BOUNDARY.md
          test -s generated/REPOSITORY_CENSUS.md
          test -s generated/AUTHORITY_MAP.md
          test -s generated/LOAD_PATHS.md
          test -s generated/OUTPUT_OWNERSHIP.md
          test -s generated/SELF_HOST_CROWN.md
          test -s docs/GALL_CHECKPOINT_ROADMAP.md
          test -s docs/GALL_AGENT_WORK_ORDERS.md
          test -s docs/GALL_JIRA_TICKET_CATALOG.md
          test -s jira/GALL_JIRA_WORK_ITEMS.csv
          test -s automation/GALL_AUTOMATION_WORK_ITEMS.csv
          test -s scripts/gall/gall
          test -s scripts/gall/run-checkpoints.sh
          grep -q "$(git -C .. rev-parse HEAD)" generated/REPOSITORY_CENSUS.md
          grep -q "PARTIAL_ALIVE" generated/SELF_HOST_CROWN.md
          grep -q "GGEN-DOGFOOD-CENSUS" docs/GALL_AGENT_WORK_ORDERS.md

      - name: Execute Gall plan-only control plane and handoff
        run: |
          cd self-host
          bash scripts/gall/gall automation validate
          bash scripts/gall/gall work next | tee /tmp/gall-next.txt
          grep -q "GGEN-DOGFOOD-CENSUS" /tmp/gall-next.txt
          bash scripts/gall/gall work dispatch GGEN-DOGFOOD-CENSUS
          bash scripts/gall/gall receipt verify
          test -s .gall/dispatch/GGEN-DOGFOOD-CENSUS/WORK_ORDER.md
          grep -q "MUST NOT" .gall/dispatch/GGEN-DOGFOOD-CENSUS/WORK_ORDER.md

      - name: Execute Gall checkpoint witness, falsifier, receipt, and clean replay
        run: |
          cd self-host
          bash scripts/gall/run-checkpoints.sh
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('evidence/gall/ontology.ttl').read_text()
          for field in ['runnerExitCode', 'witnessExitCode', 'falsifierExitCode', 'receiptExitCode', 'replayExitCode']:
              values = [int(value) for value in re.findall(rf'gall:{field} (\d+)', text)]
              assert values and all(value == 0 for value in values), (field, values)
          assert 'gall:independentReplay true' in text
          PY

      - name: Prove second manufacture is byte-identical
        run: |
          find self-host/generated self-host/observed self-host/docs self-host/jira self-host/automation self-host/scripts/gall self-host/.github self-host/ontology.ttl -type f -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/self-host-first.sha256
          (cd self-host && ../target/debug/ggen sync run && ../target/debug/ggen receipt verify)
          find self-host/generated self-host/observed self-host/docs self-host/jira self-host/automation self-host/scripts/gall self-host/.github self-host/ontology.ttl -type f -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/self-host-second.sha256
          diff -u /tmp/self-host-first.sha256 /tmp/self-host-second.sha256

      - name: Refuse incomplete observed RDF
        run: |
          cp self-host/ontology.ttl /tmp/self-host-ontology.ttl
          sed -i '/gsh:observationDigest/d' self-host/ontology.ttl
          set +e
          (cd self-host && ../target/debug/ggen sync run) >/tmp/sabotage.out 2>/tmp/sabotage.err
          code=$?
          set -e
          mv /tmp/self-host-ontology.ttl self-host/ontology.ttl
          test "$code" -ne 0
          grep -q "GGEN_SELF_HOST_OBSERVATION_INCOMPLETE" /tmp/sabotage.err

      - name: Prove observer is read-only outside self-host
        run: |
          git diff --exit-code -- . ':(exclude)self-host/ontology.ttl' ':(exclude)self-host/observed/**' ':(exclude)self-host/generated/**' ':(exclude)self-host/docs/**' ':(exclude)self-host/jira/**' ':(exclude)self-host/automation/**' ':(exclude)self-host/scripts/gall/**' ':(exclude)self-host/.github/**' ':(exclude)self-host/evidence/**' ':(exclude)self-host/receipts/**' ':(exclude)self-host/.gall/**' ':(exclude)self-host/.ggen-v2/**' ':(exclude)self-host/ggen.lock'
          ! grep -RInE 'requests\.|urllib\.request|socket\.|boto|azure|google\.cloud|kubectl|terraform apply|git push|git commit' self-host/scripts/observe_repository.py self-host/scripts/observe_exact_tree.py self-host/scripts/normalize_observation.py self-host/scripts/observe_self_host.py

      - name: Upload observation, Gall work package, and receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ggen-self-host-${{ github.sha }}
          path: |
            self-host/observed
            self-host/generated
            self-host/docs
            self-host/jira
            self-host/automation
            self-host/evidence
            self-host/receipts
            self-host/.ggen-v2
          if-no-files-found: error
