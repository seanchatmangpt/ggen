name: Apply Book Gap Repairs

on:
  push:
    branches:
      - agent/post-agi-docs-core-team
    paths:
      - 'book/scripts/repair_archive_ttl.py'
      - 'book/tests/test_gap_closure_chicago.py'
      - 'examples/archive/**/*.ttl'
      - '.github/workflows/apply-gap-repairs.yml'

permissions:
  contents: write

concurrency:
  group: apply-book-gap-repairs
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/post-agi-docs-core-team
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Install independent RDF parser
        run: python3 -m pip install --disable-pip-version-check --quiet 'rdflib==7.1.4'

      - name: Apply deterministic source repairs
        run: python3 book/scripts/repair_archive_ttl.py --write

      - name: Chicago TDD state tests
        run: python3 -m unittest -v book.tests.test_gap_closure_chicago.ArchiveTurtleStateTests book.tests.test_gap_closure_chicago.CapabilityLedgerStateTests

      - name: Commit only admitted repairs
        run: |
          set -euo pipefail
          if git diff --quiet -- examples/archive; then
            echo 'No archive Turtle repairs required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/archive
          git commit -m 'fix(examples): repair archived Turtle corpus'
          git push origin HEAD:agent/post-agi-docs-core-team
