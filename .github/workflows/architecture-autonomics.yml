name: Architecture Autonomics

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "architecture/**"
      - "tools/ggen-architecture/**"
      - "docs/architecture/MACHINERY_AUTOMATION_AUTONOMICS.md"
      - ".github/workflows/architecture-autonomics.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "architecture/**"
      - "tools/ggen-architecture/**"
      - ".github/workflows/architecture-autonomics.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: architecture-autonomics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify machinery and autonomic receipts
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: ""
      GGEN_ARCHITECTURE_OBSERVED_AT: synthetic-proof-v1

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/ggen-architecture

      - name: Apply machine-applicable Clippy repairs
        run: |
          cargo clippy --fix \
            --manifest-path tools/ggen-architecture/Cargo.toml \
            --all-targets --allow-dirty --allow-staged || true

      - name: Format source
        run: cargo fmt --manifest-path tools/ggen-architecture/Cargo.toml --all

      - name: Commit exact compiler repairs
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- tools/ggen-architecture; then
            exit 0
          fi
          git config user.name "ggen architecture receipt bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/ggen-architecture
          git commit -m "fix(architecture): apply compiler-suggested repairs"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Check
        run: cargo check --manifest-path tools/ggen-architecture/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path tools/ggen-architecture/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path tools/ggen-architecture/Cargo.toml --all-targets

      - name: Manufacture architecture receipts
        run: bash architecture/run-autonomics.sh

      - name: Prove zero direct actuation
        run: |
          test "$(jq -r '.actuation_performed' target/architecture-receipts/autonomic-cycle.json)" = "false"
          test "$(jq '.intents | length > 0' target/architecture-receipts/autonomic-cycle.json)" = "true"

      - name: Upload receipts
        uses: actions/upload-artifact@v4
        with:
          name: architecture-autonomic-receipts
          path: target/architecture-receipts
          if-no-files-found: error
