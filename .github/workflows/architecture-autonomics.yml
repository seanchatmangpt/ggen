name: Architecture Autonomics

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "architecture/**"
      - "tools/ggen-architecture/**"
      - "docs/architecture/MACHINERY_AUTOMATION_AUTONOMICS.md"
      - ".github/workflows/architecture-autonomics.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "architecture/**"
      - "tools/ggen-architecture/**"
      - ".github/workflows/architecture-autonomics.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: architecture-autonomics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify machinery and autonomic receipts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: ""
      GGEN_ARCHITECTURE_OBSERVED_AT: synthetic-proof-v1

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/ggen-architecture

      - name: Refactor Fortune 5 policy states
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/ggen-architecture/src/fortune5.rs")
          source = path.read_text(encoding="utf-8")
          old = '''/// Policy governing evidence admission for a Fortune 5 assessment.
          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          pub struct Fortune5Policy {
              /// Require a verifier distinct from the evidence producer.
              pub require_independent_verifier: bool,
              /// Require the operator and approver to be different principals.
              pub require_segregation_of_duties: bool,
              /// Require one or more attached artifacts for every proof record.
              pub require_artifacts: bool,
              /// Require all twenty-one dimensions for Level 5 standing.
              pub conjunctive_level_five: bool,
          }

          impl Default for Fortune5Policy {
              fn default() -> Self {
                  Self {
                      require_independent_verifier: true,
                      require_segregation_of_duties: true,
                      require_artifacts: true,
                      conjunctive_level_five: true,
                  }
              }
          }
          '''
          new = '''/// Rule governing how Level 5 standing is calculated.
          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          pub struct LevelFivePolicy {
              /// Require all twenty-one dimensions for Level 5 standing.
              pub conjunctive_level_five: bool,
          }

          impl Default for LevelFivePolicy {
              fn default() -> Self {
                  Self {
                      conjunctive_level_five: true,
                  }
              }
          }

          /// Policy governing evidence admission for a Fortune 5 assessment.
          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          pub struct Fortune5Policy {
              /// Require a verifier distinct from the evidence producer.
              pub require_independent_verifier: bool,
              /// Require the operator and approver to be different principals.
              pub require_segregation_of_duties: bool,
              /// Require one or more attached artifacts for every proof record.
              pub require_artifacts: bool,
              /// Level 5 calculation rule, flattened to preserve the JSON contract.
              #[serde(flatten)]
              pub level_five: LevelFivePolicy,
          }

          impl Default for Fortune5Policy {
              fn default() -> Self {
                  Self {
                      require_independent_verifier: true,
                      require_segregation_of_duties: true,
                      require_artifacts: true,
                      level_five: LevelFivePolicy::default(),
                  }
              }
          }
          '''
          if old not in source:
              raise SystemExit("Fortune5Policy source boundary not found")
          source = source.replace(old, new, 1)
          source = source.replace(
              "program.policy.conjunctive_level_five",
              "program.policy.level_five.conjunctive_level_five",
              1,
          )
          path.write_text(source, encoding="utf-8")
          PY

      - name: Format source
        run: cargo fmt --manifest-path tools/ggen-architecture/Cargo.toml --all

      - name: Commit exact policy repair
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- tools/ggen-architecture; then
            exit 0
          fi
          git config user.name "ggen Fortune 5 receipt bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/ggen-architecture
          git commit -m "refactor(architecture): type Fortune 5 policy states"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Check
        run: cargo check --manifest-path tools/ggen-architecture/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path tools/ggen-architecture/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path tools/ggen-architecture/Cargo.toml --all-targets

      - name: Manufacture architecture receipts
        run: bash architecture/run-autonomics.sh

      - name: Prove zero direct actuation
        run: |
          test "$(jq -r '.actuation_performed' target/architecture-receipts/autonomic-cycle.json)" = "false"
          test "$(jq '.intents | length > 0' target/architecture-receipts/autonomic-cycle.json)" = "true"
          test "$(jq -r '.actuation_performed' target/architecture-receipts/fortune5-autonomic-plan.json)" = "false"

      - name: Prove Fortune 5 contract
        run: |
          test "$(jq '.dimensions | length' target/architecture-receipts/fortune5-catalog.json)" = "21"
          test "$(jq '[.dimensions[].obligations[]] | length' target/architecture-receipts/fortune5-catalog.json)" = "63"
          test "$(jq -r '.level_five_ready' target/architecture-receipts/fortune5-assessment.json)" = "true"
          test "$(jq '.alive_dimensions' target/architecture-receipts/fortune5-assessment.json)" = "21"
          test "$(jq '.passed_obligations' target/architecture-receipts/fortune5-assessment.json)" = "63"
          test "$(jq -r '.synthetic' target/architecture-receipts/fortune5-assessment.json)" = "true"
          test "$(jq '[.intents[].kind] | index("submit_promotion") == null' target/architecture-receipts/fortune5-autonomic-plan.json)" = "true"
          test "$(jq '[.intents[].kind] | index("reverify") != null' target/architecture-receipts/fortune5-autonomic-plan.json)" = "true"

      - name: Upload receipts
        uses: actions/upload-artifact@v4
        with:
          name: architecture-autonomic-receipts
          path: target/architecture-receipts
          if-no-files-found: error
