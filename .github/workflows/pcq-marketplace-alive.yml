name: PCQ Marketplace ALIVE

on:
  pull_request:
    paths:
      - packs/pcq-marketplace-pack/**
      - examples/pcq-marketplace/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcq-marketplace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manufacture-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: examples/pcq-marketplace
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt,clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Build ggen manufacturing kernel
        working-directory: .
        run: cargo build --release -p ggen-cli-lib --bin ggen

      - name: Manufacture and prove byte-stable replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ggen/evidence
          ../../target/release/ggen sync run
          find . -type f ! -path './.ggen/*' ! -path './.ggen-v2/*' -print0 | sort -z | xargs -0 sha256sum > .ggen/evidence/projection-first.sha256
          ../../target/release/ggen sync run
          find . -type f ! -path './.ggen/*' ! -path './.ggen-v2/*' -print0 | sort -z | xargs -0 sha256sum > .ggen/evidence/projection-second.sha256
          diff -u .ggen/evidence/projection-first.sha256 .ggen/evidence/projection-second.sha256
          ../../target/release/ggen sync run --dry-run | tee .ggen/evidence/pcq-dry-run.log

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: examples/pcq-marketplace/pnpm-lock.yaml

      - name: Install and validate application
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Execute HTTP and SSE boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          pnpm start > .build/next.log 2>&1 &
          echo $! > .build/next.pid
          trap 'kill "$(cat .build/next.pid)" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/snapshot >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/snapshot >/dev/null
          PCQ_RUNTIME_RECEIPT=.build/pcq-runtime-receipt.json pnpm verify:runtime
          kill "$(cat .build/next.pid)"
          trap - EXIT

      - name: Browser-render deck.gl and settle PCQ
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Upload exact-head PCQ evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pcq-marketplace-alive-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            examples/pcq-marketplace/.ggen/**
            examples/pcq-marketplace/.ggen-v2/**
            examples/pcq-marketplace/.build/**
            examples/pcq-marketplace/test-results/**
