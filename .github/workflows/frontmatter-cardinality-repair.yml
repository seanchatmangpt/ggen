name: Frontmatter cardinality repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: frontmatter-cardinality-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair-implement-verify:
    if: github.head_ref == 'agent/frontmatter-maximalism'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Provision siblings and pinned toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          components: rustfmt
          cache-key-suffix: frontmatter-cardinality-repair

      - name: Execute repaired source program
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          actuator = Path('.github/workflows/frontmatter-cardinality-actuator.yml').read_text()
          script = actuator.split("python3 <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(script)

          start = script.index('# Machine-readable schema stays exact with the Rust struct.')
          end = script.index('sync_path = Path("crates/ggen-engine/src/sync.rs")', start)
          repaired_schema = r'''# Machine-readable schema stays exact with the Rust struct.
          schema_path = Path("crates/ggen-engine/schema/frontmatter-schema.ttl")
          schema = schema_path.read_text()
          old_fields = "        ggenspec:Frontmatter-sparql ,\n        ggenspec:Frontmatter-construct ,"
          if schema.count(old_fields) != 1:
              raise SystemExit(f"schema field list drifted: {schema.count(old_fields)}")
          schema = schema.replace(
              old_fields,
              "        ggenspec:Frontmatter-sparql ,\n        ggenspec:Frontmatter-for_each ,\n        ggenspec:Frontmatter-construct ,",
              1,
          )
          old_construct = "\nggenspec:Frontmatter-construct\n"
          if schema.count(old_construct) != 1:
              raise SystemExit(f"schema construct marker drifted: {schema.count(old_construct)}")
          schema = schema.replace(
              old_construct,
              """
          ggenspec:Frontmatter-for_each
              a ggenspec:Field ; ggenspec:name "for_each" ; ggenspec:type xsd:string ;
              ggenspec:required false ;
              rdfs:comment "Explicit named sparql result governing projection cardinality. Dynamic to paths fan out per row; static paths aggregate row-rendered bodies. Defaults to absent, preserving historical implicit driver behavior." .

          ggenspec:Frontmatter-construct
          """,
              1,
          )
          schema_path.write_text(schema)

          '''
          script = script[:start] + repaired_schema + script[end:]
          exec(compile(script, '<frontmatter-cardinality-actuator>', 'exec'))
          PY

      - name: Format and statically inspect
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Execute explicit cardinality falsifiers
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ggen-engine --test frontmatter_cardinality_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_schema_match -- --nocapture
          cargo test -p ggen-engine --test frontmatter_maximalism_e2e -- --nocapture
          cargo test -p ggen-engine --lib template::tests -- --nocapture

      - name: Publish verified source and remove actuators
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/frontmatter-cardinality-actuator.yml
          rm .github/workflows/frontmatter-cardinality-repair.yml
          git config user.name "ggen frontmatter actuator"
          git config user.email "actions@github.com"
          git add crates/ggen-engine/src/template.rs \
                  crates/ggen-engine/src/sync.rs \
                  crates/ggen-engine/schema/frontmatter-schema.ttl \
                  crates/ggen-engine/tests/frontmatter_cardinality_e2e.rs \
                  .github/workflows/frontmatter-cardinality-actuator.yml \
                  .github/workflows/frontmatter-cardinality-repair.yml
          git commit -m "feat(engine): add explicit projection cardinality"
          git push origin HEAD:agent/frontmatter-maximalism
