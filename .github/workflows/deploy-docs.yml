name: Build and publish the ggen Book

on:
  pull_request:
    paths:
      - "book/**"
      - "src/**"
      - "crates/**"
      - ".github/workflows/deploy-docs.yml"
      - ".github/workflows/publish-registry.yml"
  push:
    branches: [main]
    paths:
      - "book/**"
      - "src/**"
      - "crates/**"
      - ".github/workflows/deploy-docs.yml"
      - ".github/workflows/publish-registry.yml"
  workflow_dispatch:

# The build is read-only. Only the final main-branch publication step writes the
# gh-pages branch. The generated site never acquires product/runtime authority.
permissions:
  contents: write

concurrency:
  group: ggen-book-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  book:
    name: Exact-subject mdBook and API publication court
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          printf 'subject_sha=%s\n' "$actual"

      - name: Setup ggen build
        uses: ./.github/actions/setup-ggen-build
        with:
          components: rust-docs,rustfmt
          cache-key-suffix: ggen-book-pages

      - name: Install pinned mdBook
        run: cargo install mdbook --locked --version 0.4.52

      - name: Validate executable book inventory
        run: |
          set -euo pipefail
          python3 book/scripts/check_book.py
          python3 book/scripts/check_level_five.py
          python3 book/scripts/audit_claim_coverage.py
          python3 book/scripts/validate_gap_closure.py

      - name: Build the ggen Book
        run: |
          set -euo pipefail
          mdbook build book
          test -f book/book/index.html
          test -f book/book/404.html

      - name: Build Rust API reference
        run: |
          set -euo pipefail
          cargo doc --no-deps
          test -f target/doc/index.html

      - name: Compose one GitHub Pages site
        run: |
          set -euo pipefail
          rm -rf book/book/api
          mkdir -p book/book/api
          cp -a target/doc/. book/book/api/
          touch book/book/.nojekyll
          test -f book/book/index.html
          test -f book/book/api/index.html
          printf 'BOOK_PAGES_READY subject=%s root=book/book api=book/book/api\n' "$(git rev-parse HEAD)"

      - name: Refuse authored-source drift
        run: |
          set -euo pipefail
          drift="$(git status --porcelain=v1 --untracked-files=no -- book src crates .github/workflows)"
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo '::error::Book publication changed tracked authored source.'
            exit 1
          fi

      - name: Upload exact-subject site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ggen-book-site-${{ github.sha }}
          path: book/book
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact bytes to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: book/book
          publish_branch: gh-pages
          keep_files: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "docs(book): publish ${{ github.sha }}"
