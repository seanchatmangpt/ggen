name: CMD coverage policy lint repair

on:
  push:
    branches:
      - agent/combinatorial-maximalism-pack
    paths:
      - '.github/workflows/cmd-coverage-lint-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/combinatorial-maximalism-pack
          fetch-depth: 0
      - name: Admit one-active-policy specialization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packs/ggen-combinatorial-maximalism-pack/templates/lib.rs.tmpl')
          text = path.read_text()
          old = '#[derive(Clone, Copy, Debug, Eq, PartialEq)]\nenum CoverageMode {'
          new = '#[derive(Clone, Copy, Debug, Eq, PartialEq)]\n// One policy is selected by each admitted design; the alternate remains a generated capability.\n#[allow(dead_code)]\nenum CoverageMode {'
          if old not in text:
              raise SystemExit('CMD_COVERAGE_LINT_SOURCE_MISMATCH')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/cmd-coverage-lint-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packs/ggen-combinatorial-maximalism-pack/templates/lib.rs.tmpl .github/workflows/cmd-coverage-lint-repair.yml
          git commit -m 'fix(cmd): admit one-active coverage specialization'
          git push origin HEAD:agent/combinatorial-maximalism-pack
