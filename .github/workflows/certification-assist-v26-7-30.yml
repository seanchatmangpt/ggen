name: CertificationAssist v26.7.30

on:
  pull_request:
    paths:
      - "packs/certification-assist-pack/**"
      - "docs/architecture/CERTIFICATION_ASSIST_V26_7_30.md"
      - ".github/workflows/certification-assist-v26-7-30.yml"
      - "crates/ggen-graph/src/rwr/automatic.rs"
      - "crates/ggen-graph/src/rwr/mod.rs"
  push:
    branches: [main]
    paths:
      - "packs/certification-assist-pack/**"
      - "docs/architecture/CERTIFICATION_ASSIST_V26_7_30.md"
      - ".github/workflows/certification-assist-v26-7-30.yml"
      - "crates/ggen-graph/src/rwr/automatic.rs"
      - "crates/ggen-graph/src/rwr/mod.rs"
  workflow_dispatch:

concurrency:
  group: certification-assist-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crown:
    name: 12 capabilities / 36 proof surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Provision siblings, pinned nightly and cache
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: certification-assist-v26-7-30

      - name: Read-only repository formatting gate
        run: cargo fmt --all -- --check

      - name: Preserve direct automatic and autonomic law
        run: cargo test -p ggen-graph --test automatic_autonomic_v26_7_31

      - name: Preserve RWR Level-5 foundation
        run: cargo test -p ggen-graph --test rwr_level5_e2e

      - name: Build the real ggen actuator
        run: cargo build -p ggen-cli-lib --bin ggen

      - name: Generate the CertificationAssist consumer twice
        working-directory: packs/certification-assist-pack
        run: |
          set -euo pipefail
          ../../target/debug/ggen sync run
          first="$(find consumer/certification-assist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          ../../target/debug/ggen sync run
          second="$(find consumer/certification-assist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          test "$first" = "$second"

      - name: Execute generated crown and protocol checks
        working-directory: packs/certification-assist-pack
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          bash consumer/certification-assist/scripts/verify.sh
          ../../target/debug/ggen receipt verify

      - name: Publish bounded crown report
        uses: actions/upload-artifact@v4
        with:
          name: certification-assist-v26-7-30-receipts
          path: |
            packs/certification-assist-pack/VERIFIER_REPORT.json
            packs/certification-assist-pack/.ggen-v2/receipt.json
            packs/certification-assist-pack/consumer/certification-assist/protocol/*.json
            packs/certification-assist-pack/consumer/certification-assist/automation/SPEEDRUN_PLAN.json
            packs/certification-assist-pack/consumer/certification-assist/docs/*.md
          if-no-files-found: error
