name: Fortune-5 Required Capabilities

on:
  pull_request:
    paths:
      - "crates/ggen-marketplace/src/marketplace/fortune5.rs"
      - "crates/ggen-marketplace/src/marketplace/mod.rs"
      - "crates/ggen-marketplace/src/lib.rs"
      - "crates/ggen-marketplace/tests/fortune5_required_capabilities.rs"
      - "packs/fortune5-required-capabilities-pack/**"
      - "docs/architecture/FORTUNE5_REQUIRED_CAPABILITIES.md"
      - ".github/workflows/fortune5-required-capabilities.yml"
  push:
    branches: [main]
    paths:
      - "crates/ggen-marketplace/src/marketplace/fortune5.rs"
      - "crates/ggen-marketplace/src/marketplace/mod.rs"
      - "crates/ggen-marketplace/src/lib.rs"
      - "crates/ggen-marketplace/tests/fortune5_required_capabilities.rs"
      - "packs/fortune5-required-capabilities-pack/**"
      - "docs/architecture/FORTUNE5_REQUIRED_CAPABILITIES.md"
      - ".github/workflows/fortune5-required-capabilities.yml"

concurrency:
  group: fortune5-required-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crown:
    name: 19 capabilities / 57 surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Provision siblings + pinned nightly + cache
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: fortune5-required

      - name: Apply exact rustfmt oracle
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --name-only -z -- '*.rs' > /tmp/rustfmt-files.list
          if [ -s /tmp/rustfmt-files.list ]; then
            tar --null -T /tmp/rustfmt-files.list -czf /tmp/rustfmt-files.tgz
          else
            tar -czf /tmp/rustfmt-files.tgz --files-from /dev/null
          fi
          cargo fmt --all -- --check

      - name: Upload rustfmt oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fortune5-rustfmt-oracle
          path: /tmp/rustfmt-files.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Execute direct Fortune-5 crown verifier
        run: cargo test -p ggen-marketplace --test fortune5_required_capabilities

      - name: Preserve the RWR Level-5 foundation
        run: cargo test -p ggen-graph --test rwr_level5_e2e

      - name: Build the real ggen actuator
        run: cargo build -p ggen-cli-lib --bin ggen

      - name: Generate the ontology-first consumer twice
        working-directory: packs/fortune5-required-capabilities-pack
        run: |
          set -euo pipefail
          ../../target/debug/ggen sync run
          first="$(find consumer/fortune5-required-foundation -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          ../../target/debug/ggen sync run
          second="$(find consumer/fortune5-required-foundation -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          test "$first" = "$second"

      - name: Execute generated Fortune-5 crown verifier
        working-directory: packs/fortune5-required-capabilities-pack
        run: |
          set -euo pipefail
          cargo test --manifest-path consumer/fortune5-required-foundation/Cargo.toml
          ../../target/debug/ggen receipt verify
          bash consumer/fortune5-required-foundation/scripts/verify.sh
          grep -q '"standing": "ALIVE"' consumer/fortune5-required-foundation/VERIFIER_REPORT.json
          grep -q '"capabilities": 19' consumer/fortune5-required-foundation/VERIFIER_REPORT.json
          grep -q '"proof_surfaces": 57' consumer/fortune5-required-foundation/VERIFIER_REPORT.json
