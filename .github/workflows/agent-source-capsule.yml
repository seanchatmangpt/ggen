name: Agent Source Capsule

on:
  pull_request:
    paths:
      - '.github/workflows/agent-source-capsule.yml'
      - 'crates/ggen-engine/**'

permissions:
  contents: read

jobs:
  source-capsule:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Record identity and archive source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > SOURCE_SHA
          git archive --format=tar.gz --output=ggen-source.tar.gz HEAD -- \
            Cargo.toml Cargo.lock rust-toolchain.toml rustfmt.toml \
            .cargo crates/ggen-engine crates/praxis-core crates/praxis-graphlaw \
            crates/ggen-marketplace crates/ggen-config
          sha256sum ggen-source.tar.gz > ggen-source.tar.gz.sha256

      - name: Upload exact source capsule
        uses: actions/upload-artifact@v4
        with:
          name: ggen-source-${{ github.event.pull_request.head.sha }}
          path: |
            SOURCE_SHA
            ggen-source.tar.gz
            ggen-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
