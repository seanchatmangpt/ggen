name: AutoFDE execution profile contract

on:
  pull_request:
    paths:
      - "packs/autofde-execution-profile-pack/**"
      - "crates/ggen-engine/tests/autofde_execution_profile_pack_e2e.rs"
      - "scripts/autofde_validate_execution_profiles.py"
      - "scripts/test_autofde_validate_execution_profiles.py"
      - ".github/workflows/autofde-execution-profile-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Refuse subject drift
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile court
        run: python -m py_compile scripts/autofde_validate_execution_profiles.py scripts/test_autofde_validate_execution_profiles.py
      - name: Execute adversarial JSON court
        run: python -m unittest -v scripts/test_autofde_validate_execution_profiles.py
      - run: echo AUTOFDE_EXECUTION_PROFILE_JSON_COURT=ALIVE
