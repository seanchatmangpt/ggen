name: Fortune 5 frontmatter hardening

on:
  push:
    branches:
      - agent/frontmatter-maximalism
    paths:
      - '.github/workflows/fortune5-frontmatter-hardening.yml'

permissions:
  contents: write

concurrency:
  group: fortune5-frontmatter-hardening
  cancel-in-progress: false

jobs:
  harden-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Provision siblings and pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          components: rustfmt
          cache-key-suffix: fortune5-frontmatter-hardening

      - name: Apply bounded enterprise hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          sync_path = Path('crates/ggen-engine/src/sync.rs')
          sync = sync_path.read_text()

          sync = replace_once(
              sync,
              '    write::{plan_write, preflight_structured_matchers, validate_match_specs, WriteOutcome},\n',
              '''    write::{
                  plan_write, preflight_checksum_slot, preflight_structured_matchers,
                  validate_match_specs, WriteOutcome, MAX_OUTPUT_BYTES,
              },
          ''',
              'sync write imports',
          )

          sync = replace_once(
              sync,
              'pub const RECEIPT_REL_PATH: &str = ".ggen-v2/receipt.json";\n',
              '''pub const RECEIPT_REL_PATH: &str = ".ggen-v2/receipt.json";

          /// Maximum rows admitted from any one named SPARQL result. This bounds
          /// semantic fan-out before Tera rendering or shell/filesystem actuation.
          pub const MAX_QUERY_RESULT_ROWS: usize = 4_096;

          /// Maximum materialized outputs admitted in one sync, including the
          /// engine-owned module aggregator.
          pub const MAX_PENDING_OUTPUTS: usize = 8_192;

          /// Maximum combined rendered body bytes admitted across one sync.
          pub const MAX_TOTAL_RENDERED_BYTES: usize = 64 * 1024 * 1024;
          ''',
              'enterprise limit constants',
          )

          sync = replace_once(
              sync,
              '''    closure.insert(
                  "actuator".to_string(),
                  concat!("ggen@", env!("CARGO_PKG_VERSION")).to_string(),
              );
          ''',
              '''    closure.insert(
                  "actuator".to_string(),
                  concat!("ggen@", env!("CARGO_PKG_VERSION")).to_string(),
              );
              closure.insert(
                  "policy:frontmatter-projection-limits".to_string(),
                  format!(
                      "max_query_rows={MAX_QUERY_RESULT_ROWS};max_outputs={MAX_PENDING_OUTPUTS};\
                       max_total_rendered_bytes={MAX_TOTAL_RENDERED_BYTES};\
                       max_output_bytes={MAX_OUTPUT_BYTES}"
                  ),
              );
          ''',
              'receipt-bound enterprise policy',
          )

          sync = replace_once(
              sync,
              '''        else {
                  let reason = format!("when guard false ({})", tpl_path.display());
                  decisions.insert(tpl.frontmatter.to.clone(), format!("skipped: {reason}"));
                  skipped.push((PathBuf::from(&tpl.frontmatter.to), reason));
                  continue;
              };
          ''',
              '''        else {
                  let reason = format!("when guard false ({})", tpl_path.display());
                  let evidence_key = if tpl.frontmatter.to.contains("{{")
                      || tpl.frontmatter.to.contains("{%")
                  {
                      format!("@template/{}", rel_display(root, tpl_path))
                  } else {
                      crate::write::resolve_target(root, &tpl.frontmatter.to)?;
                      tpl.frontmatter.to.clone()
                  };
                  decisions.insert(evidence_key.clone(), format!("skipped: {reason}"));
                  skipped.push((PathBuf::from(evidence_key), reason));
                  continue;
              };
          ''',
              'when-false target admission',
          )

          shape_call = '            check_shape_files_exist(root, tpl_path, &frontmatter.shape)?;'
          shape_replacement = '            admit_shape_files(root, tpl_path, &frontmatter.shape, &mut closure)?;'
          count = sync.count(shape_call)
          if count != 3:
              raise SystemExit(f'shape calls: expected 3, found {count}')
          sync = sync.replace(shape_call, shape_replacement)

          sync = replace_once(
              sync,
              '''        named.insert(key.clone(), sparql_to_value(active_graph, query)?);
          ''',
              '''        let value = sparql_to_value(active_graph, query)?;
                  if let Some(rows) = value.as_array() {
                      if rows.len() > MAX_QUERY_RESULT_ROWS {
                          return Err(AppError::fm_tpl(
                              21,
                              format!(
                                  "{}: named `sparql:` result `{key}` produced {} row(s), over the \
                                   Fortune 5 limit of {MAX_QUERY_RESULT_ROWS}. Remediation: constrain \
                                   the query with a selective WHERE clause, grouping, or an explicit LIMIT.",
                                  tpl_path.display(),
                                  rows.len()
                              ),
                          ));
                      }
                  }
                  named.insert(key.clone(), value);
          ''',
              'query row budget',
          )

          sync = replace_once(
              sync,
              '''    // Two rendered templates (or two rows of one template) resolving to the
              // same target would silently last-row-win on disk and in the decisions
              // map — refuse instead.
              {
                  let mut seen: BTreeMap<&str, usize> = BTreeMap::new();
                  for pw in &pending {
                      *seen.entry(pw.to.as_str()).or_default() += 1;
                  }
                  if let Some((to, n)) = seen.into_iter().find(|(_, n)| *n > 1) {
                      return Err(AppError::fm_write(
                          8,
                          format!(
                              "{n} rendered templates target the same output `{to}`. \\
                               Remediation: make the `to:` pattern unique per row/template \\
                               (e.g. include a distinguishing SPARQL variable in the path)."
                          ),
                      ));
                  }
              }
          ''',
              '''    // Admit the complete prospective write set before any hook or write.
              // This is the Fortune 5 boundary: bounded count/bytes, safe canonical
              // targets, and no aliasing of one filesystem object through two spellings.
              if pending.len() > MAX_PENDING_OUTPUTS {
                  return Err(AppError::fm_tpl(
                      22,
                      format!(
                          "sync materialized {} outputs, over the Fortune 5 limit of \
                           {MAX_PENDING_OUTPUTS}. Remediation: partition the ontology view or \
                           aggregate rows into bounded artifacts.",
                          pending.len()
                      ),
                  ));
              }
              let total_rendered_bytes = pending
                  .iter()
                  .fold(0usize, |total, pw| total.saturating_add(pw.body.len()));
              if total_rendered_bytes > MAX_TOTAL_RENDERED_BYTES {
                  return Err(AppError::fm_tpl(
                      22,
                      format!(
                          "sync rendered {total_rendered_bytes} body bytes, over the Fortune 5 \
                           limit of {MAX_TOTAL_RENDERED_BYTES}. Remediation: reduce selected \
                           knowledge, split the run, or aggregate more compactly."
                      ),
                  ));
              }
              {
                  let mut seen: BTreeMap<PathBuf, (String, usize)> = BTreeMap::new();
                  for pw in &pending {
                      let admitted = crate::write::resolve_target(root, &pw.to)?;
                      let entry = seen.entry(admitted).or_insert_with(|| (pw.to.clone(), 0));
                      entry.1 += 1;
                  }
                  if let Some((target, (declared, n))) =
                      seen.into_iter().find(|(_, (_, n))| *n > 1)
                  {
                      return Err(AppError::fm_write(
                          8,
                          format!(
                              "{n} rendered templates resolve to the same admitted output `{}` \
                               (one declaration was `{declared}`). Remediation: make `to:` unique \
                               after path normalization; aliases such as `x` and `./x` are the \
                               same target.",
                              target.display()
                          ),
                      ));
                  }
              }
          ''',
              'prospective write-set admission',
          )

          sync = replace_once(
              sync,
              '''fn apply(
              root: &Path, rel_to: &str, body: &str, frontmatter: &Frontmatter, opts: SyncOptions,
              written: &mut Vec<PathBuf>, skipped: &mut Vec<(PathBuf, String)>,
              decisions: &mut BTreeMap<String, String>,
          ) -> Result<()> {
              if frontmatter.skip_empty && body.trim().is_empty() {
          ''',
              '''fn apply(
              root: &Path, rel_to: &str, body: &str, frontmatter: &Frontmatter, opts: SyncOptions,
              written: &mut Vec<PathBuf>, skipped: &mut Vec<(PathBuf, String)>,
              decisions: &mut BTreeMap<String, String>,
          ) -> Result<()> {
              let target = crate::write::resolve_target(root, rel_to)?;
              if frontmatter.skip_empty && body.trim().is_empty() {
          ''',
              'apply target admission',
          )

          sync = replace_once(
              sync,
              '''    validate_match_specs(frontmatter)?;
              let mut match_evidence = preflight_structured_matchers(root, rel_to, frontmatter)?;
          ''',
              '''    validate_match_specs(frontmatter)?;
              preflight_checksum_slot(root, rel_to, frontmatter)?;
              let mut match_evidence = preflight_structured_matchers(root, rel_to, frontmatter)?;
          ''',
              'pre-hook ownership preflight',
          )

          sync = replace_once(
              sync,
              '''        let target = root.join(rel_to);
                  match std::fs::read_to_string(&target) {
          ''',
              '''        match std::fs::read_to_string(&target) {
          ''',
              'dry-run admitted target reuse',
          )

          sync = replace_once(
              sync,
              '''/// Refuse if any `shape:` file listed in `frontmatter` does not exist.
          /// **Existence-checked only** — no SHACL engine runs in this crate yet, so
          /// this does not evaluate the shapes against rendered output; see
          /// `docs/v26.7.4/GGEN_TOML_SCHEMA_MAPPING.md`.
          ///
          /// # Errors
          /// `[FM-TPL-014]` — distinct from `[FM-TPL-008]` (`from:` path traversal in
          /// [`parse_template_file`]): a missing `shape:` file is an unrelated failure
          /// cause that used to share `FM-TPL-008`'s numeric code.
          fn check_shape_files_exist(root: &Path, tpl_path: &Path, shapes: &[String]) -> Result<()> {
              for shape in shapes {
                  let shape_path = root.join(shape);
                  if !shape_path.exists() {
                      return Err(AppError::fm_tpl(
                          14,
                          format!(
                              "{}: `shape:` entry `{shape}` does not exist at `{}`. \\
                               Remediation: fix the path or remove the entry.",
                              tpl_path.display(),
                              shape_path.display()
                          ),
                      ));
                  }
              }
              Ok(())
          }
          ''',
              '''/// Admit every rendered `shape:` path as a safe, regular, readable,
          /// receipt-bound governing input. This still does not claim SHACL evaluation;
          /// it closes path, type, readability, and provenance gaps first.
          fn admit_shape_files(
              root: &Path, tpl_path: &Path, shapes: &[String], closure: &mut BTreeMap<String, String>,
          ) -> Result<()> {
              for shape in shapes {
                  let shape_path = crate::write::resolve_target(root, shape).map_err(|error| {
                      AppError::fm_tpl(
                          14,
                          format!(
                              "{}: `shape:` entry `{shape}` is not an admitted project path: \
                               {error}. Remediation: use a safe relative path inside the project.",
                              tpl_path.display()
                          ),
                      )
                  })?;
                  let metadata = std::fs::metadata(&shape_path).map_err(|error| {
                      AppError::fm_tpl(
                          14,
                          format!(
                              "{}: `shape:` entry `{shape}` is unreadable at `{}`: {error}. \
                               Remediation: provide a readable regular file.",
                              tpl_path.display(),
                              shape_path.display()
                          ),
                      )
                  })?;
                  if !metadata.is_file() {
                      return Err(AppError::fm_tpl(
                          14,
                          format!(
                              "{}: `shape:` entry `{shape}` resolves to `{}`, which is not a \
                               regular file. Remediation: point to a readable shape document.",
                              tpl_path.display(),
                              shape_path.display()
                          ),
                      ));
                  }
                  let bytes = std::fs::read(&shape_path).map_err(|error| {
                      AppError::fm_tpl(
                          14,
                          format!(
                              "{}: `shape:` entry `{shape}` could not be read at `{}`: {error}",
                              tpl_path.display(),
                              shape_path.display()
                          ),
                      )
                  })?;
                  closure.insert(
                      rel_display(root, &shape_path),
                      blake3::hash(&bytes).to_hex().to_string(),
                  );
              }
              Ok(())
          }
          ''',
              'shape admission function',
          )

          sync_path.write_text(sync)

          write_path = Path('crates/ggen-engine/src/write.rs')
          write = write_path.read_text()

          write = replace_once(
              write,
              '''        maybe_backup(&target, &content, frontmatter)?;
                  let injected = inject_into(&content, rendered_body, frontmatter)?;
                  std::fs::write(&target, &injected)?;
          ''',
              '''        let injected = inject_into(&content, rendered_body, frontmatter)?;
                  if injected.len() > MAX_OUTPUT_BYTES {
                      return Err(AppError::fm_write(
                          7,
                          format!(
                              "injected output for `{rel_to}` is {} bytes, over the \
                               {MAX_OUTPUT_BYTES}-byte cap. Remediation: split the host artifact \
                               or reduce the injected projection.",
                              injected.len()
                          ),
                      ));
                  }
                  maybe_backup(&target, &content, frontmatter)?;
                  std::fs::write(&target, &injected)?;
          ''',
              'prospective injection before backup',
          )

          write = replace_once(
              write,
              '''                Err(_) => Ok(None), // no prior checksum recorded yet; proceed normally
          ''',
              '''                Err(error) if error.kind() == std::io::ErrorKind::NotFound => Ok(None),
                  Err(error) => Err(AppError::fm_write(
                      11,
                      format!(
                          "checksum ownership slot `{}` is unreadable: {error}. Refusing to \
                           treat an unknown ownership state as unfrozen. Remediation: repair or \
                           remove the slot after reviewing the target.",
                          checksum_path.display()
                      ),
                  )),
          ''',
              'fail-closed checksum read',
          )

          write = replace_once(
              write,
              '''pub(crate) fn validate_match_specs(frontmatter: &Frontmatter) -> Result<()> {
              for (spec, use_) in [
          ''',
              '''pub(crate) fn validate_match_specs(frontmatter: &Frontmatter) -> Result<()> {
              let placement_count = usize::from(frontmatter.before.is_some())
                  + usize::from(frontmatter.after.is_some())
                  + usize::from(frontmatter.at_line.is_some());
              if placement_count > 0 && !frontmatter.inject {
                  return Err(AppError::fm_write(
                      10,
                      "`before`, `after`, and `at_line` require `inject: true`; placement \
                       authority without injection is incoherent. Remediation: enable injection \
                       or remove the placement fields.",
                  ));
              }
              if placement_count > 1 {
                  return Err(AppError::fm_write(
                      10,
                      "configure exactly one of `before`, `after`, or `at_line`; implicit \
                       precedence between multiple placement authorities is refused. \
                       Remediation: retain the single intended structural port.",
                  ));
              }
              for (spec, use_) in [
          ''',
              'selector authority contract',
          )

          write = replace_once(
              write,
              '''fn freeze_checksum_path(root: &Path, slots_dir: &str, rel_to: &str) -> Result<PathBuf> {
              resolve_target(root, &format!("{slots_dir}/{rel_to}.blake3"))
          }
          ''',
              '''fn freeze_checksum_path(root: &Path, slots_dir: &str, rel_to: &str) -> Result<PathBuf> {
              resolve_target(root, &format!("{slots_dir}/{rel_to}.blake3"))
          }

          /// Admit checksum ownership state before shell hooks. `NotFound` means no prior
          /// slot; every other read error is an unknown authority state and fails closed.
          pub(crate) fn preflight_checksum_slot(
              root: &Path, rel_to: &str, frontmatter: &Frontmatter,
          ) -> Result<()> {
              if frontmatter.freeze_policy != Some(FreezePolicy::Checksum) {
                  return Ok(());
              }
              let target = resolve_target(root, rel_to)?;
              if !target.exists() {
                  return Ok(());
              }
              let slots_dir = freeze_slots_dir(frontmatter)?;
              let checksum_path = freeze_checksum_path(root, slots_dir, rel_to)?;
              match std::fs::read_to_string(&checksum_path) {
                  Ok(_) => Ok(()),
                  Err(error) if error.kind() == std::io::ErrorKind::NotFound => Ok(()),
                  Err(error) => Err(AppError::fm_write(
                      11,
                      format!(
                          "checksum ownership slot `{}` is unreadable before actuation: {error}. \
                           Remediation: repair or remove the slot after reviewing ownership.",
                          checksum_path.display()
                      ),
                  )),
              }
          }
          ''',
              'pre-hook checksum preflight',
          )

          write_path.write_text(write)

          test_path = Path('crates/ggen-engine/tests/frontmatter_fortune5_hardening_e2e.rs')
          if test_path.exists():
              raise SystemExit(f'{test_path} already exists')
          test_path.write_text(r'''//! Fortune 5 frontmatter hardening: bounded multiplication, admitted paths,
          //! receipt-bound governing inputs, coherent authority, and fail-closed ownership.

          use std::path::Path;

          use ggen_engine::sync::{sync, SyncOptions, MAX_QUERY_RESULT_ROWS};
          use tempfile::TempDir;

          const GGEN_TOML: &str = r#"
          [project]
          name = "fortune5"

          [ontology]
          source = "ontology.ttl"

          [templates]
          dir = "templates"
          "#;

          fn scaffold(root: &Path, ontology: &str) {
              std::fs::write(root.join("ggen.toml"), GGEN_TOML).expect("manifest");
              std::fs::write(root.join("ontology.ttl"), ontology).expect("ontology");
              std::fs::create_dir_all(root.join("templates")).expect("templates");
          }

          fn template(root: &Path, name: &str, source: &str) {
              std::fs::write(root.join("templates").join(name), source).expect("template");
          }

          #[test]
          fn excessive_query_rows_refuse_before_hook_or_write() {
              let dir = TempDir::new().expect("tempdir");
              let mut ontology = String::from("@prefix ex: <http://example.org/> .\n");
              for index in 0..=MAX_QUERY_RESULT_ROWS {
                  ontology.push_str(&format!("ex:e{index} ex:name \"n{index}\" .\n"));
              }
              scaffold(dir.path(), &ontology);
              template(
                  dir.path(),
                  "rows.tmpl",
                  r#"---
          to: "out/{{ row.name }}.txt"
          sparql:
            entities: |
              PREFIX ex: <http://example.org/>
              SELECT ?name WHERE { ?s ex:name ?name } ORDER BY ?name
          for_each: entities
          sh_before: "echo ran > hook.log"
          ---
          {{ row.name }}
          "#,
              );

              let error = sync(dir.path(), SyncOptions::default()).expect_err("must refuse");
              assert!(error.to_string().contains("FM-TPL-021"), "{error}");
              assert!(!dir.path().join("hook.log").exists());
              assert!(!dir.path().join("out").exists());
          }

          #[test]
          fn unsafe_skip_empty_target_is_admitted_before_skip() {
              let dir = TempDir::new().expect("tempdir");
              scaffold(dir.path(), "@prefix ex: <http://example.org/> .\n");
              template(
                  dir.path(),
                  "unsafe.tmpl",
                  "---\nto: ../escaped.txt\nskip_empty: true\n---\n   \n",
              );

              let error = sync(dir.path(), SyncOptions::default()).expect_err("must refuse");
              assert!(error.to_string().contains("FM-WRITE-002"), "{error}");
              assert!(!dir.path().parent().expect("parent").join("escaped.txt").exists());
          }

          #[test]
          fn canonical_target_aliases_are_duplicate_outputs() {
              let dir = TempDir::new().expect("tempdir");
              scaffold(dir.path(), "@prefix ex: <http://example.org/> .\n");
              template(dir.path(), "a.tmpl", "---\nto: out.txt\n---\na\n");
              template(dir.path(), "b.tmpl", "---\nto: ./out.txt\n---\nb\n");

              let error = sync(dir.path(), SyncOptions::default()).expect_err("must refuse");
              assert!(error.to_string().contains("FM-WRITE-008"), "{error}");
              assert!(!dir.path().join("out.txt").exists());
          }

          #[test]
          fn shape_is_regular_safe_and_receipt_bound() {
              let dir = TempDir::new().expect("tempdir");
              scaffold(dir.path(), "@prefix ex: <http://example.org/> .\n");
              std::fs::create_dir_all(dir.path().join("shapes")).expect("shape dir");
              let shape = b"@prefix sh: <http://www.w3.org/ns/shacl#> .\n";
              std::fs::write(dir.path().join("shapes/policy.ttl"), shape).expect("shape");
              template(
                  dir.path(),
                  "shape.tmpl",
                  "---\nto: out.txt\nshape:\n  - shapes/policy.ttl\n---\nbody\n",
              );

              let report = sync(dir.path(), SyncOptions::default()).expect("sync");
              assert_eq!(
                  report.closure.get("shapes/policy.ttl").map(String::as_str),
                  Some(blake3::hash(shape).to_hex().to_string().as_str())
              );
          }

          #[test]
          fn shape_directory_refuses_before_hook() {
              let dir = TempDir::new().expect("tempdir");
              scaffold(dir.path(), "@prefix ex: <http://example.org/> .\n");
              std::fs::create_dir_all(dir.path().join("shapes")).expect("shape dir");
              template(
                  dir.path(),
                  "shape-dir.tmpl",
                  "---\nto: out.txt\nshape:\n  - shapes\nsh_before: \"echo ran > hook.log\"\n---\nbody\n",
              );

              let error = sync(dir.path(), SyncOptions::default()).expect_err("must refuse");
              assert!(error.to_string().contains("FM-TPL-014"), "{error}");
              assert!(!dir.path().join("hook.log").exists());
              assert!(!dir.path().join("out.txt").exists());
          }

          #[test]
          fn placement_without_injection_refuses_before_hook() {
              let dir = TempDir::new().expect("tempdir");
              scaffold(dir.path(), "@prefix ex: <http://example.org/> .\n");
              std::fs::write(dir.path().join("out.txt"), "// SLOT\n").expect("host");
              template(
                  dir.path(),
                  "selector.tmpl",
                  "---\nto: out.txt\nbefore: \"// SLOT\"\nsh_before: \"echo ran > hook.log\"\n---\nbody\n",
              );

              let error = sync(dir.path(), SyncOptions::default()).expect_err("must refuse");
              assert!(error.to_string().contains("FM-WRITE-010"), "{error}");
              assert!(!dir.path().join("hook.log").exists());
          }

          #[test]
          fn unreadable_checksum_state_refuses_before_hook() {
              let dir = TempDir::new().expect("tempdir");
              scaffold(dir.path(), "@prefix ex: <http://example.org/> .\n");
              std::fs::write(dir.path().join("out.txt"), "old\n").expect("target");
              std::fs::create_dir_all(dir.path().join(".ggen-v2/freeze/out.txt.blake3"))
                  .expect("directory where checksum file must be");
              template(
                  dir.path(),
                  "checksum.tmpl",
                  "---\nto: out.txt\nforce: true\nfreeze_policy: checksum\nfreeze_slots_dir: .ggen-v2/freeze\nsh_before: \"echo ran > hook.log\"\n---\nnew\n",
              );

              let error = sync(dir.path(), SyncOptions::default()).expect_err("must refuse");
              assert!(error.to_string().contains("FM-WRITE-011"), "{error}");
              assert!(!dir.path().join("hook.log").exists());
              assert_eq!(std::fs::read_to_string(dir.path().join("out.txt")).unwrap(), "old\n");
          }
          ''')

          maximalism = Path('docs/reference/frontmatter-maximalism.md')
          text = maximalism.read_text()
          marker = '## Structural ports\n'
          enterprise = '''## Fortune 5 hardening boundary

          The projection calculus is now bounded before actuation:

          ```text
          named query result <= 4,096 rows
          materialized outputs <= 8,192 per sync
          one rendered artifact <= 10 MiB
          all rendered bodies <= 64 MiB per sync
          ```

          Every prospective target is safely resolved before any shell hook. Canonical path
          aliases are duplicate targets. Rendered `shape` documents must be safe, regular,
          readable files and their bytes enter the receipt closure. Placement selectors require
          `inject: true` and exactly one placement authority. Checksum ownership state fails
          closed on every error except `NotFound`. Injection bytes are validated before backup.

          These controls bound combinatorial multiplication without reducing the lawful ontology
          views or artifact families available to internal and external packs.

          '''
          if text.count(marker) != 1:
              raise SystemExit('maximalism structural ports marker drifted')
          maximalism.write_text(text.replace(marker, enterprise + marker, 1))

          directives = Path('docs/reference/template-directives.md')
          text = directives.read_text()
          text = replace_once(
              text,
              '''```text
          static to
            -> one pending output per template

          dynamic to containing {{
            -> one pending output per driving row
            -> zero rows means zero outputs
          ```
          ''',
              '''```text
          static to without for_each
            -> one whole-template output

          static to with for_each
            -> one aggregate output containing one body render per selected row

          dynamic to containing {{
            -> one output per selected row

          all named query results <= 4,096 rows
          all pending outputs <= 8,192
          each artifact <= 10 MiB
          all rendered bodies <= 64 MiB per sync
          zero selected rows -> zero outputs
          ```

          The complete prospective write set is admitted before hooks: target paths are safely
          resolved, canonical aliases are duplicate targets, and count/byte budgets fail closed.
          The active limit policy is recorded in the receipt input closure.
          ''',
              'cardinality interaction law',
          )

          text = replace_once(
              text,
              '''### FM-LC-001 — decision paths can bypass target admission

          **Standing: PARTIAL_ALIVE**

          `skip_empty` returns before normal path preflight. A false `when` guard also records
          a decision directly, before output rendering or target resolution. Receipt output
          binding later joins decision keys to the project root without using the safe target
          resolver.

          Consequences:

          - an unsafe static `to` can avoid the normal path refusal when skipped early;
          - a false dynamic `when` records the literal unrendered `to` expression;
          - receipt target lookup assumes a safety proof that these branches did not perform.

          **Required checkpoint:** establish one admitted target type before any skip decision,
          and use non-path evidence identifiers for templates that never materialize outputs.
          ''',
              '''### FM-LC-001 — targets are admitted before actuation

          **Standing: ALIVE, bounded**

          Every materialized target is safely resolved before hooks, including `skip_empty`
          outputs. Canonical aliases are compared as one target. A false `when` on a static path
          admits that path; a false `when` on an unrendered dynamic path records a non-path
          `@template/...` evidence identifier instead of pretending a target existed.
          ''',
              'target admission finding',
          )

          text = replace_once(
              text,
              '''### FM-LC-002 — `shape` is not yet an admitted governing input

          **Standing: PARTIAL_ALIVE**

          The current check uses project-root joining plus `exists`:

          - no traversal/symlink containment proof;
          - directories pass;
          - shape bytes are absent from the input closure;
          - no SHACL conformance evaluation occurs.

          **Required checkpoint:** resolve safely, require a regular readable file, closure-bind
          its bytes, then separately add actual shape evaluation.
          ''',
              '''### FM-LC-002 — `shape` is an admitted governing input

          **Standing: ALIVE for path/type/provenance; SHACL evaluation UNSUPPORTED**

          Every rendered shape path is safely resolved inside the project, must be a readable
          regular file, and contributes its BLAKE3 bytes to the receipt closure before hooks.
          This checkpoint deliberately does not claim that rendered artifacts are evaluated
          against those shapes.
          ''',
              'shape finding',
          )

          text = replace_once(
              text,
              '''### FM-LC-003 — injection backup precedes compatibility-marker proof

          **Standing: PARTIAL_ALIVE**

          The inject path writes `<target>.bak` before `inject_into` proves a bare-string marker
          exists. A failed injection can therefore actuate a backup without producing a final
          receipt.

          Structured selectors are preflighted earlier and avoid this specific path, but the
          compatibility form remains exposed.

          **Required checkpoint:** compute and validate the complete prospective bytes before
          any backup or target mutation.
          ''',
              '''### FM-LC-003 — injection is validated before backup

          **Standing: ALIVE**

          The complete prospective injected bytes, including marker/cardinality and the final
          10 MiB artifact cap, are validated before `<target>.bak` or the target is written.
          ''',
              'injection finding',
          )

          text = replace_once(
              text,
              '''### FM-LC-004 — unreadable checksum slots fail open

          **Standing: PARTIAL_ALIVE**

          Any checksum-slot read error is currently treated as if no checksum exists. Only
          `NotFound` should have that meaning.

          **Required checkpoint:** continue on `NotFound`; refuse permission, encoding, I/O,
          and directory errors.
          ''',
              '''### FM-LC-004 — checksum ownership state fails closed

          **Standing: ALIVE**

          Only `NotFound` means no prior checksum. Permission, encoding, I/O, and directory
          errors refuse before shell hooks and are rechecked during the write decision.
          ''',
              'checksum finding',
          )

          text = replace_once(
              text,
              '''### FM-LC-006 — selectors without `inject` have inconsistent consequences

          **Standing: PARTIAL_ALIVE**

          Placement selectors are meaningful only for injection. The writer ignores them when
          `inject` is false, but structured selectors are still preflighted by the sync layer
          and can refuse against an existing target. Compatibility strings are not preflighted
          there.

          **Required checkpoint:** either refuse placement properties unless `inject: true`, or
          consistently ignore them before matcher observation. Refusal is the clearer contract.
          ''',
              '''### FM-LC-006 — placement authority is coherent

          **Standing: ALIVE**

          `before`, `after`, and `at_line` require `inject: true`. Exactly one placement
          authority may be configured. Invalid combinations refuse before shell hooks rather
          than relying on implicit precedence or matcher-form differences.
          ''',
              'selector finding',
          )
          directives.write_text(text)
          PY

          cargo fmt --all
          git diff --check

      - name: Execute focused falsifiers
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ggen-engine --lib write::tests -- --nocapture
          cargo test -p ggen-engine --lib template::tests -- --nocapture
          cargo test -p ggen-engine --test frontmatter_fortune5_hardening_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_cardinality_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_matchers_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_maximalism_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_schema_match -- --nocapture

      - name: Publish verified implementation and remove launcher
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fortune5-frontmatter-hardening.yml
          git diff --check
          git config user.name "ggen Fortune 5 hardening"
          git config user.email "actions@github.com"
          git add crates/ggen-engine/src/sync.rs \
                  crates/ggen-engine/src/write.rs \
                  crates/ggen-engine/tests/frontmatter_fortune5_hardening_e2e.rs \
                  docs/reference/frontmatter-maximalism.md \
                  docs/reference/template-directives.md \
                  .github/workflows/fortune5-frontmatter-hardening.yml
          git commit -m "feat(engine): add Fortune 5 frontmatter hardening"
          git push origin HEAD:agent/frontmatter-maximalism
