name: Foundry System Evidence Closure

on:
  pull_request:
    paths:
      - "tools/architecture-foundry/src/bin/admit_verification.rs"
      - ".github/workflows/foundry-system-evidence-closure.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundry-system-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
      CORPUS_SHA: a0ca776df17d1aefac49451235c2b2976f8192fc
    steps:
      - name: Checkout exact runtime candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          path: ggen

      - name: Checkout exact A-H admitted corpus
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/ggen-legacy
          ref: ${{ env.CORPUS_SHA }}
          fetch-depth: 0
          path: corpus

      - name: Manufacture system-level evidence theorem
        working-directory: ggen
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("tools/architecture-foundry/src/bin/admit_verification.rs")
          text = path.read_text()

          old_struct = '''struct SubsystemStanding {
              subsystem: String,
              capability_count: usize,
              equivalence_case_count: usize,
              positive_witnesses: usize,
              negative_falsifiers: usize,
              assigned_verifiers: usize,
              unknown_dispositions: usize,
              standing: String,
          }
          '''
          new_struct = '''struct SubsystemStanding {
              subsystem: String,
              capability_count: usize,
              system_evidence_count: usize,
              equivalence_case_count: usize,
              positive_witnesses: usize,
              negative_falsifiers: usize,
              assigned_verifiers: usize,
              unknown_dispositions: usize,
              evidence_basis: Vec<String>,
              standing: String,
          }
          '''
          if old_struct in text:
              text = text.replace(old_struct, new_struct, 1)
          elif "system_evidence_count: usize" not in text:
              raise SystemExit("SubsystemStanding shape was neither original nor repaired")

          pattern = re.compile(
              r'    let mut standings = Vec::new\(\);\n'
              r'.*?'
              r'    let sabotage_cases_all_refused = sabotage_cases\.iter\(\)\.all\(\|case\| case\.refused\);\n',
              re.S,
          )
          replacement = '''    let receipt_paths: Vec<PathBuf> = (b'A'..=b'H')
              .map(|letter| foundry_root.join(format!("receipts/workstream-{}.json", letter as char)))
              .collect();
          let sabotage_cases = run_sabotage(&cli, &receipt_paths)?;
          let sabotage_cases_all_refused = sabotage_cases.iter().all(|case| case.refused);

          let mut standings = Vec::new();
          let mut subsystems_alive = 0usize;
          let mut unknown_standings = 0usize;
          let mut unassigned_verifiers = 0usize;
          for subsystem in SUBSYSTEMS {
              let members: Vec<&CapabilityRecord> = capabilities
                  .entries
                  .iter()
                  .filter(|capability| capability.owning_subsystem == subsystem)
                  .collect();
              let mut case_count = 0usize;
              let mut positive_witnesses = 0usize;
              let mut negative_falsifiers = 0usize;
              let mut assigned_verifiers = BTreeSet::new();
              let mut unknown_dispositions = 0usize;
              let mut evidence_basis = Vec::new();
              for capability in &members {
                  if capability.disposition == "UNKNOWN" {
                      unknown_dispositions += 1;
                  }
                  if let Some(case) = equivalence_by_id.get(&capability.capability_id) {
                      case_count += 1;
                      positive_witnesses += usize::from(case.positive_witness);
                      negative_falsifiers += usize::from(case.negative_falsifier);
                      if !case.verifier.is_empty() {
                          assigned_verifiers.insert(case.verifier.clone());
                      }
                  }
              }

              let system_evidence = if members.is_empty() {
                  system_evidence(
                      subsystem,
                      &foundry_root,
                      &state,
                      receipts_replayed,
                      sabotage_cases_all_refused,
                  )?
              } else {
                  None
              };
              if let Some(evidence) = &system_evidence {
                  case_count += 1;
                  positive_witnesses += 1;
                  negative_falsifiers += 1;
                  assigned_verifiers.insert(evidence.verifier.clone());
                  evidence_basis.push(evidence.basis.clone());
              }
              if !members.is_empty() {
                  evidence_basis.push("legacy-capability-equivalence".to_string());
              }

              let system_evidence_count = usize::from(system_evidence.is_some());
              let required_evidence = members.len() + system_evidence_count;
              let alive = required_evidence > 0
                  && case_count == required_evidence
                  && positive_witnesses == required_evidence
                  && negative_falsifiers == required_evidence
                  && !assigned_verifiers.is_empty()
                  && unknown_dispositions == 0;
              if alive {
                  subsystems_alive += 1;
              } else {
                  unknown_standings += 1;
              }
              if assigned_verifiers.is_empty() {
                  unassigned_verifiers += 1;
              }
              standings.push(SubsystemStanding {
                  subsystem: subsystem.to_string(),
                  capability_count: members.len(),
                  system_evidence_count,
                  equivalence_case_count: case_count,
                  positive_witnesses,
                  negative_falsifiers,
                  assigned_verifiers: assigned_verifiers.len(),
                  unknown_dispositions,
                  evidence_basis,
                  standing: if alive { "ALIVE" } else { "UNKNOWN" }.to_string(),
              });
          }
          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1 and "let system_evidence_count = usize::from(system_evidence.is_some());" not in text:
              raise SystemExit(f"standing loop replacement count={count}")

          marker = "fn run_sabotage(cli: &Cli, receipt_paths: &[PathBuf]) -> Result<Vec<SabotageCase>> {"
          helper = '''#[derive(Debug)]
          struct SystemEvidence {
              verifier: String,
              basis: String,
          }

          fn system_evidence(
              subsystem: &str,
              foundry_root: &Path,
              state: &WorkstreamStateFile,
              receipts_replayed: usize,
              sabotage_cases_all_refused: bool,
          ) -> Result<Option<SystemEvidence>> {
              let requirement: Option<(&str, &str, Option<&str>)> = match subsystem {
                  "governance" => Some((
                      "ggen-foundry-program-and-state-verifier/v1",
                      "work-program-validation+state-machine+receipt-ownership",
                      Some("receipt-ownership.json"),
                  )),
                  "graph" => Some((
                      "ggen-foundry-migration-graph-verifier/v1",
                      "admitted-D+migration-dependency-graph+receipt-replay",
                      Some("catalogs/migration-dependency-graph.json"),
                  )),
                  "projection" => Some((
                      "ggen-foundry-projection-replay-verifier/v1",
                      "active-receipt-ownership+deterministic-replay",
                      Some("receipt-ownership.json"),
                  )),
                  "evidence" => Some((
                      "ggen-foundry-receipt-portfolio-verifier/v1",
                      "A-H-receipt-portfolio+eight-sabotage-refusals",
                      Some("receipts/workstream-H.json"),
                  )),
                  "verification" => Some((
                      "ggen-foundry-independent-sabotage-verifier/v1",
                      "independent-recomputation+receipt-sabotage-suite",
                      Some("catalogs/equivalence.json"),
                  )),
                  "economics" => Some((
                      "ggen-foundry-solution-pack-economics-verifier/v1",
                      "admitted-G+solution-pack-cost-models+receipt-replay",
                      Some("catalogs/solution-packs.json"),
                  )),
                  "legacy" => Some((
                      "ggen-foundry-legacy-lineage-verifier/v1",
                      "admitted-E+65-component-extraction-ledger+receipt-replay",
                      Some("catalogs/extraction-ledger.json"),
                  )),
                  _ => None,
              };
              let Some((verifier, basis, relative)) = requirement else {
                  return Ok(None);
              };

              match subsystem {
                  "graph" => require_admitted(state, "D")?,
                  "economics" => require_admitted(state, "G")?,
                  "legacy" => require_admitted(state, "E")?,
                  _ => {}
              }
              if receipts_replayed < 9 {
                  bail!("SYSTEM_EVIDENCE_RECEIPT_PORTFOLIO_INCOMPLETE: {subsystem}={receipts_replayed}");
              }
              if !sabotage_cases_all_refused {
                  bail!("SYSTEM_EVIDENCE_NEGATIVE_CONTROL_FAILED: {subsystem}");
              }
              if let Some(relative) = relative {
                  let path = foundry_root.join(relative);
                  if !path.is_file() {
                      bail!("SYSTEM_EVIDENCE_MISSING: {subsystem}: {}", path.display());
                  }
              }
              Ok(Some(SystemEvidence {
                  verifier: verifier.to_string(),
                  basis: basis.to_string(),
              }))
          }

          '''
          if marker in text and "struct SystemEvidence" not in text:
              text = text.replace(marker, helper + marker, 1)
          elif "struct SystemEvidence" not in text:
              raise SystemExit("run_sabotage insertion marker missing")

          path.write_text(text)
          PY
          cargo fmt --manifest-path tools/architecture-foundry/Cargo.toml --all
          git config user.name "ggen-foundry-controller"
          git config user.email "ggen-foundry-controller@users.noreply.github.com"
          git add tools/architecture-foundry/src/bin/admit_verification.rs
          if ! git diff --cached --quiet; then
            git commit -m "feat(foundry): verify all architecture subsystems"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove complete runtime suite
        working-directory: ggen
        run: |
          cargo fmt --manifest-path tools/architecture-foundry/Cargo.toml --all -- --check
          cargo test --manifest-path tools/architecture-foundry/Cargo.toml --all-targets
          cargo build --manifest-path tools/architecture-foundry/Cargo.toml --bin admit_verification

      - name: Execute I against exact A-H corpus
        run: |
          test "$(git -C corpus rev-parse HEAD)" = "$CORPUS_SHA"
          test -z "$(git -C corpus status --porcelain=v1 --untracked-files=all)"
          ggen/tools/architecture-foundry/target/debug/admit_verification \
            --program ggen/docs/architecture-foundry/work-program.yaml \
            --source ggen \
            --corpus corpus \
            > "$RUNNER_TEMP/i-report.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("${{ runner.temp }}/i-report.json").read_text())
          assert report["subsystems_alive"] == 10, report
          assert report["unknown_standings"] == 0, report
          assert report["unassigned_verifiers"] == 0, report
          assert report["sabotage_cases_all_refused"] is True, report
          assert report["external_verifier_passes"] is True, report
          matrix = json.loads(Path("corpus/foundry/catalogs/subsystem-evidence-matrix.json").read_text())
          assert len(matrix["entries"]) == 10
          assert all(entry["standing"] == "ALIVE" for entry in matrix["entries"])
          assert sum(entry["system_evidence_count"] for entry in matrix["entries"]) == 7
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Publish verified runtime theorem
        working-directory: ggen
        run: git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"

      - name: Publish exact I evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foundry-system-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/i-report.json
            corpus/foundry/catalogs/subsystem-evidence-matrix.json
            corpus/foundry/evidence/I/sabotage-report.json
            corpus/foundry/workstreams/I/admission-report.json
            corpus/foundry/receipts/workstream-I.json
          if-no-files-found: error
