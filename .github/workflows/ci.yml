# Minimal ggen CI — seven gates, no legacy workflow sprawl.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt-lint:
    name: fmt + lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt, clippy
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - run: just fmt-check
      - run: just lint

  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt, clippy
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - run: just check

  test-lib:
    name: test-lib
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - run: just test-lib

  mcp-jtbd:
    name: MCP JTBD
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ggen-mcp --locked --test mcp_lifecycle_e2e_test --test tools_surface_parity_test

  a2a-jtbd:
    name: A2A JTBD
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ggen-lsp --locked --features a2a --test a2a_lifecycle_hands_free_test

  abb-sbb:
    name: ABB/SBB
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ggen-abb-sbb --locked

  lock-honesty:
    name: lock honesty
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
      - name: Cargo.lock matches manifests (--locked)
        run: |
          set -euo pipefail
          cargo fetch --locked
          cp Cargo.lock Cargo.lock.committed
          cargo generate-lockfile
          diff -u Cargo.lock.committed Cargo.lock
