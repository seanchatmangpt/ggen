# Minimal JTBD CI — first-principles rewrite.
# Gates map 1:1 onto just recipes. No legacy routers, matrices, or release sprawl.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup ggen build
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: check
      - name: just check
        run: just check

  test-lib:
    name: Test lib
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup ggen build
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: test-lib
      - name: just test-lib
        run: just test-lib

  mcp-lifecycle:
    name: MCP lifecycle e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup ggen build
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: mcp-lifecycle
      - name: just jtbd-mcp-lifecycle
        run: just jtbd-mcp-lifecycle

  a2a-hands-free:
    name: A2A hands-free
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup ggen build
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: a2a-hands-free
      - name: just jtbd-a2a-hands-free
        run: just jtbd-a2a-hands-free

  pre-commit-gates:
    name: Pre-commit gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup ggen build
        uses: ./.github/actions/setup-ggen-build
        with:
          components: rustfmt,clippy
          cache-key-suffix: pre-commit-gates
      # gen:G5's gen:commit (19c0d371…) is orphan vs the squash merge on main
      # (db978ed4…). fetch-depth:0 still misses it; fetch the pin explicitly so
      # guard-generation-hash-pin's `git cat-file -e <sha>^{commit}` succeeds.
      - name: Fetch gen:G5 hash-pin commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PIN=$(awk '
            /^gen:G5 a gen:Generation/ { in_g5=1 }
            in_g5 && /gen:commit/ {
              if (match($0, /"[0-9a-f]{40}"/)) {
                print substr($0, RSTART+1, RLENGTH-2)
                exit
              }
            }
            in_g5 && /^\./ { exit }
          ' .specify/generations.ttl)
          if [ -z "${PIN}" ]; then
            echo "ANDON: could not extract gen:G5 gen:commit from .specify/generations.ttl"
            exit 1
          fi
          echo "Fetching gen:G5 pin ${PIN}"
          # persist-credentials:false strips checkout auth; re-auth for this orphan fetch only.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" \
            fetch --depth=1 origin "${PIN}"
      - name: just jtbd-pre-commit-gates
        run: just jtbd-pre-commit-gates

  ci-status:
    name: CI Status
    needs:
      - check
      - test-lib
      - mcp-lifecycle
      - a2a-hands-free
      - pre-commit-gates
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert all gating jobs succeeded
        env:
          CHECK: ${{ needs.check.result }}
          TEST_LIB: ${{ needs.test-lib.result }}
          MCP: ${{ needs.mcp-lifecycle.result }}
          A2A: ${{ needs.a2a-hands-free.result }}
          GATES: ${{ needs.pre-commit-gates.result }}
        run: |
          set -euo pipefail
          echo "check=$CHECK test-lib=$TEST_LIB mcp=$MCP a2a=$A2A gates=$GATES"
          for r in "$CHECK" "$TEST_LIB" "$MCP" "$A2A" "$GATES"; do
            if [ "$r" != "success" ]; then
              echo "ANDON: gating job result was '$r' (want success)"
              exit 1
            fi
          done
          echo "CI Status: all JTBD gates green"
