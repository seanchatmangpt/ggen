name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # .cargo/config.toml enables the developer-local sccache wrapper. CI proves
  # correctness independently of cache availability, so neutralize it here.
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  verify:
    name: exact-subject verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Reclaim runner space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Admit exact head and CI topology
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          count="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')"
          test "$count" -eq 1
          printf 'subject_sha=%s\nworkflow_count=%s\n' "$EXPECTED_SHA" "$count"

      - name: Install repository-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt, clippy

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Format
        run: cargo fmt --all -- --check

      - name: Compile workspace
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build canonical CLI
        run: cargo build --release --locked -p ggen-cli-lib --bin ggen

      - name: Execute canonical CLI
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/ggen --version
          ./target/release/ggen --help >/dev/null

      - name: Verify publishable library artifact
        run: cargo package --locked --allow-dirty -p ggen

      - name: Emit verification receipt
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p target/ci-receipts
          cat > target/ci-receipts/receipt.json <<JSON
          {"repository":"${GITHUB_REPOSITORY}","subject_sha":"${SUBJECT_SHA}","workflow":"${GITHUB_WORKFLOW}","run_id":"${GITHUB_RUN_ID}","standing":"ALIVE","workflow_count":1}
          JSON
          cat target/ci-receipts/receipt.json

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-${{ github.run_id }}
          path: target/ci-receipts/receipt.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish ggen library
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout verified tag subject
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
      - name: Publish exact package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p ggen
