name: Book Gap Audit

on:
  pull_request:
    paths:
      - 'book/**'
      - 'packs/**'
      - 'examples/**'
      - 'marketplace/**'
      - 'crates/ggen-engine/tests/book_gap_closure_e2e.rs'
      - '.github/workflows/book-gap-audit.yml'
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'packs/**'
      - 'examples/**'
      - 'marketplace/**'
      - 'crates/ggen-engine/tests/book_gap_closure_e2e.rs'
      - '.github/workflows/book-gap-audit.yml'

permissions:
  contents: write

jobs:
  census:
    name: Chicago claim and asset census
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          show-progress: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install independent RDF parser
        run: python3 -m pip install --disable-pip-version-check --quiet 'rdflib==7.1.4'
      - name: Initialize report
        run: ': > gap-report.txt'
      - name: Capability claim coverage
        run: python3 book/scripts/audit_claim_coverage.py | tee -a gap-report.txt
      - name: Executable gap registry coverage
        run: python3 book/scripts/validate_gap_closure.py | tee -a gap-report.txt
      - name: TOML corpus
        run: |
          python3 - <<'PY' | tee -a gap-report.txt
          from pathlib import Path
          import tomllib
          files = sorted(set(Path('packs').rglob('*.toml')) | set(Path('marketplace/packs').rglob('*.toml')))
          failures = []
          for path in files:
              try:
                  with path.open('rb') as stream:
                      tomllib.load(stream)
              except Exception as error:
                  failures.append(f'{path}: {error}')
          print(f'TOML_CENSUS files={len(files)} failures={len(failures)}')
          for failure in failures:
              print(f'TOML_ERROR {failure}')
          raise SystemExit(bool(failures))
          PY
      - name: Bounded Turtle corpus
        run: python3 book/scripts/validate_ttl_corpus.py | tee -a gap-report.txt
      - name: Chicago state tests without process collaborators
        run: |
          python3 -m unittest -v \
            book.tests.test_gap_closure_chicago.TurtleCorpusStateTests \
            book.tests.test_gap_closure_chicago.CapabilityLedgerStateTests \
            2>&1 | tee -a gap-report.txt
      - name: Generated shell laboratory syntax
        run: |
          failures=0
          count=0
          while IFS= read -r -d '' script; do
            count=$((count + 1))
            if ! bash -n "$script"; then
              echo "SHELL_ERROR $script" | tee -a gap-report.txt
              failures=$((failures + 1))
            fi
          done < <(find book/src/listings -type f -name '*.sh' -print0)
          echo "SHELL_CENSUS scripts=$count failures=$failures" | tee -a gap-report.txt
          test "$failures" -eq 0
      - name: Upload gap report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: book-gap-report
          path: gap-report.txt
          if-no-files-found: error

  bounded-authority-repair:
    name: Bounded capability-map source promotion
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/chicago-gap-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: agent/chicago-gap-closure
          show-progress: false
      - name: Inspect bounded repair state
        id: inspect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          text = Path('packs/level-five-book-pack/ontology.ttl').read_text(encoding='utf-8')
          stale = '| **XVII. TCPS Complete Pattern** — 225–302, 337 |'
          admitted = '| **XVII. TCPS Complete Pattern** — 225–302 |'
          stale_count = text.count(stale)
          admitted_count = text.count(admitted)
          if stale_count == 1 and admitted_count == 0:
              value = 'true'
              print('REPAIR_REQUIRED stale=1 admitted=0')
          elif stale_count == 0 and admitted_count == 1:
              value = 'false'
              print('REPAIR_ALREADY_APPLIED stale=0 admitted=1')
          else:
              raise SystemExit(f'REFUSED ambiguous source law: stale={stale_count} admitted={admitted_count}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'needs_repair={value}\n')
          PY
      - name: Provision siblings and pinned Rust toolchain
        if: steps.inspect.outputs.needs_repair == 'true'
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: bounded-book-authority-repair-v2
      - name: Install independent RDF parser
        if: steps.inspect.outputs.needs_repair == 'true'
        run: python3 -m pip install --disable-pip-version-check --quiet 'rdflib==7.1.4'
      - name: Build real ggen CLI
        if: steps.inspect.outputs.needs_repair == 'true'
        run: cargo build --quiet -p ggen-cli-lib --bin ggen
      - name: Promote exact admitted source correction
        if: steps.inspect.outputs.needs_repair == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ontology = Path('packs/level-five-book-pack/ontology.ttl')
          text = ontology.read_text(encoding='utf-8')
          stale = '| **XVII. TCPS Complete Pattern** — 225–302, 337 |'
          admitted = '| **XVII. TCPS Complete Pattern** — 225–302 |'
          if text.count(stale) != 1 or text.count(admitted) != 0:
              raise SystemExit('REFUSED source changed after inspection')
          ontology.write_text(text.replace(stale, admitted), encoding='utf-8', newline='')
          print('PROMOTED ontology sourceText: TCPS range 225–302')
          PY
      - name: Intentionally regenerate lock through real ggen
        if: steps.inspect.outputs.needs_repair == 'true'
        run: |
          set -euo pipefail
          rm book/ggen.lock
          cd book
          ../target/debug/ggen sync run
          ../target/debug/ggen receipt verify
      - name: Independent TTL Tera generated-byte closure
        if: steps.inspect.outputs.needs_repair == 'true'
        run: python3 book/scripts/validate_transcription_360.py
      - name: Independent sabotage sensitivity
        if: steps.inspect.outputs.needs_repair == 'true'
        run: python3 book/scripts/validate_transcription_360.py --sabotage
      - name: Bounded Turtle oracle after promotion
        if: steps.inspect.outputs.needs_repair == 'true'
        run: python3 book/scripts/validate_ttl_corpus.py
      - name: Executable gap registry after promotion
        if: steps.inspect.outputs.needs_repair == 'true'
        run: python3 book/scripts/validate_gap_closure.py
      - name: Prove second-sync identity
        if: steps.inspect.outputs.needs_repair == 'true'
        run: |
          set -euo pipefail
          find book/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/book-before.sha256
          cp book/ggen.lock /tmp/ggen-before.lock
          cd book
          ../target/debug/ggen sync run
          ../target/debug/ggen receipt verify
          cd ..
          find book/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/book-after.sha256
          cmp /tmp/book-before.sha256 /tmp/book-after.sha256
          cmp /tmp/ggen-before.lock book/ggen.lock
          echo 'SECOND_SYNC_IDENTICAL receipt=verified'
      - name: Refuse unexpected product or authority drift
        if: steps.inspect.outputs.needs_repair == 'true'
        run: |
          set -euo pipefail
          git diff --exit-code -- book/src
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all -- \
            packs/level-five-book-pack/ontology.ttl \
            book/ggen.lock \
            book/src \
            ':(exclude)book/.ggen-v2/**')
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx ' M book/ggen.lock'
          printf '%s\n' "${changed[@]}" | grep -Fx ' M packs/level-five-book-pack/ontology.ttl'
      - name: Commit and publish receipted repair
        if: steps.inspect.outputs.needs_repair == 'true'
        run: |
          set -euo pipefail
          git config user.name 'ggen authority repair'
          git config user.email 'actions@users.noreply.github.com'
          git add book/ggen.lock packs/level-five-book-pack/ontology.ttl
          git commit -m 'fix(book): promote capability map source law'
          git push origin HEAD:agent/chicago-gap-closure
          echo "REPAIR_COMMIT $(git rev-parse HEAD)"
