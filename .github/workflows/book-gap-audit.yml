name: Book Gap Audit

on:
  pull_request:
    paths:
      - 'book/**'
      - 'packs/**'
      - 'examples/**'
      - 'marketplace/**'
      - 'crates/ggen-engine/tests/book_gap_closure_e2e.rs'
      - '.github/workflows/book-gap-audit.yml'
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'packs/**'
      - 'examples/**'
      - 'marketplace/**'
      - 'crates/ggen-engine/tests/book_gap_closure_e2e.rs'
      - '.github/workflows/book-gap-audit.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  census:
    name: Chicago claim and asset census
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          show-progress: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Install independent RDF parser
        run: python3 -m pip install --disable-pip-version-check --quiet 'rdflib==7.1.4'

      - name: Initialize report
        run: ': > gap-report.txt'

      - name: Capability claim coverage
        run: |
          set -o pipefail
          python3 book/scripts/audit_claim_coverage.py | tee -a gap-report.txt

      - name: Executable gap registry coverage
        run: |
          set -o pipefail
          python3 book/scripts/validate_gap_closure.py | tee -a gap-report.txt

      - name: TOML corpus
        run: |
          set -o pipefail
          python3 - <<'PY' | tee -a gap-report.txt
          from pathlib import Path
          import tomllib

          files = sorted(
              set(Path('packs').rglob('*.toml'))
              | set(Path('marketplace/packs').rglob('*.toml'))
          )
          failures = []
          for path in files:
              try:
                  with path.open('rb') as stream:
                      tomllib.load(stream)
              except Exception as error:
                  failures.append(f'{path}: {error}')
          print(f'TOML_CENSUS files={len(files)} failures={len(failures)}')
          for failure in failures:
              print(f'TOML_ERROR {failure}')
          raise SystemExit(bool(failures))
          PY

      - name: Bounded Turtle corpus
        run: |
          set -o pipefail
          python3 book/scripts/validate_ttl_corpus.py | tee -a gap-report.txt

      - name: Chicago state tests without process collaborators
        run: |
          set -o pipefail
          python3 -m unittest -v \
            book.tests.test_gap_closure_chicago.TurtleCorpusStateTests \
            book.tests.test_gap_closure_chicago.CapabilityLedgerStateTests \
            2>&1 | tee -a gap-report.txt

      - name: Generated shell laboratory syntax
        run: |
          failures=0
          count=0
          while IFS= read -r -d '' script; do
            count=$((count + 1))
            if ! bash -n "$script"; then
              echo "SHELL_ERROR $script" | tee -a gap-report.txt
              failures=$((failures + 1))
            fi
          done < <(find book/src/listings -type f -name '*.sh' -print0)
          echo "SHELL_CENSUS scripts=$count failures=$failures" | tee -a gap-report.txt
          test "$failures" -eq 0

      - name: Upload gap report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: book-gap-report
          path: gap-report.txt
          if-no-files-found: error
