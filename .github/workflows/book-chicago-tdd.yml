name: Book Chicago TDD

on:
  pull_request:
    paths:
      - 'book/**'
      - 'packs/**'
      - 'examples/**'
      - 'marketplace/**'
      - 'crates/ggen-engine/**'
      - 'crates/chicago-tdd-tools/**'
      - '.github/workflows/book-chicago-tdd.yml'
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'packs/**'
      - 'examples/**'
      - 'marketplace/**'
      - 'crates/ggen-engine/**'
      - 'crates/chicago-tdd-tools/**'
      - '.github/workflows/book-chicago-tdd.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  chicago:
    name: Real-state gap closure
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Provision siblings and pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: book-chicago

      - name: Install independent RDF parser
        run: python3 -m pip install --disable-pip-version-check --quiet 'rdflib==7.1.4'

      - name: Build the real ggen CLI
        run: cargo build -p ggen-cli-lib --bin ggen

      - name: Validate bounded Turtle state
        run: python3 book/scripts/validate_ttl_corpus.py

      - name: Execute Python Chicago state and consumer tests
        env:
          GGEN_BIN: ${{ github.workspace }}/target/debug/ggen
        run: python3 -m unittest -v book.tests.test_gap_closure_chicago

      - name: Execute six-gap-pack and MFW evolution tests
        run: cargo test -p ggen-engine --test book_gap_closure_e2e -- --nocapture

      - name: Execute maximal pack composition capstones
        run: cargo test -p ggen-engine --test composed_packs_e2e -- --nocapture

      - name: Execute named engine, graph, marketplace, and anti-cheat falsifiers
        run: |
          cargo test -p ggen-engine --test reasoner_independence_e2e
          cargo test -p ggen-graph
          cargo test -p ggen-marketplace
          cargo test -p ggen-cheat-scanner

      - name: Validate complete book and Level Five inventory
        run: |
          python3 book/scripts/check_book.py
          python3 book/scripts/check_level_five.py
          python3 book/scripts/audit_claim_coverage.py

      - name: Refuse tracked drift from all real-state tests
        run: |
          set -euo pipefail
          drift=$(git status --porcelain=v1 --untracked-files=all -- \
            book packs examples marketplace \
            ':(exclude)book/.ggen-v2/**' \
            ':(exclude)book/book/**' \
            ':(exclude)examples/**/.ggen-v2/**' \
            ':(exclude)examples/**/target/**')
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo '::error::Chicago tests left tracked or unowned generated drift.'
            exit 1
          fi
