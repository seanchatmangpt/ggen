name: Book 360 Preflight

on:
  pull_request:
    paths:
      - 'book/scripts/validate_transcription_360.py'
      - 'book/scripts/diagnose_transcription_360.py'
      - 'book/src/**'
      - 'packs/level-five-book-pack/**'
      - '.github/workflows/book-360-preflight.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Independent TTL Tera output closure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Quiet clone and run 360 validator
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 \
            --branch agent/post-agi-docs-core-team \
            https://github.com/seanchatmangpt/ggen.git candidate
          cd candidate
          python3 book/scripts/diagnose_transcription_360.py
          python3 book/scripts/validate_transcription_360.py
          python3 book/scripts/validate_transcription_360.py --sabotage
