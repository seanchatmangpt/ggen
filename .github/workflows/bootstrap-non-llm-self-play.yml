name: Bootstrap Non-LLM SAFe EA Self-Play

on:
  pull_request:
    branches:
      - agent/gbb-000-canonical-kernel
    paths:
      - '.self-play-bootstrap/**'
      - '.github/workflows/bootstrap-non-llm-self-play.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-non-llm-self-play-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admit-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact self-play branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || 'agent/non-llm-safe-ea-self-play' }}

      - name: Admit digest-pinned source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .self-play-bootstrap/payload.part-* > /tmp/non-llm-self-play.tar.gz.b64
          base64 --decode /tmp/non-llm-self-play.tar.gz.b64 > /tmp/non-llm-self-play.tar.gz
          echo '94f7012049dfbe099b17baaa7bc2ff0c4fbcbe52b06ab0219618e842578d0d3f  /tmp/non-llm-self-play.tar.gz' | sha256sum -c -
          tar -xzf /tmp/non-llm-self-play.tar.gz -C .
          test -s crates/ggen-architecture/src/self_play.rs
          test -s packs/safe-ea-strategy-self-play-pack/ontology.ttl
          test -s examples/safe-ea-strategy-self-play/ontology.ttl
          test -s examples/safe-ea-strategy-self-play/ggen.toml

      - name: Provision pinned Rust formatter
        uses: ./.github/actions/setup-ggen-build

      - name: Normalize admitted Rust source
        shell: bash
        run: rustfmt --edition 2021 crates/ggen-architecture/src/canonical.rs crates/ggen-architecture/src/self_play.rs

      - name: Parse ontologies and refusal gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check rdflib==7.1.4
          python3 - <<'PY'
          from pathlib import Path
          from rdflib import Graph
          from rdflib.plugins.sparql import prepareQuery

          pack = Path('packs/safe-ea-strategy-self-play-pack')
          graph = Graph()
          graph.parse(pack / 'ontology.ttl', format='turtle')
          graph.parse('examples/safe-ea-strategy-self-play/ontology.ttl', format='turtle')
          gates = sorted((pack / 'gates').glob('*.rq'))
          assert len(gates) == 6, gates
          for gate in gates:
              query = gate.read_text()
              prepareQuery(query)
              rows = list(graph.query(query))
              assert not rows, (gate.name, rows[:10])
          assert len(graph) >= 2200, len(graph)
          print(f'SELF_PLAY_GRAPH_ALIVE triples={len(graph)} gates={len(gates)}')
          PY

      - name: Enforce constitutional source boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'TODO|FIXME|unimplemented!\(|todo!\(|mockall|Mock[A-Z]' \
            crates/ggen-architecture/src/self_play.rs \
            packs/safe-ea-strategy-self-play-pack \
            examples/safe-ea-strategy-self-play
          grep -n 'pub mod self_play' crates/ggen-architecture/src/canonical.rs
          grep -n 'actuation_performed: false' crates/ggen-architecture/src/self_play.rs
          grep -n 'SELF_PLAY_REQUIRED_BROKER: &str = "BRCE"' crates/ggen-architecture/src/self_play.rs

      - name: Publish admitted source and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ggen self-play bootstrap'
          git config user.email 'ggen-self-play@users.noreply.github.com'
          git rm -r .self-play-bootstrap
          git rm .github/workflows/bootstrap-non-llm-self-play.yml
          git add \
            crates/ggen-architecture/src/canonical.rs \
            crates/ggen-architecture/src/self_play.rs \
            packs/safe-ea-strategy-self-play-pack \
            examples/safe-ea-strategy-self-play
          git diff --cached --check
          git commit -m 'feat(architecture): add non-LLM SAFe EA self-play framework'
          git fetch origin agent/gbb-000-canonical-kernel
          git rebase origin/agent/gbb-000-canonical-kernel
          git push origin HEAD:agent/non-llm-safe-ea-self-play
