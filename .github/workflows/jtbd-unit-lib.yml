# Optional focused unit lane — not required for MCP/A2A JTBD courts.
# Enable in branch protection only if desired.

name: JTBD unit lib (optional)

on:
  workflow_dispatch:

concurrency:
  group: jtbd-unit-lib-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-lib:
    name: unit (just test-lib)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3e43724112d50571f2 # v4.2.2
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@a72605b362aa118fecdfb2135cb78126dfe9a2c # v2.7.5
      - name: just test-lib
        run: just test-lib
