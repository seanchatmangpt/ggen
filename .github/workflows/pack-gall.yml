name: Pack Gall Checkpoints

on:
  pull_request:
    paths:
      - 'crates/ggen-cli/src/cmds/bblock.rs'
      - 'crates/ggen-cli/src/cmds/pack.rs'
      - 'crates/ggen-cli/src/cmds/packs.rs'
      - 'crates/ggen-marketplace/src/packs/**'
      - 'packs/fortune5-deployment-blocks-pack/**'
      - 'docs/marketplace/ATOMIC_PACKS.md'
      - 'docs/architecture/BBLOCKS-PACKS-ARD-PRD-v26.7.31.md'
      - 'tools/pack-gall/**'
      - '.github/workflows/pack-gall.yml'
  push:
    branches: [main]
    paths:
      - 'crates/ggen-cli/src/cmds/bblock.rs'
      - 'crates/ggen-cli/src/cmds/pack.rs'
      - 'crates/ggen-cli/src/cmds/packs.rs'
      - 'crates/ggen-marketplace/src/packs/**'
      - 'packs/fortune5-deployment-blocks-pack/**'
      - 'docs/marketplace/ATOMIC_PACKS.md'
      - 'docs/architecture/BBLOCKS-PACKS-ARD-PRD-v26.7.31.md'
      - 'tools/pack-gall/**'
      - '.github/workflows/pack-gall.yml'

permissions:
  contents: read

concurrency:
  group: pack-gall-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: pack-gall/standing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust and just
        run: |
          rustup toolchain install nightly-2026-04-15 --profile minimal
          rustup default nightly-2026-04-15
          cargo install just --locked --version 1.40.0
      - name: Execute ten Gall checkpoints
        run: just --justfile tools/pack-gall/justfile verify
      - name: Upload verifier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pack-gall-evidence-${{ github.sha }}
          path: .ggen/pack-gall/
          if-no-files-found: error
