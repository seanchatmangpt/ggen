name: Foundry Historical Lineage Clean Room

on:
  pull_request:
    paths:
      - "tools/architecture-foundry/src/lib.rs"
      - "tools/architecture-foundry/src/bin/admit_clean_room.rs"
      - ".github/workflows/foundry-historical-lineage-clean-room.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundry-historical-lineage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RUSTC_WRAPPER: ""
      CORPUS_SHA: 86c3ff13f0373cdb0000586a387cdd8554a6c58a
    steps:
      - name: Checkout exact runtime candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          path: ggen

      - name: Checkout exact A-I admitted corpus
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/ggen-legacy
          ref: ${{ env.CORPUS_SHA }}
          fetch-depth: 0
          path: corpus

      - name: Manufacture historical lineage verifier and semantic replay
        working-directory: ggen
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          lib = Path("tools/architecture-foundry/src/lib.rs")
          text = lib.read_text()
          struct_marker = "#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct ExtractionReport {"
          historical_structs = '''#[derive(Debug, Clone, Serialize, Deserialize)]
          struct HistoricalExtractionLineageRecord {
              schema_version: String,
              capability_id: String,
              source_repository: String,
              corpus_repository: String,
              source_head: String,
              corpus_parent_head: String,
              historical_commit: String,
              source_path: String,
              destination_path: String,
              manifest_digest: String,
              blob_digests: Vec<String>,
              disposition: String,
              classification: String,
              source_removed: bool,
          }

          #[derive(Debug, Clone, Serialize, Deserialize)]
          struct HistoricalComponentManifest {
              schema_version: String,
              capability_id: String,
              source_repository: String,
              corpus_repository: String,
              source_head: String,
              corpus_parent_head: String,
              historical_commit: String,
              requested_source_path: String,
              normalized_source_path: String,
              disposition: String,
              classification: String,
              kernel_owner: String,
              corpus_destination: String,
              resolution: String,
              source_files: Vec<HistoricalComponentSourceFile>,
              semantic_evidence_path: String,
              semantic_evidence_digest: String,
              source_removed: bool,
              recovery_command: String,
          }

          #[derive(Debug, Clone, Serialize, Deserialize)]
          struct HistoricalComponentSourceFile {
              git_path: String,
              git_object_id: String,
              git_mode: String,
              byte_length: usize,
              blake3: String,
              blob_path: String,
          }

          '''
          if struct_marker in text and "struct HistoricalExtractionLineageRecord" not in text:
              text = text.replace(struct_marker, historical_structs + struct_marker, 1)
          elif "struct HistoricalExtractionLineageRecord" not in text:
              raise SystemExit("historical lineage struct marker missing")

          lineage_pattern = re.compile(
              r'fn verify_lineage_record\(source_path: &Path, corpus_path: &Path, path: &Path\) -> Result<\(\)> \{.*?\n\}\n\nfn replay_receipt',
              re.S,
          )
          lineage_replacement = '''fn verify_lineage_record(source_path: &Path, corpus_path: &Path, path: &Path) -> Result<()> {
              let bytes = read(path)?;
              let value: serde_json::Value = serde_json::from_slice(&bytes)?;
              match value.get("schema_version").and_then(serde_json::Value::as_str) {
                  Some(LINEAGE_SCHEMA) => {
                      let record: LineageRecord = serde_json::from_value(value)?;
                      verify_current_lineage_record(source_path, corpus_path, path, &record)
                  }
                  Some("ggen.enterprise-architecture-foundry.extraction-admission/1") => {
                      let record: HistoricalExtractionLineageRecord = serde_json::from_value(value)?;
                      verify_historical_extraction_lineage(source_path, corpus_path, path, &record)
                  }
                  Some(observed) => refusal(
                      "LINEAGE_SCHEMA_INVALID",
                      format!("{} has schema {observed}", path.display()),
                  ),
                  None => refusal(
                      "LINEAGE_SCHEMA_MISSING",
                      path.display().to_string(),
                  ),
              }
          }

          fn verify_current_lineage_record(
              source_path: &Path,
              corpus_path: &Path,
              path: &Path,
              record: &LineageRecord,
          ) -> Result<()> {
              if record.schema_version != LINEAGE_SCHEMA {
                  return refusal(
                      "LINEAGE_SCHEMA_INVALID",
                      format!("{} has schema {}", path.display(), record.schema_version),
                  );
              }
              let source_relative = safe_relative(&record.source_path)?;
              let destination_relative = safe_relative(&record.destination_path)?;
              let source_digest = digest_file(&source_path.join(source_relative))?;
              let destination_digest = digest_file(&corpus_path.join(destination_relative))?;
              if source_digest != record.content_digest || destination_digest != record.content_digest {
                  return refusal(
                      "LINEAGE_DIGEST_MISMATCH",
                      format!("component {} content changed", record.component_id),
                  );
              }
              Ok(())
          }

          fn verify_historical_extraction_lineage(
              source_path: &Path,
              corpus_path: &Path,
              path: &Path,
              record: &HistoricalExtractionLineageRecord,
          ) -> Result<()> {
              if record.source_removed {
                  return refusal(
                      "HISTORICAL_LINEAGE_SOURCE_REMOVED",
                      record.capability_id.clone(),
                  );
              }
              if !is_full_git_sha(&record.historical_commit) {
                  return refusal(
                      "HISTORICAL_LINEAGE_COMMIT_INVALID",
                      format!("{}: {}", record.capability_id, record.historical_commit),
                  );
              }
              let commit_type = git(source_path, &["cat-file", "-t", &record.historical_commit])?;
              if commit_type != "commit" {
                  return refusal(
                      "HISTORICAL_LINEAGE_COMMIT_NOT_COMMIT",
                      format!("{}: {}", record.capability_id, commit_type),
                  );
              }

              let destination = safe_relative(&record.destination_path)?;
              let manifest_path = corpus_path.join(destination).join("component-manifest.json");
              let manifest_bytes = read(&manifest_path)?;
              let observed_manifest_digest = digest_bytes(&manifest_bytes);
              if observed_manifest_digest != record.manifest_digest {
                  return refusal(
                      "HISTORICAL_LINEAGE_MANIFEST_DRIFT",
                      format!(
                          "{} expected {}, observed {}",
                          record.capability_id, record.manifest_digest, observed_manifest_digest
                      ),
                  );
              }
              let manifest: HistoricalComponentManifest = serde_json::from_slice(&manifest_bytes)?;
              if manifest.capability_id != record.capability_id
                  || manifest.historical_commit != record.historical_commit
                  || manifest.corpus_destination != record.destination_path
                  || manifest.source_removed
              {
                  return refusal(
                      "HISTORICAL_LINEAGE_MANIFEST_IDENTITY_MISMATCH",
                      record.capability_id.clone(),
                  );
              }

              let mut expected_blob_digests = record.blob_digests.clone();
              let mut observed_blob_digests: Vec<String> = manifest
                  .source_files
                  .iter()
                  .map(|entry| entry.blake3.clone())
                  .collect();
              expected_blob_digests.sort();
              observed_blob_digests.sort();
              if expected_blob_digests != observed_blob_digests {
                  return refusal(
                      "HISTORICAL_LINEAGE_BLOB_SET_MISMATCH",
                      record.capability_id.clone(),
                  );
              }

              let semantic_evidence = safe_relative(&manifest.semantic_evidence_path)?;
              let semantic_digest = digest_file(&corpus_path.join(semantic_evidence))?;
              if semantic_digest != manifest.semantic_evidence_digest {
                  return refusal(
                      "HISTORICAL_LINEAGE_SEMANTIC_EVIDENCE_DRIFT",
                      record.capability_id.clone(),
                  );
              }

              if manifest.source_files.is_empty() {
                  if manifest.resolution != "SEMANTIC_EVIDENCE_ONLY" {
                      return refusal(
                          "HISTORICAL_LINEAGE_EMPTY_SOURCE_INVALID",
                          record.capability_id.clone(),
                      );
                  }
              } else if manifest.resolution != "GIT_OBJECTS_RECOVERED" {
                  return refusal(
                      "HISTORICAL_LINEAGE_RESOLUTION_INVALID",
                      record.capability_id.clone(),
                  );
              }

              for source_file in &manifest.source_files {
                  let git_path = safe_relative(&source_file.git_path)?;
                  if !is_full_git_sha(&source_file.git_object_id) {
                      return refusal(
                          "HISTORICAL_LINEAGE_OBJECT_ID_INVALID",
                          format!("{}: {}", record.capability_id, source_file.git_object_id),
                      );
                  }
                  let object_spec = format!(
                      "{}:{}",
                      record.historical_commit,
                      git_path.to_string_lossy()
                  );
                  let observed_object_id = git(source_path, &["rev-parse", &object_spec])?;
                  if observed_object_id != source_file.git_object_id {
                      return refusal(
                          "HISTORICAL_LINEAGE_OBJECT_ID_MISMATCH",
                          format!(
                              "{}:{} expected {}, observed {}",
                              record.capability_id,
                              source_file.git_path,
                              source_file.git_object_id,
                              observed_object_id
                          ),
                      );
                  }
                  let object_type = git(source_path, &["cat-file", "-t", &source_file.git_object_id])?;
                  if object_type != "blob" {
                      return refusal(
                          "HISTORICAL_LINEAGE_OBJECT_NOT_BLOB",
                          format!("{}: {}", record.capability_id, object_type),
                      );
                  }
                  let object_bytes = git_bytes(
                      source_path,
                      &["cat-file", "blob", &source_file.git_object_id],
                  )?;
                  let object_digest = digest_bytes(&object_bytes);
                  if object_digest != source_file.blake3
                      || object_bytes.len() != source_file.byte_length
                  {
                      return refusal(
                          "HISTORICAL_LINEAGE_OBJECT_DIGEST_MISMATCH",
                          format!("{}: {}", record.capability_id, source_file.git_path),
                      );
                  }
                  let blob_relative = safe_relative(&source_file.blob_path)?;
                  let blob_digest = digest_file(&corpus_path.join(blob_relative))?;
                  if blob_digest != source_file.blake3 {
                      return refusal(
                          "HISTORICAL_LINEAGE_CORPUS_BLOB_DRIFT",
                          format!("{}: {}", record.capability_id, source_file.blob_path),
                      );
                  }
              }
              Ok(())
          }

          fn is_full_git_sha(value: &str) -> bool {
              value.len() == 40 && value.bytes().all(|byte| byte.is_ascii_hexdigit())
          }

          fn replay_receipt'''
          text, count = lineage_pattern.subn(lineage_replacement, text, count=1)
          if count != 1 and "fn verify_historical_extraction_lineage(" not in text:
              raise SystemExit(f"lineage verifier replacement count={count}")
          lib.write_text(text)

          clean = Path("tools/architecture-foundry/src/bin/admit_clean_room.rs")
          text = clean.read_text()

          def exact(old: str, new: str, sentinel: str, name: str) -> None:
              global text
              if old in text:
                  text = text.replace(old, new, 1)
              elif sentinel not in text:
                  raise SystemExit(f"{name} marker missing")

          exact(
              "    Receipt, WorkstreamStateFile, RECEIPT_SCHEMA,\n",
              "    Receipt, VerificationReport, WorkstreamStateFile, RECEIPT_SCHEMA,\n",
              "Receipt, VerificationReport, WorkstreamStateFile",
              "verification import",
          )
          exact(
              "    receipts_replayed: usize,\n    verification_digest: String,\n",
              "    receipts_replayed: usize,\n    verification_valid: bool,\n    verification_digest: String,\n",
              "verification_valid: bool",
              "run verification field",
          )
          exact(
              "    clean_room_build_success: bool,\n    replay_differences: usize,\n",
              "    clean_room_build_success: bool,\n    clean_room_verification_success: bool,\n    replay_differences: usize,\n",
              "clean_room_verification_success: bool",
              "report verification field",
          )
          exact(
              "    let clean_room_build_success = first.runtime_tests_passed && second.runtime_tests_passed;\n    let replay_differences = usize::from(first.verification_digest != second.verification_digest);\n",
              "    let clean_room_build_success = first.runtime_tests_passed && second.runtime_tests_passed;\n    let clean_room_verification_success = first.verification_valid && second.verification_valid;\n    let replay_differences = usize::from(first.verification_digest != second.verification_digest);\n",
              "let clean_room_verification_success",
              "verification comparison",
          )
          refusal_pattern = re.compile(
              r'    if !clean_room_build_success\s*\|\| replay_differences != 0\s*\|\| generated_drift != 0 \{\s*'
              r'bail!\(\s*"CLEAN_ROOM_REFUSED: build=\{clean_room_build_success\}, replay=\{replay_differences\}, drift=\{generated_drift\}"\s*\);\s*\}\n',
              re.S,
          )
          refusal_replacement = '''    if !clean_room_build_success
              || !clean_room_verification_success
              || replay_differences != 0
              || generated_drift != 0
          {
              bail!(
                  "CLEAN_ROOM_REFUSED: build={clean_room_build_success}, verification={clean_room_verification_success}, replay={replay_differences}, drift={generated_drift}"
              );
          }
          '''
          text, count = refusal_pattern.subn(refusal_replacement, text, count=1)
          if count == 0 and "verification={clean_room_verification_success}" not in text:
              raise SystemExit("clean-room refusal marker missing")
          exact(
              "        clean_room_build_success,\n        replay_differences,\n",
              "        clean_room_build_success,\n        clean_room_verification_success,\n        replay_differences,\n",
              "clean_room_verification_success,",
              "report initializer",
          )
          exact(
              "    let verification = verify_corpus(program, &source_clone, &corpus_clone)?;\n    let verification_digest = digest_bytes(&serde_json::to_vec(&verification)?);\n",
              "    let verification = verify_corpus(program, &source_clone, &corpus_clone)?;\n    let verification_valid = verification.program_valid\n        && verification.manifest_valid\n        && verification.invalid_lineage_records.is_empty()\n        && verification.invalid_receipts.is_empty();\n    let verification_digest = semantic_verification_digest(\n        &verification,\n        &source_clone,\n        &corpus_clone,\n    )?;\n",
              "semantic_verification_digest(",
              "semantic verification digest",
          )
          exact(
              "    if !runtime_tests_passed || !clean_after_run {\n        bail!(\n            \"CLEAN_ROOM_RUN_FAILED: run={run}, tests={runtime_tests_passed}, clean={clean_after_run}\"\n        );\n    }\n",
              "    if !runtime_tests_passed || !verification_valid || !clean_after_run {\n        bail!(\n            \"CLEAN_ROOM_RUN_FAILED: run={run}, tests={runtime_tests_passed}, verification={verification_valid}, invalid_lineage={}, invalid_receipts={}, clean={clean_after_run}\",\n            verification.invalid_lineage_records.len(),\n            verification.invalid_receipts.len(),\n        );\n    }\n",
              "invalid_lineage={}",
              "run verifier refusal",
          )
          exact(
              "        receipts_replayed,\n        verification_digest,\n",
              "        receipts_replayed,\n        verification_valid,\n        verification_digest,\n",
              "verification_valid,",
              "run initializer",
          )
          marker = "fn git_clone(source: &Path, destination: &Path) -> Result<()> {"
          helper = '''fn semantic_verification_digest(
              report: &VerificationReport,
              source_root: &Path,
              corpus_root: &Path,
          ) -> Result<String> {
              let mut value = serde_json::to_value(report)?;
              normalize_verification_paths(&mut value, source_root, corpus_root);
              Ok(digest_bytes(&serde_json::to_vec(&value)?))
          }

          fn normalize_verification_paths(value: &mut JsonValue, source_root: &Path, corpus_root: &Path) {
              match value {
                  JsonValue::String(text) => {
                      let source = source_root.to_string_lossy();
                      let corpus = corpus_root.to_string_lossy();
                      *text = text.replace(source.as_ref(), "$SOURCE");
                      *text = text.replace(corpus.as_ref(), "$CORPUS");
                  }
                  JsonValue::Array(values) => {
                      for value in values {
                          normalize_verification_paths(value, source_root, corpus_root);
                      }
                  }
                  JsonValue::Object(values) => {
                      for value in values.values_mut() {
                          normalize_verification_paths(value, source_root, corpus_root);
                      }
                  }
                  _ => {}
              }
          }

          '''
          if marker in text and "fn semantic_verification_digest(" not in text:
              text = text.replace(marker, helper + marker, 1)
          elif "fn semantic_verification_digest(" not in text:
              raise SystemExit("semantic digest helper marker missing")
          clean.write_text(text)
          PY
          cargo fmt --manifest-path tools/architecture-foundry/Cargo.toml --all
          git config user.name "ggen-foundry-controller"
          git config user.email "ggen-foundry-controller@users.noreply.github.com"
          git add tools/architecture-foundry/src/lib.rs tools/architecture-foundry/src/bin/admit_clean_room.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix(foundry): verify historical lineage in clean-room replay"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove complete runtime suite
        working-directory: ggen
        run: |
          cargo fmt --manifest-path tools/architecture-foundry/Cargo.toml --all -- --check
          cargo test --manifest-path tools/architecture-foundry/Cargo.toml --all-targets
          cargo build --manifest-path tools/architecture-foundry/Cargo.toml --bins

      - name: Prove all 65 historical lineage records
        run: |
          ggen/tools/architecture-foundry/target/debug/ggen-foundry verify \
            --program ggen/docs/architecture-foundry/work-program.yaml \
            --source ggen --corpus corpus \
            > "$RUNNER_TEMP/historical-lineage-report.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("${{ runner.temp }}/historical-lineage-report.json").read_text())
          assert report["lineage_records_checked"] == 65, report
          assert report["invalid_lineage_records"] == [], report
          assert report["invalid_receipts"] == [], report
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Execute historical-commit sabotage
        run: |
          root="$(mktemp -d)"
          git clone --quiet --local corpus "$root/corpus"
          lineage="$(find "$root/corpus/foundry/lineage/components" -type f -name '*.json' | sort | head -1)"
          python3 - "$lineage" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          value = json.loads(path.read_text())
          value["historical_commit"] = "0" * 40
          path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n")
          PY
          ggen/tools/architecture-foundry/target/debug/ggen-foundry verify \
            --program ggen/docs/architecture-foundry/work-program.yaml \
            --source ggen --corpus "$root/corpus" \
            > "$RUNNER_TEMP/historical-lineage-sabotage.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("${{ runner.temp }}/historical-lineage-sabotage.json").read_text())
          assert len(report["invalid_lineage_records"]) == 1, report
          assert "HISTORICAL_LINEAGE_COMMIT" in report["invalid_lineage_records"][0], report
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Execute J against exact A-I corpus
        run: |
          test "$(git -C corpus rev-parse HEAD)" = "$CORPUS_SHA"
          test -z "$(git -C corpus status --porcelain=v1 --untracked-files=all)"
          ggen/tools/architecture-foundry/target/debug/admit_clean_room \
            --program ggen/docs/architecture-foundry/work-program.yaml \
            --source ggen --corpus corpus \
            > "$RUNNER_TEMP/j-report.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("${{ runner.temp }}/j-report.json").read_text())
          assert report["clean_room_build_success"] is True, report
          assert report["clean_room_verification_success"] is True, report
          assert report["replay_differences"] == 0, report
          assert report["generated_drift"] == 0, report
          assert report["second_run_semantic_result"] == "NO_SEMANTIC_CHANGE", report
          state = json.loads(Path("corpus/foundry/workstreams/state.json").read_text())
          assert state["workstreams"]["J"]["status"] == "ADMITTED"
          assert state["workstreams"]["K"]["status"] == "READY"
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Replay J receipt on exact consequence
        run: |
          git -C corpus config user.name foundry-verifier
          git -C corpus config user.email foundry-verifier@example.invalid
          git -C corpus add foundry
          git -C corpus commit --quiet -m "proof: admit workstream J"
          ggen/tools/architecture-foundry/target/debug/ggen-foundry replay \
            --source ggen --corpus corpus

      - name: Publish verified runtime theorem
        working-directory: ggen
        run: git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"

      - name: Publish historical lineage and J evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundry-historical-lineage-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/historical-lineage-report.json
            ${{ runner.temp }}/historical-lineage-sabotage.json
            ${{ runner.temp }}/j-report.json
            corpus/foundry/workstreams/J/admission-report.json
            corpus/foundry/receipts/workstream-J.json
            corpus/foundry/workstreams/state.json
          if-no-files-found: warn
