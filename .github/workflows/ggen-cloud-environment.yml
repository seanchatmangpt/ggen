name: ggen Cloud DfCM Environment

on:
  pull_request:
    paths:
      - '.github/workflows/ggen-cloud-environment.yml'
      - '.github/actions/setup-ggen-build/**'
      - 'cloud/ggen-ecosystem.lock.toml'
      - 'scripts/ci/manufacture-ggen-cloud-environment.sh'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/ggen-cli/**'
      - 'crates/bcinr-pddl/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ggen-cloud-environment.yml'
      - '.github/actions/setup-ggen-build/**'
      - 'cloud/ggen-ecosystem.lock.toml'
      - 'scripts/ci/manufacture-ggen-cloud-environment.sh'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/ggen-cli/**'
      - 'crates/bcinr-pddl/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ggen-cloud-dfcm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: ""
  CARGO_INCREMENTAL: "0"

jobs:
  manufacture:
    name: Cloud DfCM Capsule
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Bind exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          printf '%s\n' "$expected" > "$RUNNER_TEMP/ggen-candidate.sha"

      - name: Validate changed CI doctrine
        shell: bash
        run: |
          set -euo pipefail
          scoped=.github/.ggen-cloud-validation
          trap 'rm -rf "$scoped"' EXIT
          rm -rf "$scoped"
          mkdir -p "$scoped"
          cp .github/workflows/ggen-cloud-environment.yml "$scoped/"
          cp .github/workflows/ci.yml "$scoped/"
          python3 scripts/ci/validate-workflows.py "$scoped"

      - name: Provision exact ggen build environment
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: cloud-dfcm

      - name: Build exact ggen runtime
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p ggen-cli-lib --bin ggen
          target/debug/ggen --version

      - name: Compile and execute the DfCM crown
        id: dfcm
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p bcinr-pddl --test dfcm_crown_suite --no-run \
            --message-format=json > "$RUNNER_TEMP/dfcm-build.json"
          python3 - "$RUNNER_TEMP/dfcm-build.json" "$RUNNER_TEMP/dfcm-binary.txt" <<'PY'
          import json, sys
          source, out = sys.argv[1:]
          executable = None
          with open(source) as f:
              for line in f:
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  target = event.get("target", {})
                  if (event.get("reason") == "compiler-artifact"
                      and target.get("name") == "dfcm_crown_suite"
                      and event.get("executable")):
                      executable = event["executable"]
          if not executable:
              raise SystemExit("REFUSED[DFCM_EXECUTABLE_NOT_FOUND]")
          with open(out, "w") as f:
              f.write(executable + "\n")
          PY
          dfcm_binary="$(cat "$RUNNER_TEMP/dfcm-binary.txt")"
          test -x "$dfcm_binary"
          "$dfcm_binary" --exact dfcm_crown_suite_completes_under_5_seconds --nocapture
          printf 'binary=%s\n' "$dfcm_binary" >> "$GITHUB_OUTPUT"

      - name: Manufacture connector-bounded capsules
        shell: bash
        env:
          DFCM_TEST_BINARY: ${{ steps.dfcm.outputs.binary }}
          GGEN_BINARY: ${{ github.workspace }}/target/debug/ggen
        run: |
          set -euo pipefail
          bash scripts/ci/manufacture-ggen-cloud-environment.sh \
            "$RUNNER_TEMP/ggen-cloud-capsule"

      - name: Replay runtime transport boundary
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ggen-cloud-capsule"
          cd "$root"
          sha256sum -c ggen-cloud-runtime.tar.gz.sha256
          rm -rf replay
          mkdir replay
          tar -xzf ggen-cloud-runtime.tar.gz -C replay
          replay/ggen-cloud-runtime/verify.sh

      - name: Replay exact source closure
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ggen-cloud-capsule"
          runtime="$root/replay/ggen-cloud-runtime"
          cd "$root"
          for repo in ggen-marketplace ggen-legacy ggen-create ggen-mcp ggen-spec-kit; do
            sha256sum -c "ggen-source-$repo.tar.gz.sha256"
            tar -xzf "ggen-source-$repo.tar.gz" -C "$runtime/workspace"
          done
          "$runtime/verify-closure.sh"
          cmp environment.json "$runtime/receipts/environment.json"

      - name: Upload ggen runtime capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ggen-cloud-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ggen-cloud-capsule/ggen-cloud-runtime.tar.gz
            ${{ runner.temp }}/ggen-cloud-capsule/ggen-cloud-runtime.tar.gz.sha256
            ${{ runner.temp }}/ggen-cloud-capsule/environment.json
            ${{ runner.temp }}/ggen-cloud-capsule/transport-index.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ggen-marketplace source capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ggen-source-ggen-marketplace-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ggen-cloud-capsule/ggen-source-ggen-marketplace.tar.gz
            ${{ runner.temp }}/ggen-cloud-capsule/ggen-source-ggen-marketplace.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ggen-legacy source capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ggen-source-ggen-legacy-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ggen-cloud-capsule/ggen-source-ggen-legacy.tar.gz
            ${{ runner.temp }}/ggen-cloud-capsule/ggen-source-ggen-legacy.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ggen-create source capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ggen-source-ggen-create-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ggen-cloud-capsule/ggen-source-ggen-create.tar.gz
            ${{ runner.temp }}/ggen-cloud-capsule/ggen-source-ggen-create.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ggen-mcp source capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ggen-source-ggen-mcp-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ggen-cloud-capsule/ggen-source-ggen-mcp.tar.gz
            ${{ runner.temp }}/ggen-cloud-capsule/ggen-source-ggen-mcp.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ggen-spec-kit source capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ggen-source-ggen-spec-kit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ggen-cloud-capsule/ggen-source-ggen-spec-kit.tar.gz
            ${{ runner.temp }}/ggen-cloud-capsule/ggen-source-ggen-spec-kit.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
