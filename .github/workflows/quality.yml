# Legacy manual replay. Pull-request quality authority moved into ci.yml and is
# now routed by scripts/ci/errc_router.py to avoid duplicate cold builds.
name: Quality Deep Replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-deep-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact selected ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ggen-build
        with:
          components: rustfmt,clippy
          cache-key-suffix: quality-manual-replay
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1
        with:
          tool: cargo-audit
      - name: Replay retained quality evidence
        shell: bash
        run: |
          set -euo pipefail
          just fmt-check
          ./scripts/ci/guard-process-intelligence-boundary.sh
          cargo clippy --workspace --all-targets --exclude ggen-lsp
          cargo audit
          just guard-publish-target
          just slo-check
