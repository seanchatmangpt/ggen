name: Temporary ggen v26.8.1 source removal

on:
  push:
    branches: [agent/migrate-v26-8-1-corpus-to-ggen-legacy]
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: remove-ggen-v26-8-1-corpus
  cancel-in-progress: true

env:
  SOURCE_BASE: 8351af4c5bbbf60bd99ab8417752a1762c6ea4e3
  CORPUS_REF: 70e599a599fedb7c62c965377cc2f80df1fa01ec
  CORPUS_CHECKPOINT: 07928bde9d9eaba2e2e2fd8f78fcdc3f7b0b63ff
  RUSTC_WRAPPER: ""
  SCCACHE_GHA_ENABLED: "false"
  CARGO_INCREMENTAL: "0"

jobs:
  manufacture:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'receipt v26.8.1 source removal')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout source candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/migrate-v26-8-1-corpus-to-ggen-legacy
          fetch-depth: 0

      - name: Checkout exact source baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/ggen
          ref: ${{ env.SOURCE_BASE }}
          path: .baseline-ggen
          fetch-depth: 0

      - name: Checkout merged destination authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/ggen-legacy
          ref: ${{ env.CORPUS_REF }}
          path: .corpus
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt

      - name: Install just
        uses: taiki-e/install-action@81ecf985428d5c2ea81dbf079bceca32bc9604ab
        with:
          tool: just

      - name: Install verifier dependencies
        run: python3 -m pip install --disable-pip-version-check blake3==1.0.9 jsonschema==4.26.0 pyshacl==0.40.0

      - name: Bind deterministic verifier policy and remove constructor capability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/v26_8_1_source_removal.py')
          text = path.read_text()
          old_scanner = '''def scan_operational_references() -> list[str]:
              forbidden = [str(path) for path in ACTIVE_ROOTS] + [str(source) for source, _ in GUARD_MOVES]
              roots = [Path("justfile"), Path(".github/workflows"), Path("crates"), Path("tools/architecture-foundry")]
              findings: list[str] = []
              for root in roots:
                  candidates = [root] if root.is_file() else root.rglob("*") if root.exists() else []
                  for path in candidates:
                      if not path.is_file() or "target" in path.parts:
                          continue
                      try:
                          text = path.read_text()
                      except (UnicodeDecodeError, OSError):
                          continue
                      for token in forbidden:
                          if token in text:
                              findings.append(f"{path}:{token}")
              return sorted(findings)
          '''
          new_scanner = '''HISTORICAL_EVIDENCE_LINES: dict[Path, set[str]] = {
              Path("tools/architecture-foundry/src/bin/admit_observation.rs"): {
                  'const CAPABILITY_PATH: &str = "ontology/v26.8.1/legacy-capabilities.ttl";',
                  'const REPORT_PATH: &str = "docs/v26.8.1/90-legacy/observer-class-report.md";',
              },
          }


          def scan_operational_references() -> list[str]:
              forbidden = [str(path) for path in ACTIVE_ROOTS] + [
                  str(source) for source, _ in GUARD_MOVES
              ]
              roots = [
                  Path("justfile"),
                  Path(".github/workflows"),
                  Path("crates"),
                  Path("tools/architecture-foundry"),
              ]
              findings: list[str] = []
              for root in roots:
                  candidates = (
                      [root]
                      if root.is_file()
                      else root.rglob("*")
                      if root.exists()
                      else []
                  )
                  for candidate in candidates:
                      if not candidate.is_file() or "target" in candidate.parts:
                          continue
                      try:
                          lines = candidate.read_text().splitlines()
                      except (UnicodeDecodeError, OSError):
                          continue
                      admitted = HISTORICAL_EVIDENCE_LINES.get(candidate, set())
                      for line_number, line in enumerate(lines, start=1):
                          stripped = line.lstrip()
                          if candidate == Path("justfile") and stripped.startswith("#"):
                              continue
                          if candidate.suffix == ".rs" and stripped.startswith("//"):
                              continue
                          if line.strip() in admitted:
                              continue
                          for token in forbidden:
                              if token in line:
                                  findings.append(
                                      f"{candidate}:{line_number}:{token}"
                                  )
              return sorted(findings)
          '''
          if text.count(old_scanner) != 1:
              raise SystemExit('REFERENCE_POLICY_PATCH_PRECONDITION_REFUSED')
          text = text.replace(old_scanner, new_scanner)

          old_commands = '        "commands": commands,\n'
          new_commands = '        "commands": sorted(commands, key=lambda record: tuple(record["argv"])),\n'
          if text.count(old_commands) != 1:
              raise SystemExit('COMMAND_CANONICALIZATION_PATCH_PRECONDITION_REFUSED')
          text = text.replace(old_commands, new_commands)

          old_rsync = '''        require_success(rsync, "COMPOSED_TREE_PROJECTION_REFUSED")
              commands.append(rsync)
          '''
          new_rsync = '''        require_success(rsync, "COMPOSED_TREE_PROJECTION_REFUSED")
              rsync["argv"][-1] = "<COMPOSED_SOURCE>/"
              commands.append(rsync)
          '''
          if text.count(old_rsync) != 1:
              raise SystemExit('COMPOSED_PATH_NORMALIZATION_PATCH_PRECONDITION_REFUSED')
          path.write_text(text.replace(old_rsync, new_rsync))
          PY
          git rm .github/workflows/temporary-v26-8-1-source-removal.yml

      - name: Compile constructor and admit destination
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/v26_8_1_source_removal.py
          python3 scripts/ci/v26_8_1_source_removal.py admit-destination \
            --source-baseline .baseline-ggen \
            --corpus .corpus \
            --source-base "$SOURCE_BASE" \
            --corpus-checkpoint "$CORPUS_CHECKPOINT" \
            --corpus-ref "$CORPUS_REF"

      - name: Construct bounded source removal
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/v26_8_1_source_removal.py construct \
            --corpus .corpus \
            --source-base "$SOURCE_BASE" \
            --corpus-ref "$CORPUS_REF" \
            --plan evidence/ggen-v26.8.1-source-removal-plan.json

      - name: Commit removal checkpoint
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          printf '/.baseline-ggen\n/.corpus\n' >> .git/info/exclude
          git config user.name 'ggen migration agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git ls-files --stage .baseline-ggen .corpus | grep -q .; then
            echo 'CHECKOUT_STAGED_REFUSED' >&2
            exit 3
          fi
          git commit -m 'refactor(corpus): remove migrated v26.8.1 enterprise corpus'
          echo "subject=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Execute exact replay verification
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT='${{ steps.checkpoint.outputs.subject }}'
          python3 scripts/ci/v26_8_1_source_removal.py verify \
            --corpus .corpus \
            --source-base "$SOURCE_BASE" \
            --corpus-ref "$CORPUS_REF" \
            --subject-commit "$SUBJECT" \
            --plan evidence/ggen-v26.8.1-source-removal-plan.json \
            --report /tmp/source-removal-a.json
          python3 scripts/ci/v26_8_1_source_removal.py verify \
            --corpus .corpus \
            --source-base "$SOURCE_BASE" \
            --corpus-ref "$CORPUS_REF" \
            --subject-commit "$SUBJECT" \
            --plan evidence/ggen-v26.8.1-source-removal-plan.json \
            --report /tmp/source-removal-b.json
          python3 - <<'PY'
          import json

          left = json.loads(open('/tmp/source-removal-a.json').read())
          right = json.loads(open('/tmp/source-removal-b.json').read())

          def first_difference(a, b, path='$'):
              if type(a) is not type(b):
                  return path, a, b
              if isinstance(a, dict):
                  if set(a) != set(b):
                      return path + '.keys', sorted(a), sorted(b)
                  for key in sorted(a):
                      found = first_difference(a[key], b[key], f'{path}.{key}')
                      if found:
                          return found
                  return None
              if isinstance(a, list):
                  if len(a) != len(b):
                      return path + '.length', len(a), len(b)
                  for index, (av, bv) in enumerate(zip(a, b)):
                      found = first_difference(av, bv, f'{path}[{index}]')
                      if found:
                          return found
                  return None
              if a != b:
                  return path, a, b
              return None

          difference = first_difference(left, right)
          if difference:
              path, a, b = difference
              print('REPLAY_FIRST_DIFFERENCE ' + json.dumps({
                  'path': path,
                  'a': a,
                  'b': b,
              }, sort_keys=True))
          else:
              print('REPLAY_STRUCTURAL_MATCH')
          PY
          cmp /tmp/source-removal-a.json /tmp/source-removal-b.json

      - name: Manufacture receipt and publish branch
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT='${{ steps.checkpoint.outputs.subject }}'
          python3 scripts/ci/v26_8_1_source_removal.py receipt \
            --corpus .corpus \
            --source-base "$SOURCE_BASE" \
            --corpus-ref "$CORPUS_REF" \
            --corpus-checkpoint "$CORPUS_CHECKPOINT" \
            --subject-commit "$SUBJECT" \
            --plan evidence/ggen-v26.8.1-source-removal-plan.json \
            --report-a /tmp/source-removal-a.json \
            --report-b /tmp/source-removal-b.json \
            --output evidence/ggen-v26.8.1-source-removal-receipt.json
          git add evidence/ggen-v26.8.1-source-removal-receipt.json
          git commit -m 'chore(corpus): receipt v26.8.1 source removal'
          git push origin HEAD:agent/migrate-v26-8-1-corpus-to-ggen-legacy
