name: Fortune 5 BBlock

on:
  pull_request:
    paths:
      - 'crates/ggen-cli/src/cmds/bblock.rs'
      - 'crates/ggen-cli/src/cmds/mod.rs'
      - 'packs/fortune5-deployment-blocks-pack/**'
      - 'packs/fortune5-testing-bblock-pack/**'
      - '.github/workflows/fortune5-bblock.yml'
      - '.github/workflows/testing-bblock.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fortune5-bblock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog-cli-and-replay:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Provision repository toolchain
        uses: ./.github/actions/setup-ggen-build

      - name: Independently prove ontology and retained catalog equivalence
        run: |
          python3 -m pip install --disable-pip-version-check rdflib==7.1.4
          python3 - <<'PY'
          import json
          from pathlib import Path
          from rdflib import Graph, Namespace, RDF, Literal
          from rdflib.plugins.sparql import prepareQuery

          root = Path('packs/fortune5-deployment-blocks-pack')
          catalog = json.loads((root / 'catalog/fortune5-bblocks.json').read_text())
          graph = Graph()
          graph.parse(root / 'ontology.ttl', format='turtle')
          BB = Namespace('http://seanchatmangpt.github.io/packs/fortune5-bblock#')
          EX = Namespace('https://ggen.io/fortune5/bblocks/')

          assert catalog['schema'] == 'ggen.bblock.catalog.v1'
          assert catalog['version'] == str(graph.value(EX.catalog, BB.catalogVersion))
          assert graph.value(EX.catalog, BB.directActuation) == Literal(False)

          providers = {}
          for subject in graph.subjects(RDF.type, BB.Provider):
              provider_id = str(graph.value(subject, BB.providerId))
              providers[provider_id] = {
                  'id': provider_id,
                  'title': str(graph.value(subject, BB.title)),
                  'aliases': sorted(str(value) for value in graph.objects(subject, BB.alias)),
              }
          expected_providers = {item['id']: {**item, 'aliases': sorted(item['aliases'])} for item in catalog['providers']}
          assert providers == expected_providers
          assert set(providers) == {'aws', 'azure', 'gcp'}

          groups = {}
          for subject in graph.subjects(RDF.type, BB.BlockGroup):
              group_id = str(graph.value(subject, BB.groupId))
              groups[group_id] = {
                  'id': group_id,
                  'title': str(graph.value(subject, BB.title)),
                  'description': str(graph.value(subject, BB.description)),
                  'directory': str(graph.value(subject, BB.outputDirectory)),
                  'dependencies': sorted(str(graph.value(dep, BB.groupId)) for dep in graph.objects(subject, BB.dependsOn)),
                  'common_packs': sorted(str(value) for value in graph.objects(subject, BB.commonPack)),
                  'provider_packs': {
                      'aws': sorted(str(value) for value in graph.objects(subject, BB.awsPack)),
                      'azure': sorted(str(value) for value in graph.objects(subject, BB.azurePack)),
                      'gcp': sorted(str(value) for value in graph.objects(subject, BB.gcpPack)),
                  },
              }
          expected_groups = {
              item['id']: {
                  **item,
                  'dependencies': sorted(item['dependencies']),
                  'common_packs': sorted(item['common_packs']),
                  'provider_packs': {provider: sorted(packs) for provider, packs in item['provider_packs'].items()},
              }
              for item in catalog['groups']
          }
          assert groups == expected_groups
          assert len(groups) == 19
          assert groups['testing']['common_packs'] == ['fortune5-testing-bblock-pack']
          assert 'testing' in groups['fortune5-platform']['dependencies']
          assert 'testing' in groups['fortune5-control-plane']['dependencies']
          assert all(all(item['provider_packs'][p] for p in ('aws', 'azure', 'gcp')) for item in groups.values())

          gates = sorted((root / 'gates').glob('*.rq'))
          assert len(gates) >= 2
          for path in gates:
              prepareQuery(path.read_text())
              rows = list(graph.query(path.read_text()))
              assert not rows, (path.name, rows)

          direct = Graph()
          for triple in graph:
              direct.add(triple)
          direct.set((EX.catalog, BB.directActuation, Literal(True)))
          assert list(direct.query((root / 'gates/020_safe_acyclic_broker_only.rq').read_text()))

          cycle = Graph()
          for triple in graph:
              cycle.add(triple)
          cycle.add((EX['global-network'], BB.dependsOn, EX['fortune5-complete']))
          assert list(cycle.query((root / 'gates/020_safe_acyclic_broker_only.rq').read_text()))

          print(f"BBLOCK_LAW providers={len(providers)} groups={len(groups)} triples={len(graph)} gates={len(gates)}")
          PY

      - name: Enforce formatting and compile the bblock noun
        run: |
          cargo fmt --manifest-path Cargo.toml --package ggen-cli-lib -- --check
          cargo check -p ggen-cli-lib --lib
          cargo test -p ggen-cli-lib bblock --lib

      - name: Build the real ggen binary
        run: cargo build -p ggen-cli-lib --bin ggen

      - name: Exercise public noun-verb commands
        run: |
          GGEN="$PWD/target/debug/ggen"
          "$GGEN" bblock validate > /tmp/bblock-validate.json
          "$GGEN" bblock providers > /tmp/bblock-providers.json
          "$GGEN" bblock list > /tmp/bblock-list.json
          "$GGEN" bblock inspect testing gpc > /tmp/bblock-testing-gpc.json
          "$GGEN" bblock inspect fortune5-complete gpc > /tmp/bblock-inspect-gpc.json
          test "$(jq -r '.status' /tmp/bblock-validate.json)" = "ALIVE"
          test "$(jq '.providers' /tmp/bblock-validate.json)" = "3"
          test "$(jq '.groups' /tmp/bblock-validate.json)" = "19"
          test "$(jq -r '.provider' /tmp/bblock-testing-gpc.json)" = "gcp"
          test "$(jq -r '.requested_group' /tmp/bblock-testing-gpc.json)" = "testing"
          test "$(jq '[.packs[] | select(. == "fortune5-testing-bblock-pack")] | length' /tmp/bblock-testing-gpc.json)" = "1"
          test "$(jq -r '.provider' /tmp/bblock-inspect-gpc.json)" = "gcp"
          test "$(jq '.resolved_groups | index("testing") != null' /tmp/bblock-inspect-gpc.json)" = "true"
          test "$(jq '[.packs[] | select(startswith("gcp-"))] | length > 0' /tmp/bblock-inspect-gpc.json)" = "true"

      - name: Manufacture plan, directories, lockfile, and receipt chain
        run: |
          GGEN="$PWD/target/debug/ggen"
          ROOT="$(mktemp -d)"
          cd "$ROOT"
          "$GGEN" bblock plan fortune5-complete aws > /tmp/bblock-plan-first.json
          cp .ggen/bblocks/plans/aws/fortune5-complete.json /tmp/bblock-plan-bytes-first.json
          "$GGEN" bblock plan fortune5-complete aws > /tmp/bblock-plan-second.json
          cmp /tmp/bblock-plan-bytes-first.json .ggen/bblocks/plans/aws/fortune5-complete.json
          test -s .ggen/bblocks/receipts/aws/fortune5-complete-plan-intent.json
          test -s .ggen/bblocks/receipts/aws/fortune5-complete-plan-result.json

          "$GGEN" bblock enable fortune5-complete aws > /tmp/bblock-enable.json
          test -s .ggen/packs.lock
          test -s .ggen/bblocks/groups/fortune5-complete.json
          test -s .ggen/bblocks/receipts/aws/fortune5-complete-enable-intent.json
          test -s .ggen/bblocks/receipts/aws/fortune5-complete-enable-result.json
          test -d infrastructure/network
          test -d infrastructure/security/kms
          test -d infrastructure/testing
          test -d infrastructure/control-plane
          test -d infrastructure/fortune5
          test "$(jq '.packs | length > 70' /tmp/bblock-enable.json)" = "true"

      - name: Refuse unknown providers and direct cloud actuation imports
        run: |
          set +e
          target/debug/ggen bblock inspect testing oracle >/tmp/bblock-oracle.out 2>/tmp/bblock-oracle.err
          code=$?
          set -e
          test "$code" -ne 0
          ! grep -RInE 'reqwest|std::net|Command::new|terraform|pulumi|kubectl|aws_sdk|azure_|google_cloud' crates/ggen-cli/src/cmds/bblock.rs

  # Separate job (own pass/fail signal) from catalog-cli-and-replay above.
  # catalog-cli-and-replay never `cd`s into a project with a `[packs]` table
  # wiring `fortune5-deployment-blocks-pack` -- every `ggen bblock <verb>` in
  # that job runs either at the repo root (no `[packs]` table at all) or in a
  # bare `mktemp -d` scratch dir with no `ggen.toml`, so it only ever proves
  # the embedded-catalog fallback path (`CATALOG_BYTES` baked into the binary
  # via `include_str!`). It does not touch the separate `wired_catalog_bytes`/
  # `load_catalog` code path in crates/ggen-cli/src/cmds/bblock.rs that reads
  # a *consuming project's* `[packs]`-wired pack instead -- defect 2 from
  # docs/jira/v26.9.1/07-FORTUNE5-DEPLOYMENT-BLOCKS-NOT-SYNC-PORTABLE.md, and
  # the fix this job actually exercises end-to-end through the real binary.
  wired-catalog-cli-coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Provision repository toolchain
        uses: ./.github/actions/setup-ggen-build

      - name: Build the real ggen binary
        run: cargo build -p ggen-cli-lib --bin ggen

      # This is the step that must be capable of failing: pre-fix `ggen
      # bblock` reads only `CATALOG_BYTES` (embedded via `include_str!` from
      # this exact repo's own packs/fortune5-deployment-blocks-pack/catalog/
      # fortune5-bblocks.json) and ignores `[packs]` entirely, so every
      # scenario below would collapse to the SAME embedded digest under the
      # old code. Three real scratch consumer projects, none sharing this
      # checkout's ggen.toml:
      #   wired-real  -- [packs] wires this repo's own, UNMODIFIED
      #                  fortune5-deployment-blocks-pack by absolute path
      #                  (same [packs.fortune5-deployment-blocks] shape
      #                  proven in docs/jira/v26.9.1/07-... 's own evidence
      #                  trail and in bblock.rs's own
      #                  wired_project_pack_catalog_overrides_embedded_catalog
      #                  unit test). Because CATALOG_BYTES is include_str! of
      #                  this exact file, its digest is expected to equal the
      #                  embedded one either way -- this scenario alone
      #                  cannot distinguish "genuinely read from the wired
      #                  path" from "fell back to embedded", so it is
      #                  cross-checked against an independently-computed
      #                  digest of the real file rather than treated as the
      #                  falsifier.
      #   wired-fork  -- [packs] wires a COPY of the pack whose
      #                  catalog/fortune5-bblocks.json content is
      #                  deliberately mutated (distinct version, one group
      #                  that exists nowhere in the embedded fixture). THIS
      #                  is the falsifier: only the project-wiring fix can
      #                  make `ggen bblock list` return this content instead
      #                  of the embedded one.
      #   nopacks     -- bare ggen.toml, no [packs] table at all (matches
      #                  docs/jira/v26.9.1/07-... 's own ~/nopacks-check-home
      #                  scratch project) -- proves backward compatibility:
      #                  still resolves to the embedded catalog.
      - name: Prove [packs]-wired catalog resolution overrides the embedded fixture
        run: |
          set -euo pipefail
          GGEN="$PWD/target/debug/ggen"
          python3 -m pip install --disable-pip-version-check --break-system-packages blake3==1.0.8

          REAL_CATALOG="$PWD/packs/fortune5-deployment-blocks-pack/catalog/fortune5-bblocks.json"
          REAL_PACK_DIR="$PWD/packs/fortune5-deployment-blocks-pack"
          WORK="$(mktemp -d)"

          WIRED_REAL="$WORK/wired-real"
          mkdir -p "$WIRED_REAL"
          cat > "$WIRED_REAL/ggen.toml" <<TOML
          [project]
          name = "ci06-wired-real"

          [ontology]
          source = "ontology.ttl"

          [templates]
          dir = "templates"

          [packs.fortune5-deployment-blocks]
          path = "$REAL_PACK_DIR"
          TOML

          FORK_PACK_DIR="$WORK/forked-pack"
          mkdir -p "$FORK_PACK_DIR/catalog"
          cat > "$FORK_PACK_DIR/catalog/fortune5-bblocks.json" <<'JSON'
          {
            "schema": "ggen.bblock.catalog.v1",
            "version": "ci06-fork-test-1.0.0",
            "providers": [
              {"id": "aws", "title": "Amazon Web Services", "aliases": []},
              {"id": "azure", "title": "Microsoft Azure", "aliases": []},
              {"id": "gcp", "title": "Google Cloud Platform", "aliases": ["gpc"]}
            ],
            "groups": [
              {
                "id": "ci06-wired-only-group",
                "title": "CI-06 Wired-Only Test Group",
                "description": "Exists only in the CI-06 forked catalog, never in the embedded fixture.",
                "directory": "infra/ci06-wired-only",
                "dependencies": [],
                "common_packs": [],
                "provider_packs": {
                  "aws": ["aws-ci06-wired-test-pack"],
                  "azure": ["azure-ci06-wired-test-pack"],
                  "gcp": ["gcp-ci06-wired-test-pack"]
                }
              }
            ]
          }
          JSON

          WIRED_FORK="$WORK/wired-fork"
          mkdir -p "$WIRED_FORK"
          cat > "$WIRED_FORK/ggen.toml" <<TOML
          [project]
          name = "ci06-wired-fork"

          [ontology]
          source = "ontology.ttl"

          [templates]
          dir = "templates"

          [packs.fortune5-deployment-blocks]
          path = "$FORK_PACK_DIR"
          TOML

          NOPACKS="$WORK/nopacks"
          mkdir -p "$NOPACKS"
          cat > "$NOPACKS/ggen.toml" <<'TOML'
          [project]
          name = "ci06-nopacks"

          [ontology]
          source = "ontology.ttl"

          [templates]
          dir = "templates"
          TOML

          # Ground truth computed fresh, this run, directly from the files
          # just written -- never a hardcoded digest string.
          REAL_DIGEST="$(python3 -c "import blake3,sys; print(blake3.blake3(open(sys.argv[1],'rb').read()).hexdigest())" "$REAL_CATALOG")"
          FORK_DIGEST="$(python3 -c "import blake3,sys; print(blake3.blake3(open(sys.argv[1],'rb').read()).hexdigest())" "$FORK_PACK_DIR/catalog/fortune5-bblocks.json")"
          echo "real digest (independently computed): $REAL_DIGEST"
          echo "fork digest (independently computed): $FORK_DIGEST"
          test "$REAL_DIGEST" != "$FORK_DIGEST"

          (cd "$WIRED_REAL" && "$GGEN" bblock list) > "$WORK/wired-real.json"
          (cd "$WIRED_FORK" && "$GGEN" bblock list) > "$WORK/wired-fork.json"
          (cd "$NOPACKS" && "$GGEN" bblock list) > "$WORK/nopacks.json"

          WIRED_REAL_DIGEST="$(jq -r '.catalog_digest' "$WORK/wired-real.json")"
          WIRED_FORK_DIGEST="$(jq -r '.catalog_digest' "$WORK/wired-fork.json")"
          NOPACKS_DIGEST="$(jq -r '.catalog_digest' "$WORK/nopacks.json")"
          WIRED_FORK_VERSION="$(jq -r '.version' "$WORK/wired-fork.json")"

          echo "wired-real catalog_digest=$WIRED_REAL_DIGEST"
          echo "wired-fork catalog_digest=$WIRED_FORK_DIGEST"
          echo "nopacks    catalog_digest=$NOPACKS_DIGEST"

          # wired-real: the CLI's output is genuinely sourced from this
          # repo's own real pack file, not some other stale content.
          test "$WIRED_REAL_DIGEST" = "$REAL_DIGEST"

          # nopacks (backward compat): unchanged from before the fix.
          test "$NOPACKS_DIGEST" = "$REAL_DIGEST"

          # wired-fork (the falsifier): only resolves correctly when
          # `ggen bblock` actually reads the project's [packs]-wired pack
          # instead of always falling back to the embedded fixture.
          test "$WIRED_FORK_DIGEST" = "$FORK_DIGEST"
          test "$WIRED_FORK_DIGEST" != "$REAL_DIGEST"
          test "$WIRED_FORK_VERSION" = "ci06-fork-test-1.0.0"
          test "$(jq '[.groups[] | select(.id == "ci06-wired-only-group")] | length' "$WORK/wired-fork.json")" = "1"
          test "$(jq '[.groups[] | select(.id == "fortune5-complete")] | length' "$WORK/wired-fork.json")" = "0"

          echo "PROOF: ggen bblock list resolves [packs]-wired fortune5-deployment-blocks-pack catalogs, distinct from the embedded fixture, with real/nopacks/fork digests independently verified."
