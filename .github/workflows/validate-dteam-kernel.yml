name: validate-dteam-kernel

# Checks out an EXTERNAL repo (seanchatmangpt/dteam) at a pinned commit SHA and
# tests that frozen snapshot -- it validates nothing in this repo's own tree, so
# its result is identical regardless of what a ggen PR changes. Previously ran
# on every single ggen pull_request (no path filter possible, since no path in
# THIS repo is relevant); narrowed to manual dispatch only (2026-08-03, CI
# minimalism pass) so it no longer contributes to ggen PR-triggered congestion.
# Re-run manually when the pinned dteam SHA below is deliberately bumped.
on:
  workflow_dispatch:

concurrency:
  group: validate-dteam-kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out exact dteam head
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/dteam
          ref: 796537d3cdcee9e341c1b1ca78a1d8a73560cc8b
          path: dteam
          persist-credentials: false
      - name: Compile and test standalone capability kernel
        run: cargo test --manifest-path dteam/capabilities/dteam-kernel/Cargo.toml --all-targets
      - name: Execute capability demonstration
        run: |
          mkdir -p artifacts
          cargo run --quiet --manifest-path dteam/capabilities/dteam-kernel/Cargo.toml --bin dteam-capabilities > artifacts/dteam-capability-demo.json
          cat artifacts/dteam-capability-demo.json
      - name: Upload execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: dteam-capability-kernel-796537d
          path: artifacts/dteam-capability-demo.json
          if-no-files-found: error
