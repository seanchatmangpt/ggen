name: CELL4 GGEN Ecosystem OCEL Receipt

on:
  pull_request:
    paths:
      - "crates/ggen-engine/tests/ggen_ecosystem_ocel_cell4_run.rs"
      - ".github/workflows/cell4-ggen-ecosystem-ocel.yml"
      - "packs/ggen-ecosystem-ocel-pack/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manufacture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Admit exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            printf 'REFUSED_INEXACT_SUBJECT expected=%s actual=%s\n' "$expected" "$actual" >&2
            exit 70
          }

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly-2026-06-22

      - name: Execute real GGEN OCEL manufacture twice with digest binding
        env:
          CELL4_OCEL_OUT_DIR: ${{ github.workspace }}/target/cell4-ocel
        run: cargo test -p ggen-engine --test ggen_ecosystem_ocel_cell4_run -- --nocapture

      - name: Verify emitted Project2 request and digest
        shell: bash
        run: |
          set -euo pipefail
          test -s target/cell4-ocel/ggen-ecosystem-ocel.json
          test -s target/cell4-ocel/project2-ggen-ecosystem-ocel-request.json
          digest="$(sha256sum target/cell4-ocel/ggen-ecosystem-ocel.json | awk '{print "sha256:" $1}')"
          test "$(cat target/cell4-ocel/ocel.sha256)" = "$digest"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('target/cell4-ocel')
          req = json.loads((root / 'project2-ggen-ecosystem-ocel-request.json').read_text())
          digest = (root / 'ocel.sha256').read_text().strip()
          assert req['operation'] == 'memory.upsert'
          assert req['payload']['record']['key'] == 'ggen/ecosystem/ocel/current'
          assert req['payload']['record']['metadata']['ocel_digest'] == digest
          assert req['payload']['record']['metadata']['process_analysis_owner'] == 'wasm4pm'
          ocel = json.loads((root / 'ggen-ecosystem-ocel.json').read_text())
          assert len(ocel['objects']) >= 5
          assert len(ocel['events']) >= 7
          print(f'OCEL_DIGEST={digest}')
          PY
          echo 'PROJECT2_REQUEST_BEGIN'
          cat target/cell4-ocel/project2-ggen-ecosystem-ocel-request.json
          echo
          echo 'PROJECT2_REQUEST_END'

      - name: Upload generated OCEL and canonical Project2 request
        uses: actions/upload-artifact@v4
        with:
          name: cell4-ggen-ecosystem-ocel-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/cell4-ocel/
          if-no-files-found: error
          retention-days: 14
