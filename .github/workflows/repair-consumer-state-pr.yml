name: Repair Consumer State

on:
  pull_request:
    paths:
      - '.github/workflows/repair-consumer-state-pr.yml'
      - 'scripts/ci/repair-consumer-state.sh'
      - 'crates/ggen-engine/src/generation_rules.rs'
      - 'crates/ggen-engine/tests/generation_output_dir_e2e.rs'
      - 'examples/crown-conjecture-verify/**'
      - 'examples/tpot2-wasm4pm-autoconfig/**'
      - 'examples/tcps-generated/**'

permissions:
  contents: write

concurrency:
  group: repair-consumer-state-${{ github.head_ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  repair:
    name: Reconcile three current consumers
    if: github.head_ref == 'agent/chicago-gap-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: agent/chicago-gap-closure
          show-progress: false

      - name: Provision siblings and pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: phase2

      - name: Install independent RDF parser
        run: python3 -m pip install --disable-pip-version-check --quiet 'rdflib==7.1.4'

      - name: Repair generation output-root authority
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine = Path('crates/ggen-engine/src/generation_rules.rs')
          text = engine.read_text(encoding='utf-8')
          helper_marker = '/// Run every `[[generation.rules]]` entry in `manifest` against a fresh\n'
          helper = '''fn scoped_output_file(output_dir: &Path, output_file: &str) -> String {
              if output_dir.as_os_str().is_empty() || output_dir == Path::new(".") {
                  return output_file.to_owned();
              }
              output_dir
                  .join(output_file)
                  .to_string_lossy()
                  .replace('\\\\', "/")
          }

          '''
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines()) + '\n'
          if text.count(helper_marker) != 1:
              raise SystemExit(f'REFUSED helper insertion marker: {text.count(helper_marker)}')
          if 'fn scoped_output_file(' in text:
              raise SystemExit('REFUSED scoped_output_file already exists')
          text = text.replace(helper_marker, helper + helper_marker)

          loop = '    for rule in &manifest.generation.rules {\n'
          loop_replacement = loop + '''        let output_file = scoped_output_file(
                      &manifest.generation.output_dir,
                      &rule.output_file,
                  );
          '''
          loop_replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in loop_replacement.splitlines()
          ) + '\n'
          if text.count(loop) != 1:
              raise SystemExit(f'REFUSED generation loop marker: {text.count(loop)}')
          text = text.replace(loop, loop_replacement)

          replacements = {
              'decisions.insert(rule.output_file.clone(), format!("skipped: {reason}"));':
                  'decisions.insert(output_file.clone(), format!("skipped: {reason}"));',
              'skipped.push((PathBuf::from(&rule.output_file), reason));':
                  'skipped.push((PathBuf::from(&output_file), reason));',
              'let per_row = rule.output_file.contains("{{");':
                  'let per_row = output_file.contains("{{");',
              '                    &rule.output_file,\n':
                  '                    &output_file,\n',
              '            validate_rendered_body(&rule.name, &rule.output_file, &body)?;':
                  '            validate_rendered_body(&rule.name, &output_file, &body)?;',
              '                to: rule.output_file.clone(),':
                  '                to: output_file.clone(),',
          }
          expected_counts = {
              'decisions.insert(rule.output_file.clone(), format!("skipped: {reason}"));': 2,
              'skipped.push((PathBuf::from(&rule.output_file), reason));': 2,
              'let per_row = rule.output_file.contains("{{");': 1,
              '                    &rule.output_file,\n': 1,
              '            validate_rendered_body(&rule.name, &rule.output_file, &body)?;': 1,
              '                to: rule.output_file.clone(),': 1,
          }
          for old, new in replacements.items():
              observed = text.count(old)
              expected = expected_counts[old]
              if observed != expected:
                  raise SystemExit(f'REFUSED engine replacement {old!r}: expected={expected} observed={observed}')
              text = text.replace(old, new)
          engine.write_text(text, encoding='utf-8', newline='')
          print('REPAIRED GenerationConfig.output_dir actuation')
          PY

      - name: Prove generation output-root regression
        run: |
          set -o pipefail
          {
            rustfmt --edition 2021 \
              crates/ggen-engine/src/generation_rules.rs \
              crates/ggen-engine/tests/generation_output_dir_e2e.rs
            rustfmt --edition 2021 --check \
              crates/ggen-engine/src/generation_rules.rs \
              crates/ggen-engine/tests/generation_output_dir_e2e.rs
            cargo test -p ggen-engine --test generation_output_dir_e2e
          } 2>&1 | tee generation-output-dir-regression.log

      - name: Build real ggen CLI
        run: cargo build --quiet -p ggen-cli-lib --bin ggen

      - name: Execute bounded consumer reconciliation
        run: |
          set -o pipefail
          bash scripts/ci/repair-consumer-state.sh 2>&1 | tee consumer-repair.log

      - name: Upload repair refusal evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consumer-repair-failure-${{ github.sha }}
          path: |
            generation-output-dir-regression.log
            consumer-repair.log
            /tmp/tcps-relock.log
            /tmp/tcps-fmt.log
            /tmp/tcps-clippy.log
          if-no-files-found: warn
