name: Repair Consumer State

on:
  pull_request:
    paths:
      - '.github/workflows/repair-consumer-state-pr.yml'
      - 'scripts/ci/repair-consumer-state.sh'
      - 'examples/crown-conjecture-verify/**'
      - 'examples/tpot2-wasm4pm-autoconfig/**'
      - 'examples/tcps-generated/**'

permissions:
  contents: write

concurrency:
  group: repair-consumer-state-${{ github.head_ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  repair:
    name: Reconcile three current consumers
    if: github.head_ref == 'agent/chicago-gap-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: agent/chicago-gap-closure
          show-progress: false

      - name: Provision siblings and pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: phase2

      - name: Install independent RDF parser
        run: python3 -m pip install --disable-pip-version-check --quiet 'rdflib==7.1.4'

      - name: Build real ggen CLI
        run: cargo build --quiet -p ggen-cli-lib --bin ggen

      - name: Bind TPOT identity proof to consumer replay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path('scripts/ci/repair-consumer-state.sh')
          text = script.read_text(encoding='utf-8')
          old = '''  ../../target/debug/ggen sync run
            ../../target/debug/ggen receipt verify
            find generated -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/tpot-before.sha256
            ../../target/debug/ggen sync run
            ../../target/debug/ggen receipt verify
            find generated -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/tpot-after.sha256
            cmp /tmp/tpot-before.sha256 /tmp/tpot-after.sha256
          '''
          new = '''  ../../target/debug/ggen sync run
            ../../target/debug/ggen receipt verify
            ../../target/debug/ggen sync run
            ../../target/debug/ggen receipt verify
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
              raise SystemExit(f'REFUSED TPOT verifier patch precondition: observed={text.count(old)}')
          script.write_text(text.replace(old, new), encoding='utf-8', newline='')
          print('BOUND TPOT identity to RealConsumerStateTests.tree_digest')
          PY

      - name: Execute bounded consumer reconciliation
        run: |
          set -o pipefail
          bash scripts/ci/repair-consumer-state.sh 2>&1 | tee consumer-repair.log

      - name: Upload repair refusal evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consumer-repair-failure-${{ github.sha }}
          path: |
            consumer-repair.log
            /tmp/tcps-relock.log
          if-no-files-found: warn
