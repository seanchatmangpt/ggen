name: Materialize Book Gap Report

on:
  push:
    branches:
      - agent/post-agi-docs-core-team
    paths:
      - 'packs/**'
      - 'examples/**'
      - 'marketplace/**'
      - 'book/src/CAPABILITY_MAP.md'
      - 'book/scripts/audit_claim_coverage.py'
      - '.github/workflows/materialize-book-gap-report.yml'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/post-agi-docs-core-team

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Generate exact report
        run: |
          python3 -m pip install --disable-pip-version-check --quiet 'rdflib==7.1.4'
          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          from rdflib import Graph
          import subprocess
          import tomllib

          report = []
          report.append('# Book Capability Gap Audit')
          report.append('')
          report.append('This report is an observed current-head census. A green broad workspace test does not erase the gaps listed here.')
          report.append('')

          claim = subprocess.run(
              ['python3', 'book/scripts/audit_claim_coverage.py'],
              text=True,
              capture_output=True,
          )
          report.append('## Claim graph')
          report.append('')
          report.append('```text')
          report.extend((claim.stdout + claim.stderr).strip().splitlines())
          report.append('```')
          report.append('')

          tomls = sorted(set(Path('packs').rglob('*.toml')) | set(Path('marketplace/packs').rglob('*.toml')))
          toml_failures = []
          for path in tomls:
              try:
                  with path.open('rb') as stream:
                      tomllib.load(stream)
              except Exception as error:
                  toml_failures.append(f'{path}: {error}')
          report.append('## TOML corpus')
          report.append('')
          report.append(f'- Files parsed: **{len(tomls)}**')
          report.append(f'- Failures: **{len(toml_failures)}**')
          for failure in toml_failures:
              report.append(f'- `{failure}`')
          report.append('')

          ttls = sorted(set(Path('packs').rglob('*.ttl')) | set(Path('examples').rglob('*.ttl')))
          ttl_failures = []
          triples = 0
          for path in ttls:
              graph = Graph()
              try:
                  graph.parse(path, format='turtle')
                  triples += len(graph)
              except Exception as error:
                  ttl_failures.append(f'{path}: {error}')
          report.append('## Turtle corpus')
          report.append('')
          report.append(f'- Files parsed: **{len(ttls)}**')
          report.append(f'- Triples admitted from valid files: **{triples}**')
          report.append(f'- Invalid files: **{len(ttl_failures)}**')
          for failure in ttl_failures:
              report.append(f'- `{failure}`')
          report.append('')

          scripts = sorted(Path('book/src/listings').rglob('*.sh'))
          shell_failures = []
          for path in scripts:
              result = subprocess.run(['bash', '-n', str(path)], text=True, capture_output=True)
              if result.returncode:
                  shell_failures.append(f'{path}: {(result.stderr or result.stdout).strip()}')
          report.append('## Generated shell laboratory syntax')
          report.append('')
          report.append(f'- Scripts checked: **{len(scripts)}**')
          report.append(f'- Syntax failures: **{len(shell_failures)}**')
          for failure in shell_failures:
              report.append(f'- `{failure}`')
          report.append('')

          consumer_manifests = sorted(Path('examples').rglob('ggen.toml'))
          report.append('## Discoverable consumer manifests')
          report.append('')
          report.append(f'- Consumers found: **{len(consumer_manifests)}**')
          for manifest in consumer_manifests:
              report.append(f'- `{manifest.parent}`')
          report.append('')

          hard_failures = len(toml_failures) + len(ttl_failures) + len(shell_failures) + (1 if claim.returncode else 0)
          report.append('## Observed standing')
          report.append('')
          report.append(f'- Hard corpus failures: **{hard_failures}**')
          report.append('- Standing is `GAPS_EXPOSED` until every hard failure is repaired or explicitly quarantined with a bounded rationale.')
          Path('book/GAP_REPORT.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
          PY

      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'ggen-gap-audit[bot]'
          git config user.email 'ggen-gap-audit[bot]@users.noreply.github.com'
          git add book/GAP_REPORT.md
          if git diff --cached --quiet; then
            echo 'Gap report unchanged.'
            exit 0
          fi
          git commit -m 'docs(book): record observed capability gaps'
          git push origin HEAD:agent/post-agi-docs-core-team
