name: Ecosystem ALIVE Generated Command Format

on:
  pull_request:
    paths:
      - ".specify/templates/cli/commands-reference.rs.tera"
      - "crates/ggen-cli/src/generated_commands.rs"
      - ".github/workflows/ecosystem-alive-generated-command-format.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-alive-generated-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: ""
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Install exact toolchain
        run: rustup toolchain install nightly-2026-06-22 --profile minimal --component rustfmt

      - name: Admit rustfmt-stable template law
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.specify/templates/cli/commands-reference.rs.tera')
          text = path.read_text()
          stale = '''pub const DEFAULT_VERBS: &[(&str, &str)] = &[
          {%- for row in defaults %}
              ("{{ row["noun"] }}", "{{ row["verb"] }}"),
          {%- endfor %}
          ];'''
          admitted = '''pub const DEFAULT_VERBS: &[(&str, &str)] =
              &[{%- for row in defaults %}("{{ row["noun"] }}", "{{ row["verb"] }}"){% if not loop.last %}, {% endif %}{%- endfor %}];'''
          if stale in text:
              raise SystemExit('STALE_TEMPLATE_FORMAT_LAW_REFUSED')
          if text.count(admitted) != 1:
              raise SystemExit('RUSTFMT_STABLE_TEMPLATE_LAW_ABSENT_REFUSED')
          PY

      - name: Build exact ggen kernel
        run: cargo +nightly-2026-06-22 build -p ggen-cli-lib --bin ggen

      - name: Manufacture and verify generated consequence
        shell: bash
        run: |
          set -euo pipefail
          GGEN="$PWD/target/debug/ggen"
          "$GGEN" graph validate
          "$GGEN" sync run
          "$GGEN" receipt verify
          git diff --exit-code -- \
            .specify/templates/cli/commands-reference.rs.tera \
            crates/ggen-cli/src/generated_commands.rs
          cargo +nightly-2026-06-22 fmt --all -- --check
          cargo +nightly-2026-06-22 test -p ggen-cli-lib --test generated_commands_reference

      - name: Prove deterministic second manufacture
        shell: bash
        run: |
          set -euo pipefail
          GGEN="$PWD/target/debug/ggen"
          FIRST="$(sha256sum crates/ggen-cli/src/generated_commands.rs | cut -d' ' -f1)"
          "$GGEN" sync run
          "$GGEN" receipt verify
          SECOND="$(sha256sum crates/ggen-cli/src/generated_commands.rs | cut -d' ' -f1)"
          test "$FIRST" = "$SECOND"
          git diff --exit-code -- \
            .specify/templates/cli/commands-reference.rs.tera \
            crates/ggen-cli/src/generated_commands.rs
          cargo +nightly-2026-06-22 fmt --all -- --check
