name: Repair Book Authority

on:
  push:
    branches:
      - agent/chicago-gap-closure
    paths:
      - '.github/workflows/repair-book-authority.yml'

permissions:
  contents: write

concurrency:
  group: repair-book-authority-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  repair:
    name: Promote admitted capability map into pack law
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: agent/chicago-gap-closure
          show-progress: false

      - name: Provision siblings and pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: book-authority-repair

      - name: Install independent RDF parser
        run: python3 -m pip install --disable-pip-version-check --quiet 'rdflib==7.1.4'

      - name: Build real ggen CLI
        run: cargo build --quiet -p ggen-cli-lib --bin ggen

      - name: Promote the exact admitted source correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ontology = Path('packs/level-five-book-pack/ontology.ttl')
          text = ontology.read_text(encoding='utf-8')
          stale = '| **XVII. TCPS Complete Pattern** — 225–302, 337 |'
          admitted = '| **XVII. TCPS Complete Pattern** — 225–302 |'
          observed = text.count(stale)
          if observed != 1:
              raise SystemExit(
                  f'REFUSED source promotion: expected one stale Pattern 337 marker, observed {observed}'
              )
          if text.count(admitted) != 0:
              raise SystemExit('REFUSED source promotion: admitted marker already exists beside stale law')
          ontology.write_text(text.replace(stale, admitted), encoding='utf-8', newline='')
          print('PROMOTED ontology sourceText: TCPS range 225–302; stale Pattern 337 removed')
          PY

      - name: Intentionally re-lock changed pack law through ggen
        run: |
          set -euo pipefail
          rm book/ggen.lock
          cd book
          ../target/debug/ggen sync run
          ../target/debug/ggen receipt verify

      - name: Independently prove ontology, templates, and generated bytes
        run: |
          set -euo pipefail
          python3 book/scripts/validate_transcription_360.py
          python3 book/scripts/validate_transcription_360.py --sabotage
          python3 book/scripts/validate_ttl_corpus.py
          python3 book/scripts/validate_gap_closure.py

      - name: Prove second-sync byte identity
        run: |
          set -euo pipefail
          find book/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/book-before.sha256
          cp book/ggen.lock /tmp/ggen-before.lock
          cd book
          ../target/debug/ggen sync run
          ../target/debug/ggen receipt verify
          cd ..
          find book/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/book-after.sha256
          cmp /tmp/book-before.sha256 /tmp/book-after.sha256
          cmp /tmp/ggen-before.lock book/ggen.lock
          echo 'SECOND_SYNC_IDENTICAL book_outputs=737 lock=identical receipt=verified'

      - name: Refuse unexpected authority or product drift
        run: |
          set -euo pipefail
          git diff --exit-code -- book/src
          changed=$(git status --porcelain=v1 --untracked-files=all -- \
            packs/level-five-book-pack/ontology.ttl \
            book/ggen.lock \
            book/src \
            ':(exclude)book/.ggen-v2/**')
          printf '%s\n' "$changed"
          expected=$' M book/ggen.lock\n M packs/level-five-book-pack/ontology.ttl'
          test "$changed" = "$expected"

      - name: Commit and publish receipted repair
        run: |
          set -euo pipefail
          git config user.name 'ggen authority repair'
          git config user.email 'actions@users.noreply.github.com'
          git add book/ggen.lock packs/level-five-book-pack/ontology.ttl
          git commit -m 'fix(book): promote capability map source law'
          git push origin HEAD:agent/chicago-gap-closure
          echo "REPAIR_COMMIT $(git rev-parse HEAD)"
