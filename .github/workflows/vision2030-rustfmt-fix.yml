name: Vision 2030 rustfmt repair

on:
  push:
    branches:
      - agent/vision-2030-phase-change

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/vision-2030-phase-change
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Provision repository toolchain
        uses: ./.github/actions/setup-ggen-build

      - name: Format only affected Rust surfaces
        shell: bash
        run: |
          rustfmt --edition 2021 \
            crates/ggen-cli/src/generated_commands.rs \
            crates/ggen-cli/src/cmds/mod.rs \
            crates/ggen-cli/src/cmds/doctor.rs \
            crates/ggen-cli/src/cmds/telco.rs \
            crates/ggen-cli/src/cmds/wizard.rs \
            crates/ggen-cli/src/cmds/sbb/mod.rs \
            crates/ggen-cli/src/cmds/sbb/evaluation.rs \
            crates/ggen-cli/src/cmds/sbb/receipts.rs \
            crates/ggen-cli/src/cmds/sbb/tests.rs \
            crates/ggen-cli/src/cmds/vision2030/mod.rs \
            crates/ggen-cli/src/cmds/vision2030/evaluation.rs \
            crates/ggen-cli/src/cmds/vision2030/receipts.rs \
            crates/ggen-cli/src/cmds/vision2030/tests.rs \
            crates/ggen-cli/src/cmds/maximalism/mod.rs \
            crates/ggen-cli/src/cmds/maximalism/evaluation.rs \
            crates/ggen-cli/src/cmds/maximalism/receipts.rs \
            crates/ggen-cli/src/cmds/maximalism/tests.rs

      - name: Remove one-shot workflow and publish formatting
        shell: bash
        run: |
          rm .github/workflows/vision2030-rustfmt-fix.yml
          git config user.name "ggen architecture formatter"
          git config user.email "ggen-architecture@users.noreply.github.com"
          git add \
            crates/ggen-cli/src/generated_commands.rs \
            crates/ggen-cli/src/cmds \
            .github/workflows/vision2030-rustfmt-fix.yml
          if ! git diff --cached --quiet; then
            git commit -m "style(vision2030): apply pinned rustfmt"
            git push origin HEAD:agent/vision-2030-phase-change
          fi
