name: Architecture Foundry Runtime

on:
  pull_request:
    paths:
      - "tools/architecture-foundry/**"
      - "docs/architecture-foundry/**"
      - ".github/workflows/architecture-foundry-runtime.yml"

permissions:
  contents: read

concurrency:
  group: architecture-foundry-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Normalize runtime in runner checkout
        run: python3 tools/architecture-foundry/normalize_runtime.py

      - name: Manufacture canonical Rust formatting
        run: cargo fmt --manifest-path tools/architecture-foundry/Cargo.toml

      - name: Verify canonical Rust formatting
        run: cargo fmt --manifest-path tools/architecture-foundry/Cargo.toml -- --check

      - name: Upload exact tested Rust sources
        uses: actions/upload-artifact@v4
        with:
          name: architecture-foundry-normalized-source
          path: |
            tools/architecture-foundry/src/lib.rs
            tools/architecture-foundry/src/main.rs
            tools/architecture-foundry/tests/real_git.rs
          if-no-files-found: error
          retention-days: 3

      - name: Test real Git boundaries
        run: cargo test --manifest-path tools/architecture-foundry/Cargo.toml --all-targets

      - name: Validate repository work program
        run: |
          cargo run --manifest-path tools/architecture-foundry/Cargo.toml -- \
            validate-program \
            --program docs/architecture-foundry/work-program.yaml
