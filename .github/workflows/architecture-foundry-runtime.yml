name: Architecture Foundry Runtime

on:
  pull_request:
    paths:
      - "tools/architecture-foundry/**"
      - "docs/architecture-foundry/**"
      - ".github/workflows/architecture-foundry-runtime.yml"

permissions:
  contents: write

concurrency:
  group: architecture-foundry-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Normalize Workstream B verifier
        run: python3 tools/architecture-foundry/normalize_observation.py

      - name: Manufacture canonical Rust formatting
        run: cargo fmt --manifest-path tools/architecture-foundry/Cargo.toml

      - name: Persist exact normalized Rust source
        shell: bash
        run: |
          if ! git diff --quiet -- tools/architecture-foundry; then
            git config user.name "ggen-foundry-verifier"
            git config user.email "ggen-foundry-verifier@users.noreply.github.com"
            git add tools/architecture-foundry
            git commit -m "fix(foundry): separate observation evidence from admission report"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Verify clean exact-head checkout
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify canonical Rust formatting
        run: cargo fmt --manifest-path tools/architecture-foundry/Cargo.toml -- --check

      - name: Test real Git boundaries
        run: cargo test --manifest-path tools/architecture-foundry/Cargo.toml --all-targets

      - name: Validate repository work program
        run: |
          cargo run --manifest-path tools/architecture-foundry/Cargo.toml -- \
            validate-program \
            --program docs/architecture-foundry/work-program.yaml

      - name: Verify no test-induced repository drift
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
