name: Fortune 5 Architecture

on:
  pull_request:
    paths:
      - 'crates/ggen-architecture/**'
      - 'packs/fortune5-architecture-pack/**'
      - 'examples/fortune5-architecture/**'
      - 'docs/architecture/FORTUNE5_REQUIRED_CAPABILITIES.md'
      - '.github/workflows/fortune5-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fortune5-architecture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel-and-law:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact candidate identity
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          printf 'EXACT_HEAD=%s\n' "$actual"

      - name: Provision siblings and pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build

      - name: Resolve the isolated kernel manifest
        run: cargo metadata --manifest-path crates/ggen-architecture/Cargo.toml --no-deps --format-version 1 >/tmp/fortune5-metadata.json

      - name: Enforce pinned rustfmt bytes
        run: cargo fmt --manifest-path crates/ggen-architecture/Cargo.toml --check

      - name: Enforce warning-free kernel
        run: cargo clippy --manifest-path crates/ggen-architecture/Cargo.toml --all-targets -- -D warnings

      - name: Execute Fortune 5 positive witnesses and falsifiers
        run: cargo test --manifest-path crates/ggen-architecture/Cargo.toml --all-targets

      - name: Execute documentation tests
        run: cargo test --manifest-path crates/ggen-architecture/Cargo.toml --doc

      - name: Prove kernel has no direct actuation imports
        run: |
          ! grep -RInE 'std::process|std::fs|std::net|reqwest|kube::|aws_sdk|azure_|google_cloud|Command::new|TcpStream|UdpSocket' crates/ggen-architecture/src
          grep -RIn 'REQUIRED_BROKER.*BRCE\|pub const REQUIRED_BROKER' crates/ggen-architecture/src/lib.rs

      - name: Build the real ggen compiler
        run: cargo build -p ggen-cli-lib --bin ggen

      - name: Manufacture the complete Fortune 5 consumer twice
        run: |
          cd examples/fortune5-architecture
          ../../target/debug/ggen sync run
          ../../target/debug/ggen receipt verify
          find docs -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/fortune5-first.sha256
          ../../target/debug/ggen sync run
          ../../target/debug/ggen receipt verify
          find docs -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/fortune5-second.sha256
          diff -u /tmp/fortune5-first.sha256 /tmp/fortune5-second.sha256
          test -s docs/FORTUNE5_ARCHITECTURE_CATALOG.md
          test -s docs/FORTUNE5_ARCHITECTURE_DAG.dot
          test -s docs/FORTUNE5_CONTROL_MATRIX.md
          test -s docs/FORTUNE5_WORKFLOW_PATTERN_COVERAGE.md
          test "$(grep -c '^| [0-9]' docs/FORTUNE5_WORKFLOW_PATTERN_COVERAGE.md)" -eq 43

      - name: Execute ontology gates and named sabotage independently
        run: |
          python3 -m pip install --disable-pip-version-check rdflib==7.1.4
          python3 - <<'PY'
          from pathlib import Path
          from rdflib import Graph, Namespace, Literal
          from rdflib.plugins.sparql import prepareQuery

          root = Path('packs/fortune5-architecture-pack')
          example = Path('examples/fortune5-architecture/ontology.ttl')
          graph = Graph()
          graph.parse(root / 'ontology.ttl', format='turtle')
          graph.parse(example, format='turtle')
          assert len(graph) > 500, len(graph)

          gates = sorted((root / 'gates').glob('*.rq'))
          assert len(gates) >= 7, gates
          for gate in gates:
              query = gate.read_text()
              prepareQuery(query)
              rows = list(graph.query(query))
              assert not rows, (gate.name, rows[:10])

          f5 = Namespace('http://seanchatmangpt.github.io/packs/fortune5-architecture#')
          ex = Namespace('https://example.org/fortune5/')

          direct = Graph()
          for triple in graph:
              direct.add(triple)
          direct.add((ex['autonomics'], f5.directActuation, Literal(True)))
          direct_rows = list(direct.query((root / 'gates/050_broker_only_autonomics.rq').read_text()))
          assert direct_rows, 'direct actuation sabotage was not refused'

          missing_kms = Graph()
          for triple in graph:
              missing_kms.add(triple)
          missing_kms.remove((ex['orders'], f5.hasKmsPolicy, None))
          kms_rows = list(missing_kms.query((root / 'gates/020_tier01_control_closure.rq').read_text()))
          assert any('hasKmsPolicy' in str(row) for row in kms_rows), kms_rows

          missing_supervision = Graph()
          for triple in graph:
              missing_supervision.add(triple)
          missing_supervision.remove((ex['orders'], f5.hasSupervisionPolicy, None))
          supervision_rows = list(missing_supervision.query((root / 'gates/020_tier01_control_closure.rq').read_text()))
          assert any('hasSupervisionPolicy' in str(row) for row in supervision_rows), supervision_rows

          missing_pattern_receipt = Graph()
          for triple in graph:
              missing_pattern_receipt.add(triple)
          missing_pattern_receipt.remove((ex['wcp43-evidence'], f5.receiptVerifier, None))
          pattern_rows = list(missing_pattern_receipt.query((root / 'gates/060_workflow_pattern_evidence.rq').read_text()))
          assert any('WCP43' in str(row) and 'receiptVerifier' in str(row) for row in pattern_rows), pattern_rows

          incomplete_dflss = Graph()
          for triple in graph:
              incomplete_dflss.add(triple)
          incomplete_dflss.remove((ex['orders-dflss'], f5.verifyEvidence, None))
          dflss_rows = list(incomplete_dflss.query((root / 'gates/070_supervision_dflss_knhk_contract.rq').read_text()))
          assert any('verifyEvidence' in str(row) for row in dflss_rows), dflss_rows

          print(
              'FORTUNE5_LAW '
              f'triples={len(graph)} gates={len(gates)} '
              f'direct_refusals={len(direct_rows)} kms_refusals={len(kms_rows)} '
              f'supervision_refusals={len(supervision_rows)} pattern_refusals={len(pattern_rows)} '
              f'dflss_refusals={len(dflss_rows)}'
          )
          PY

      - name: Refuse generated-law placeholders
        run: |
          ! grep -RInE 'TODO|FIXME|placeholder|mock success|fake success|return true;.*success|unimplemented!\(|todo!\(' crates/ggen-architecture packs/fortune5-architecture-pack examples/fortune5-architecture
