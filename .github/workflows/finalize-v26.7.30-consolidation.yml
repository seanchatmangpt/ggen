name: Finalize v26.7.30 Consolidation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/finalize-v26.7.30-consolidation.yml'

permissions:
  contents: write

concurrency:
  group: finalize-v26.7.30-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-and-verify:
    if: github.event.pull_request.head.ref == 'agent/ggen-v26.7.30-consolidated'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact consolidation head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/ggen-v26.7.30-consolidated
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Provision repository toolchain and siblings
        uses: ./.github/actions/setup-ggen-build

      - name: Merge #502 and reconcile ontology batch admission
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ggen consolidation finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git fetch --no-tags origin '+refs/heads/agent/fix-ontology-import-startup:refs/remotes/origin/agent/fix-ontology-import-startup'

          if git merge-base --is-ancestor origin/agent/fix-ontology-import-startup HEAD; then
            echo '#502 is already present in the consolidation ancestry'
          elif git merge --no-ff --no-edit origin/agent/fix-ontology-import-startup; then
            echo '#502 merged without conflict'
          else
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Observed conflicts:\n'
            printf '  %s\n' "${conflicts[@]}"
            for path in "${conflicts[@]}"; do
              case "$path" in
                crates/ggen-engine/src/sync.rs|*Cargo.lock)
                  git checkout --ours -- "$path"
                  git add -- "$path"
                  ;;
                *)
                  echo "Unexpected #502 conflict: $path"
                  git merge --abort || true
                  exit 1
                  ;;
              esac
            done

            python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ggen-engine/src/sync.rs')
          text = path.read_text()

          old_import = '    graph::{DeterministicGraph, EngineQueryResults, EngineValue, GraphEngine, GraphLawStore},'
          new_import = '''    graph::{
                  DeterministicGraph, EngineQueryResults, EngineValue, GraphEngine, GraphLawStore,
                  TurtleDocument,
              },'''
          if old_import not in text:
              raise SystemExit('#502 finalizer refused: graph import anchor not found')
          text = text.replace(old_import, new_import, 1)

          start_marker = '    graph.insert_turtle(&ttl)?;'
          end_marker = '    let templates = discover_templates(root, &config, &packs)?;'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('#502 finalizer refused: ontology loading anchors not found')

          replacement = '''    // Resolve every ontology document before mutating the graph. Each Turtle
              // parser retains document-local prefix/base/blank-node scope; the admitted
              // union is committed through one bounded store mutation.
              let packs = crate::pack::resolve(&config, root)?;
              let lock_entries = crate::pack::lock_entries(&config, &packs)?;
              crate::pack::check_lock(root, &lock_entries)?;
              let mut ontology_sources = Vec::with_capacity(
                  1 + packs
                      .iter()
                      .map(|pack| 1 + pack.extra_ontology_paths.len())
                      .sum::<usize>(),
              );
              ontology_sources.push((rel_display(root, &ontology_path), ttl));
              for pack in &packs {
                  let pack_ttl = std::fs::read_to_string(&pack.ontology_path).map_err(|e| {
                      AppError::fm_pack(
                          4,
                          format!(
                              "pack `{}`: ontology `{}` unreadable: {e}",
                              pack.name,
                              pack.ontology_path.display()
                          ),
                      )
                  })?;
                  ontology_sources.push((rel_display(root, &pack.ontology_path), pack_ttl));
                  for (declared, extra_path) in &pack.extra_ontology_paths {
                      let extra_ttl = std::fs::read_to_string(extra_path).map_err(|e| {
                          AppError::fm_pack(
                              4,
                              format!(
                                  "pack `{}`: extra ontology `{declared}` unreadable at `{}`: {e}",
                                  pack.name,
                                  extra_path.display()
                              ),
                          )
                      })?;
                      ontology_sources.push((declared.clone(), extra_ttl));
                  }
              }
              let ontology_documents: Vec<TurtleDocument<'_>> = ontology_sources
                  .iter()
                  .map(|(label, content)| TurtleDocument::new(label, content))
                  .collect();
              let ontology_receipt = graph.insert_turtle_documents(&ontology_documents)?;
              tracing::debug!(
                  ontology.documents = ontology_receipt.documents,
                  ontology.parsed_quads = ontology_receipt.parsed_quads,
                  ontology.inserted_quads = ontology_receipt.inserted_quads,
                  "ontology batch admitted"
              );

          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

            git add crates/ggen-engine/src/sync.rs
            git commit --no-edit
          fi

      - name: Reconcile generated dependency state
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(consolidation): reconcile Cargo lock state'
          fi

      - name: Adapt praxis OCEL bridge to bcinr-powl temporal API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/praxis-graphlaw/src/chatman/engine.rs')
          text = path.read_text()

          old = {
              'mask': '        let mut fired_mask = 0u64;\n',
              'fire': '''            fired_mask |= bit;
                      plog.record_op_fired(doc.run_id, ev.op_index, 0)''',
              'seal': '            plog.record_run_sealed(doc.run_id, fired_mask)',
          }
          new = {
              'mask': '        let mut fired_mask = 0u64;\n        let mut run_time = 0u32;\n',
              'fire': 'plog.record_op_fired(doc.run_id, ev.op_index, logical_time, 0)',
              'seal': 'plog.record_run_sealed(doc.run_id, fired_mask, run_time)',
          }

          if all(text.count(anchor) == 1 for anchor in old.values()):
              text = text.replace(old['mask'], new['mask'], 1)
              text = text.replace(
                  old['fire'],
                  '''            fired_mask |= bit;
                      let logical_time = u32::try_from(ev.at_ns).map_err(|_| {
                          Refusal::TraceUnlawful(format!(
                              "event {}: at_ns {} exceeds the u32 logical-time boundary",
                              ev.id, ev.at_ns
                          ))
                      })?;
                      run_time = run_time.max(logical_time);
                      plog.record_op_fired(doc.run_id, ev.op_index, logical_time, 0)''',
                  1,
              )
              text = text.replace(old['seal'], new['seal'], 1)
              path.write_text(text)
          elif all(text.count(anchor) == 1 for anchor in new.values()):
              print('POWL OCEL temporal adapter already present; replay is a no-op')
          else:
              counts = {
                  **{f'old_{name}': text.count(anchor) for name, anchor in old.items()},
                  **{f'new_{name}': text.count(anchor) for name, anchor in new.items()},
              }
              raise SystemExit(
                  f'OCEL compatibility repair refused: anchors are neither old nor admitted: {counts}'
              )
          PY

          git add crates/praxis-graphlaw/src/chatman/engine.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(graphlaw): carry logical time into POWL OCEL records'
          fi

      - name: Adapt combinatorial matrix to maximal frontmatter API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ggen-engine/tests/combinatorial_matrix.rs')
          text = path.read_text()

          replacements = [
              (
                  '    template::{Frontmatter, Template},',
                  '    template::{Frontmatter, MatchSpec, Template},',
              ),
              (
                  '        sparql: BTreeMap::new(),\n        construct: None,',
                  '        sparql: BTreeMap::new(),\n        for_each: None,\n        construct: None,',
              ),
              (
                  '        before: (inject && anchor == Anchor::Before).then(|| "// ANCHOR".to_string()),',
                  '        before: (inject && anchor == Anchor::Before)\n            .then(|| MatchSpec::Literal("// ANCHOR".to_string())),',
              ),
              (
                  '        after: (inject && anchor == Anchor::After).then(|| "// ANCHOR".to_string()),',
                  '        after: (inject && anchor == Anchor::After)\n            .then(|| MatchSpec::Literal("// ANCHOR".to_string())),',
              ),
              (
                  '            SkipIf::Matching => Some(MATCHING_NEEDLE.to_string()),',
                  '            SkipIf::Matching => Some(MatchSpec::Literal(MATCHING_NEEDLE.to_string())),',
              ),
              (
                  '            SkipIf::NonMatching => Some(NON_MATCHING_NEEDLE.to_string()),',
                  '            SkipIf::NonMatching => {\n                Some(MatchSpec::Literal(NON_MATCHING_NEEDLE.to_string()))\n            }',
              ),
          ]

          old_counts = [text.count(old) for old, _ in replacements]
          new_counts = [text.count(new) for _, new in replacements]
          if all(count == 1 for count in old_counts):
              for old, new in replacements:
                  text = text.replace(old, new, 1)
              path.write_text(text)
          elif all(count == 1 for count in new_counts):
              print('combinatorial matrix frontmatter adapter already present; replay is a no-op')
          else:
              raise SystemExit(
                  'combinatorial matrix compatibility repair refused: '
                  f'old_counts={old_counts}, new_counts={new_counts}'
              )
          PY

          git add crates/ggen-engine/tests/combinatorial_matrix.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(engine): adapt combinatorial matrix to typed matchers'
          fi

      - name: Normalize and verify engine admission boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'style(consolidation): normalize merged Rust sources'
          fi
          cargo fmt --all -- --check
          cargo test -p ggen-engine

      - name: Remove one-use finalizer and push receipt
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/workflows/finalize-v26.7.30-consolidation.yml ]]; then
            git rm .github/workflows/finalize-v26.7.30-consolidation.yml
            git commit -m 'chore(consolidation): remove one-use #502 finalizer'
          fi
          git push origin HEAD:agent/ggen-v26.7.30-consolidated
