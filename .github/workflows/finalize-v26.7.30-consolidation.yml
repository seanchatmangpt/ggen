name: Finalize v26.7.30 Consolidation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/finalize-v26.7.30-consolidation.yml'

permissions:
  contents: write

concurrency:
  group: finalize-v26.7.30-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-and-verify:
    if: github.event.pull_request.head.ref == 'agent/ggen-v26.7.30-consolidated'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact consolidation head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/ggen-v26.7.30-consolidated
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Provision repository toolchain and siblings
        uses: ./.github/actions/setup-ggen-build

      - name: Merge, reconcile, verify, and publish receipt
        shell: bash
        run: bash .github/scripts/finalize-v26.7.30-consolidation.sh
