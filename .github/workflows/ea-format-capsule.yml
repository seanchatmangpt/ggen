name: EA Format Capsule

on:
  pull_request:
    paths:
      - 'crates/ggen-architecture/**'
      - 'tools/ggen-architecture/**'
      - '.github/workflows/ea-format-capsule.yml'

permissions:
  contents: read

jobs:
  format-capsule:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt

      - name: Manufacture canonical rustfmt bytes
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/ggen-architecture/Cargo.toml --all
          git diff --binary -- crates/ggen-architecture tools/ggen-architecture > /tmp/ea-rustfmt.patch
          test -s /tmp/ea-rustfmt.patch
          printf '%s\n' "SOURCE_SHA=${{ github.event.pull_request.head.sha }}" > /tmp/receipt.txt
          sha256sum /tmp/ea-rustfmt.patch >> /tmp/receipt.txt

      - name: Upload formatter patch and receipt
        uses: actions/upload-artifact@v4
        with:
          name: ea-rustfmt-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/ea-rustfmt.patch
            /tmp/receipt.txt
          if-no-files-found: error
          retention-days: 1
