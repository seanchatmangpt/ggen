name: CMD library template repair

on:
  push:
    branches:
      - agent/combinatorial-maximalism-pack
    paths:
      - '.github/workflows/cmd-lib-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/combinatorial-maximalism-pack
          fetch-depth: 0
      - name: Apply exact template repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packs/ggen-combinatorial-maximalism-pack/templates/lib.rs.tmpl')
          text = path.read_text()
          replacements = {
              'sh_after: rustfmt generated/cmd-cell/src/lib.rs\n': '',
              '        resource_cost: {{ option.resource_cost }},':
                  '        resource_cost: {{ option.resource_cost }}f64,',
              '        standing: Standing::{{ candidate.standing | pascal_case }},':
                  '        standing: {% if candidate.standing == "VERIFIED" %}Standing::Verified{% else %}Standing::Candidate{% endif %},',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'CMD_LIB_REPAIR_SOURCE_MISMATCH:{old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/cmd-lib-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packs/ggen-combinatorial-maximalism-pack/templates/lib.rs.tmpl .github/workflows/cmd-lib-repair.yml
          git commit -m 'fix(cmd): make RDF-to-Rust projection total'
          git push origin HEAD:agent/combinatorial-maximalism-pack
