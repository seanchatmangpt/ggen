name: v26.8.1 Step Two

on:
  pull_request:
    paths:
      - "tools/v26.8.1/**"
      - "planning/v26.8.1/**"
      - "ontology/v26.8.1/**"
      - "docs/v26.8.1/**"
      - "crates/ggen-cli/**"
      - "crates/bcinr/**"
      - ".github/workflows/v26.8.1-step-two.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v26-8-1-step-two-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admit-step-two:
    name: Step Two / autonomous admission
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact aggregate head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve Rust toolchain
        run: rustup show

      # Required by .cargo/config.toml's unconditional `[build] rustc-wrapper
      # = "sccache"`. Without it every cargo invocation in this job fails
      # immediately: `error: could not execute process 'sccache ... rustc -vV'
      # (never executed) ... No such file or directory` -- this workflow never
      # had this step, unlike .github/actions/setup-ggen-build/action.yml
      # which documents the exact same failure mode from PR #255. Confirmed
      # live: every `cargo run`/`cargo test` invocation inside step_two.py
      # failed with this error on this workflow before this fix.
      - name: Install sccache
        uses: taiki-e/install-action@81ecf985428d5c2ea81dbf079bceca32bc9604ab  # v2.62.43
        with:
          tool: sccache

      - name: Install schema validator
        run: pip install --quiet jsonschema

      - name: Execute one-shot controller
        run: python3 tools/v26.8.1/step_two.py --root .

      - name: Assert admitted receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('.ggen/v26.8.1/step-two/report.json').read_text())
          receipt = json.loads(Path('.ggen/v26.8.1/step-two/receipt.json').read_text())
          assert report['standing'] == 'ALIVE', report
          assert report['step_two_admitted'] is True, report
          assert receipt['step_two_admitted'] is True, receipt
          assert report['source_head'] == receipt['source_head']
          expected_head = os.environ['EXPECTED_HEAD']
          assert report['source_head'] == expected_head, (report['source_head'], expected_head)
          PY

      - name: Validate report/receipt against JSON schemas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          def validate(instance_path, schema_path):
              instance = json.loads(Path(instance_path).read_text())
              schema = json.loads(Path(schema_path).read_text())
              jsonschema.Draft202012Validator(schema).validate(instance)

          validate(
              ".ggen/v26.8.1/step-two/report.json",
              "tools/v26.8.1/schemas/step-two-report.schema.json",
          )
          validate(
              ".ggen/v26.8.1/verifier-report.json",
              "tools/v26.8.1/schemas/verifier-report.schema.json",
          )
          print("schema validation passed")
          PY

      - name: Publish Step Two evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ggen-v26.8.1-step-two-${{ github.sha }}
          path: .ggen/v26.8.1/step-two/
          if-no-files-found: error
