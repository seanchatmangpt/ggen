name: Fortune 5 BBlock Normalize

on:
  pull_request:
    paths:
      - 'crates/ggen-cli/src/cmds/bblock.rs'
      - 'crates/ggen-cli/src/cmds/mod.rs'
      - '.github/workflows/fortune5-bblock-normalize.yml'

permissions:
  contents: write

concurrency:
  group: fortune5-bblock-normalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Provision repository toolchain
        uses: ./.github/actions/setup-ggen-build

      - name: Apply the named helper repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ggen-cli/src/cmds/bblock.rs')
          text = path.read_text()
          text = text.replace("fn group<'a>(catalog: &'a Catalog, id: &str)", "fn find_group<'a>(catalog: &'a Catalog, id: &str)")
          text = text.replace('let current = group(catalog, id)?;', 'let current = find_group(catalog, id)?;')
          text = text.replace('let group = group(catalog, id)?;', 'let group = find_group(catalog, id)?;')
          path.write_text(text)
          PY

      - name: Normalize only the bblock command surface
        run: cargo fmt --manifest-path Cargo.toml --package ggen-cli-lib

      - name: Commit bounded normalized bytes
        run: |
          changed="$(git diff --name-only | sort)"
          if [ -z "$changed" ]; then
            echo 'bblock source already normalized'
            exit 0
          fi
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^crates/ggen-cli/src/cmds/(bblock|mod)\.rs$' || true)"
          test -z "$unexpected"
          git config user.name 'ggen bblock formatter'
          git config user.email 'ggen-bblock@users.noreply.github.com'
          git add crates/ggen-cli/src/cmds/bblock.rs crates/ggen-cli/src/cmds/mod.rs
          git commit -m 'style(bblock): apply pinned rustfmt and helper repair'
          git push origin "HEAD:${TARGET_BRANCH}"
