name: ggen Root Dogfood

on:
  pull_request:
    paths:
      - "ggen.toml"
      - ".specify/**"
      - "packs/**"
      - "crates/ggen-engine/**"
      - "crates/ggen-cli/**"
      - "self-host/scripts/verify_root_regeneration.py"
      - ".github/workflows/ggen-root-dogfood.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manufacture-own-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Provision pinned ggen build
        uses: ./.github/actions/setup-ggen-build

      - name: Build the production ggen binary
        run: cargo build -p ggen-cli-lib --bin ggen

      - name: Manufacture ggen from its own ontology and manifest
        run: |
          ./target/debug/ggen sync run
          ./target/debug/ggen receipt verify

      - name: Observe root consequence ownership
        id: root-ownership
        continue-on-error: true
        run: python3 self-host/scripts/verify_root_regeneration.py

      - name: Upload root ownership diagnostic
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ggen-root-ownership-${{ github.sha }}
          path: |
            self-host/observed/root-regeneration.json
            .ggen-v2/receipt.json
          if-no-files-found: warn

      - name: Refuse any unowned root consequence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('self-host/observed/root-regeneration.json').read_text())
          if not report['passed']:
              raise SystemExit(json.dumps({
                  'unauthorized_paths': report['unauthorized_paths'],
                  'missing_outputs': report['missing_outputs'],
              }, sort_keys=True))
          PY

      - name: Require every declared output, including CLI proof tests
        run: |
          test -s crates/ggen-cli/src/generated_commands.rs
          test -s crates/ggen-cli/tests/generated/cli_proof_tests.rs
          python3 - <<'PY'
          import importlib.util, tomllib
          from pathlib import Path
          root = Path.cwd()
          script = root / 'self-host/scripts/verify_root_regeneration.py'
          spec = importlib.util.spec_from_file_location('root_verify', script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          doc = tomllib.loads((root / 'ggen.toml').read_text())
          missing = []
          for rule in doc['generation']['rules']:
              raw = rule['output_file']
              if not module.existing_output_matches(root, raw):
                  missing.append(raw)
          assert not missing, missing
          PY

      - name: Snapshot all declared consequence bytes
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, tomllib
          from pathlib import Path
          root = Path.cwd()
          script = root / 'self-host/scripts/verify_root_regeneration.py'
          spec = importlib.util.spec_from_file_location('root_verify', script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          doc = tomllib.loads((root / 'ggen.toml').read_text())
          result = {}
          for rule in doc['generation']['rules']:
              for raw in module.existing_output_matches(root, rule['output_file']):
                  path = root / raw
                  result[raw] = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('/tmp/root-first.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          PY

      - name: Prove second root manufacture is byte-identical
        run: |
          ./target/debug/ggen sync run
          ./target/debug/ggen receipt verify
          python3 - <<'PY'
          import hashlib, importlib.util, json, tomllib
          from pathlib import Path
          root = Path.cwd()
          script = root / 'self-host/scripts/verify_root_regeneration.py'
          spec = importlib.util.spec_from_file_location('root_verify', script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          expected = json.loads(Path('/tmp/root-first.json').read_text())
          doc = tomllib.loads((root / 'ggen.toml').read_text())
          actual = {}
          for rule in doc['generation']['rules']:
              for raw in module.existing_output_matches(root, rule['output_file']):
                  path = root / raw
                  actual[raw] = hashlib.sha256(path.read_bytes()).hexdigest()
          assert actual == expected, {'expected': expected, 'actual': actual}
          PY

      - name: Materialize changed owned consequences for review
        run: |
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          report = json.loads(Path('self-host/observed/root-regeneration.json').read_text())
          target = Path('self-host/observed/root-regenerated')
          for raw in report['changed_paths']:
              source = Path(raw)
              destination = target / raw
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          PY
          git diff --binary > self-host/observed/root-regeneration.patch

      - name: Refuse direct external actuation in dogfood verifier
        run: |
          ! grep -InE 'requests\.|urllib\.request|socket\.|boto|azure|google\.cloud|kubectl|terraform apply|git push|git commit' self-host/scripts/verify_root_regeneration.py

      - name: Upload regeneration report and exact generated bytes
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ggen-root-dogfood-${{ github.sha }}
          path: |
            self-host/observed/root-regeneration.json
            self-host/observed/root-regeneration.patch
            self-host/observed/root-regenerated
            .ggen-v2/receipt.json
          if-no-files-found: error
