name: Agent Frontmatter Matchers

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.event.pull_request.head.ref == 'agent/frontmatter-maximalism'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply typed matcher checkpoint
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/frontmatter-matchers.py
          python3 /tmp/frontmatter-matchers.py

      - name: Format and statically verify
        shell: bash
        run: |
          rustup component add rustfmt
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          if git diff -- '*.rs' '*.md' '*.ttl' | grep -E '^\+.*\b(TODO|FIXME)\b'; then
            echo 'Forbidden placeholder introduced'
            exit 1
          fi

      - name: Run narrow matcher verifier
        shell: bash
        run: |
          cargo test -p ggen-engine --lib write::tests
          cargo test -p ggen-engine \
            --test frontmatter_matchers_e2e \
            --test frontmatter_maximalism_e2e \
            --test frontmatter_schema_match \
            --test frontmatter_fields_e2e

      - name: Commit verified matcher implementation
        shell: bash
        run: |
          rm .github/workflows/agent-frontmatter-matchers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock \
                  crates/ggen-engine/Cargo.toml \
                  crates/ggen-engine/src/template.rs \
                  crates/ggen-engine/src/sync.rs \
                  crates/ggen-engine/src/write.rs \
                  crates/ggen-engine/schema/frontmatter-schema.ttl \
                  crates/ggen-engine/tests/frontmatter_matchers_e2e.rs \
                  docs/reference/frontmatter-maximalism.md \
                  .github/workflows/agent-frontmatter-matchers.yml
          git commit -m "feat(engine): add typed frontmatter matchers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
