name: GALL-001 Replay Court

on:
  pull_request:
    paths:
      - "crates/ggen-engine/src/lib.rs"
      - "crates/ggen-engine/src/pack.rs"
      - "crates/ggen-engine/src/portable_receipt.rs"
      - "crates/ggen-engine/src/replay.rs"
      - "crates/ggen-engine/tests/gall_checkpoint_001_replay_e2e.rs"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gall-001-replay.yml"
      - "docs/jira/GALL-CHECKPOINT-semantic-pack-receipt-001*.md"
      - "docs/jira/v26.9.18/GALL-001-*.md"
  workflow_dispatch:

concurrency:
  group: gall-001-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  replay:
    name: Exact-head clean replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: gall-001-${{ github.event.pull_request.head.sha || github.sha }}

      - name: Execute GALL-001 clean-state reconstruction court
        shell: bash
        env:
          GALL001_REPLAY_RECEIPT_OUT: ${{ runner.temp }}/gall-001-replay-receipt.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo test -p ggen-engine --test gall_checkpoint_001_replay_e2e -- --nocapture

          python3 - "$GALL001_REPLAY_RECEIPT_OUT" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          receipt = json.loads(path.read_text())
          assert receipt["replay"]["status"] == "PASS"
          required = (
              "subject",
              "dependencies",
              "composition",
              "graph",
              "consequences",
              "toolchain",
              "environment",
          )
          for field in required:
              witness = receipt["replay"]["identity"][field]
              assert witness["equal"] is True
              assert witness["sha256"].startswith("sha256:")

          expected = path.with_suffix(path.suffix + ".sha256").read_text().strip()
          import hashlib
          actual = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          print(json.dumps({
              "status": "PARTIAL_ALIVE",
              "court": "ggen-engine::replay::verify_project_replay",
              "replay_receipt_sha256": actual,
          }, sort_keys=True))
          PY

      - name: Upload exact replay receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gall-001-replay-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/gall-001-replay-receipt.json
            ${{ runner.temp }}/gall-001-replay-receipt.json.sha256
          if-no-files-found: error
          retention-days: 14
