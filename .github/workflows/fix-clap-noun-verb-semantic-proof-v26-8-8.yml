name: Repair clap noun-verb semantic proof

on:
  push:
    branches:
      - fix/clap-noun-verb-semantic-proof-v26-8-8
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Repair verifier at source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packs/clap-noun-verb-pack/templates/clap_noun_verb_sparql_derived_proof.rs.tmpl')
          s = p.read_text()
          old_param = '''        let expected_param = if arg.required {\n            format!("    {}: {},", arg.ident, arg.rust_type)\n        } else {\n            format!("    {}: Option<{}>,", arg.ident, arg.rust_type)\n        };'''
          new_param = '''        // Verify the semantic parameter shape, not incidental indentation/comma\n        // layout chosen by Tera whitespace trimming. The generated route is\n        // separately compiled, so syntax remains independently checked.\n        let expected_param = if arg.required {\n            format!("{}: {}", arg.ident, arg.rust_type)\n        } else {\n            format!("{}: Option<{}>", arg.ident, arg.rust_type)\n        };'''
          old_static = '''#[test]\nfn every_live_static_response_matches_generated_routes_right_now() {\n    for (key, expected_body) in LIVE_STATIC_RESPONSES {\n        assert!(\n            ROUTES.contains(expected_body),'''
          new_static = '''fn compact_rust_projection(value: &str) -> String {\n    value.chars().filter(|ch| !ch.is_whitespace()).collect()\n}\n\n#[test]\nfn every_live_static_response_matches_generated_routes_right_now() {\n    let compact_routes = compact_rust_projection(ROUTES);\n    for (key, expected_body) in LIVE_STATIC_RESPONSES {\n        let compact_expected = compact_rust_projection(expected_body);\n        assert!(\n            compact_routes.contains(&compact_expected),'''
          changed = False
          if old_param in s:
              s = s.replace(old_param, new_param, 1)
              changed = True
          if old_static in s:
              s = s.replace(old_static, new_static, 1)
              changed = True
          if changed:
              p.write_text(s)
          print('changed=', changed)
          PY
          git diff --check
          if git diff --quiet -- packs/clap-noun-verb-pack/templates/clap_noun_verb_sparql_derived_proof.rs.tmpl; then
            echo 'proof already repaired'
            exit 0
          fi
          git config user.name 'ggen-pack-repair'
          git config user.email '136349053+seanchatmangpt@users.noreply.github.com'
          git add packs/clap-noun-verb-pack/templates/clap_noun_verb_sparql_derived_proof.rs.tmpl
          git commit -m 'fix(clap-noun-verb-pack): verify semantic projection independent of whitespace'
          git push origin HEAD:fix/clap-noun-verb-semantic-proof-v26-8-8
