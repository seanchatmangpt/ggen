name: mmdio Semantic Crown Contract

on:
  pull_request:
    paths:
      - "packs/mmdio-pack/pack.toml"
      - "packs/mmdio-pack/ontology.ttl"
      - "packs/mmdio-pack/semantic-crown.ttl"
      - "packs/mmdio-pack/gates/**"
      - "packs/mmdio-pack/SEMANTIC_CROWN.md"
      - ".github/workflows/mmdio-semantic-crown-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmdio-semantic-crown-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MMDIO_SHA: 19d7be5ee4f5d48ed460c6559266d15d909b8f28
      MMDIO_BLOB: d114944c95392adf14a22fb2bdfcd26651dc39a0
    steps:
      - name: Check out exact ggen candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Check out exact mmdio crown candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/mmdio
          ref: 19d7be5ee4f5d48ed460c6559266d15d909b8f28
          path: external/mmdio
          fetch-depth: 1

      - name: Assert exact subjects and source blob
        env:
          EXPECTED_GGEN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_GGEN_HEAD"
          test "$(git -C external/mmdio rev-parse HEAD)" = "$MMDIO_SHA"
          test "$(git -C external/mmdio hash-object src/mmdio/flowchart_crown.py)" = "$MMDIO_BLOB"

      - name: Install Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install focused graph and test dependencies
        run: python -m pip install --disable-pip-version-check rdflib==7.1.4 pytest==9.1.1

      - name: Parse authority graphs and execute SPARQL gate
        run: |
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph, Literal, Namespace, RDF, URIRef

          MER = Namespace("https://seanchatmangpt.github.io/ontology/mermaid#")
          graph = Graph()
          graph.parse("packs/mmdio-pack/ontology.ttl", format="turtle")
          graph.parse("packs/mmdio-pack/semantic-crown.ttl", format="turtle")

          crown = MER.Crown_flowchart_rectangle_solid_v1
          assert (crown, RDF.type, MER.SemanticCrown) in graph
          assert (MER.Type_flowchart, MER.semanticCrown, crown) in graph
          assert (crown, MER.profileIdentity, Literal("mmdio.flowchart.rectangle-solid/1")) in graph
          assert (crown, MER.sourceRepository, Literal("seanchatmangpt/mmdio")) in graph
          assert (crown, MER.sourceCommit, Literal("19d7be5ee4f5d48ed460c6559266d15d909b8f28")) in graph
          assert (crown, MER.sourcePath, Literal("src/mmdio/flowchart_crown.py")) in graph
          assert (crown, MER.sourceGitBlob, Literal("d114944c95392adf14a22fb2bdfcd26651dc39a0")) in graph
          assert (crown, MER.claimCeiling, Literal("BOUNDED_FLOWCHART_SEMANTIC_ROUNDTRIP_ONLY")) in graph
          assert (crown, MER.actuationAuthority, Literal(False)) in graph

          query = Path(
              "packs/mmdio-pack/gates/030_semantic_crown_requires_exact_source.rq"
          ).read_text(encoding="utf-8")
          violations = list(graph.query(query))
          assert not violations, violations
          print(f"triples={len(graph)} violations=0")
          PY

      - name: Execute pinned mmdio crown tests
        env:
          PYTHONPATH: external/mmdio/src
        run: python -m pytest -q -c /dev/null external/mmdio/tests/test_flowchart_crown.py

      - name: Execute pinned mmdio replay twice
        env:
          PYTHONPATH: external/mmdio/src
        run: |
          cat > /tmp/input.mmd <<'MMD'
          flowchart LR
            observe["Observe evidence"]
            admit["Admit subject"]
            receipt["Issue receipt"]
            observe --> admit
            admit --> receipt
          MMD

          python external/mmdio/scripts/flowchart_crown.py /tmp/input.mmd \
            --receipt /tmp/receipt-a.json --rendered /tmp/canonical-a.mmd
          python external/mmdio/scripts/flowchart_crown.py /tmp/input.mmd \
            --receipt /tmp/receipt-b.json --rendered /tmp/canonical-b.mmd
          cmp /tmp/receipt-a.json /tmp/receipt-b.json
          cmp /tmp/canonical-a.mmd /tmp/canonical-b.mmd
          python external/mmdio/scripts/flowchart_crown.py \
            --receipt /tmp/receipt-a.json --verify

      - name: Emit bounded integration summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          print(json.dumps({
              "schema": "ggen-mmdio-semantic-crown-contract/v1",
              "ggen_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "mmdio_head": subprocess.check_output(
                  ["git", "-C", "external/mmdio", "rev-parse", "HEAD"], text=True
              ).strip(),
              "mmdio_blob": os.environ["MMDIO_BLOB"],
              "claim_ceiling": "EXACT_SOURCE_FLOWCHART_CROWN_CONTRACT_ONLY",
          }, sort_keys=True))
          PY
