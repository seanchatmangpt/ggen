name: ggen-first Lean 4 to Rust

on:
  pull_request:
    paths:
      - 'packs/ggen-lean4-rust-pipeline-pack/**'
      - 'examples/ggen-first-lean4-rust/**'
      - 'scripts/validate_lean4_rust_pipeline.py'
      - 'scripts/verify-lean4-rust-pipeline.sh'
      - 'docs/how-to/ggen-first-lean4-rust.md'
      - '.github/workflows/ggen-first-lean4-rust.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ggen-first-lean4-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-emit-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: ggen-first-lean4-rust
      - name: Manufacture Lean bootstrap
        run: |
          python3 scripts/validate_lean4_rust_pipeline.py
          cargo build -p ggen-cli-lib --bin ggen
          cd examples/ggen-first-lean4-rust
          ../../target/debug/ggen sync run
      - name: Install Lean and compile proof program
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: examples/ggen-first-lean4-rust/generated/lean
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: true
          nanoda: false
      - name: Verify complete pipeline
        run: bash scripts/verify-lean4-rust-pipeline.sh
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ggen-first-lean4-rust-receipts
          if-no-files-found: warn
          path: examples/ggen-first-lean4-rust/generated
