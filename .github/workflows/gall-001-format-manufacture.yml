name: GALL-001 Format Manufacture

on:
  pull_request:
    paths:
      - ".github/workflows/gall-001-format-manufacture.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Set up pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: gall-001-format-${{ github.event.pull_request.head.sha }}

      - name: Manufacture and commit rustfmt projection
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          remote_head="$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"

          cargo fmt --all
          git diff --check

          if git diff --quiet -- '*.rs'; then
            echo "No rustfmt drift remains."
            exit 0
          fi

          git config user.name "ggen GALL court"
          git config user.email "136349053+seanchatmangpt@users.noreply.github.com"
          git add -- '*.rs'
          git rm .github/workflows/gall-001-format-manufacture.yml
          git commit -m "style(gall-001): apply pinned rustfmt projection"
          git push origin "HEAD:$HEAD_BRANCH"
