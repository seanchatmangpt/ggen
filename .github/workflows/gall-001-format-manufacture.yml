name: GALL-001 Format Manufacture

on:
  pull_request:
    paths:
      - ".github/workflows/gall-001-format-manufacture.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: gall-001-format-${{ github.event.pull_request.head.sha }}

      - name: Manufacture rustfmt projection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          cargo fmt --all
          out="${{ runner.temp }}/formatted"
          mkdir -p "$out"
          git diff --name-only -- '*.rs' | sort > "${{ runner.temp }}/formatted-paths.txt"
          test -s "${{ runner.temp }}/formatted-paths.txt"
          while IFS= read -r path; do
            mkdir -p "$out/$(dirname "$path")"
            cp "$path" "$out/$path"
          done < "${{ runner.temp }}/formatted-paths.txt"
          git diff --binary -- '*.rs' > "${{ runner.temp }}/cargo-fmt.patch"

      - name: Upload rustfmt projection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gall-001-rustfmt-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/formatted
            ${{ runner.temp }}/formatted-paths.txt
            ${{ runner.temp }}/cargo-fmt.patch
          if-no-files-found: error
          retention-days: 2
