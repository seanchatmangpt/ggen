name: Temporary ggen v26.8.1 corpus source removal

on:
  push:
    branches: [agent/migrate-v26-8-1-corpus-to-ggen-legacy]
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: remove-ggen-v26-8-1-corpus
  cancel-in-progress: true

env:
  SOURCE_BASE: 8351af4c5bbbf60bd99ab8417752a1762c6ea4e3
  CORPUS_BRANCH: 8e708cdcbd56710455cbddd17f16fbf184f99ba2
  CORPUS_COMMIT: 07928bde9d9eaba2e2e2fd8f78fcdc3f7b0b63ff

jobs:
  remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/migrate-v26-8-1-corpus-to-ggen-legacy
          fetch-depth: 0

      - name: Checkout exact source baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/ggen
          ref: ${{ env.SOURCE_BASE }}
          path: .baseline-ggen
          fetch-depth: 0

      - name: Checkout admitted corpus candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/ggen-legacy
          ref: ${{ env.CORPUS_BRANCH }}
          path: .corpus
          fetch-depth: 0

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt

      - name: Install just
        uses: taiki-e/install-action@81ecf985428d5c2ea81dbf079bceca32bc9604ab
        with:
          tool: just

      - name: Install verifier dependencies
        run: python3 -m pip install --disable-pip-version-check blake3==1.0.9 jsonschema==4.26.0 pyshacl==0.40.0

      - name: Admit destination receipt before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .baseline-ggen rev-parse HEAD)" = "$SOURCE_BASE"
          CORPUS_HEAD="$(git -C .corpus rev-parse HEAD)"
          echo "CORPUS_HEAD=$CORPUS_HEAD" >> "$GITHUB_ENV"
          git -C .corpus merge-base --is-ancestor "$CORPUS_COMMIT" "$CORPUS_HEAD"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          source = '8351af4c5bbbf60bd99ab8417752a1762c6ea4e3'
          corpus_commit = '07928bde9d9eaba2e2e2fd8f78fcdc3f7b0b63ff'
          root = Path('.corpus')
          required = [
              root/'migrations/ggen-v26.8.1/migration-manifest.json',
              root/'migrations/ggen-v26.8.1/migration-receipt.json',
              root/'migrations/ggen-v26.8.1/verifier-report.json',
              root/'migrations/ggen-v26.8.1/equivalence-report.json',
              root/'scripts/verify_ggen_v26_8_1_migration.py',
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'DESTINATION_EVIDENCE_ABSENT_REFUSED {missing}')
          manifest = json.loads(required[0].read_text())
          receipt = json.loads(required[1].read_text())
          verifier = json.loads(required[2].read_text())
          equivalence = json.loads(required[3].read_text())
          checks = {
              'source_manifest': manifest.get('source_head') == source,
              'corpus_manifest': manifest.get('corpus_head') == corpus_commit,
              'source_receipt': receipt.get('source_commit') == source,
              'corpus_receipt': receipt.get('corpus_commit') == corpus_commit,
              'standing_receipt': receipt.get('standing') == 'PARTIAL_ALIVE',
              'standing_verifier': verifier.get('standing') == 'PARTIAL_ALIVE',
              'replay_receipt': receipt.get('replay') == 'REPLAY_MATCH',
              'replay_verifier': verifier.get('replay') == 'REPLAY_MATCH',
              'equivalence': equivalence.get('exact_byte_identity') is True,
              'source_removal_not_ambient': receipt.get('source_removal_admitted') is False,
          }
          if not all(checks.values()):
              raise SystemExit(f'DESTINATION_RECEIPT_REFUSED {checks}')
          print(json.dumps(checks, sort_keys=True))
          PY
          python3 .corpus/scripts/verify_ggen_v26_8_1_migration.py \
            --source-root .baseline-ggen \
            --destination-root .corpus \
            --report /tmp/destination-verifier-report.json

      - name: Remove only admitted source-owned corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          active = [
              Path('docs/v26.8.1'),
              Path('ontology/v26.8.1'),
              Path('planning/v26.8.1'),
              Path('tools/v26.8.1'),
              Path('packs/legacy-equivalence-verifier-pack'),
          ]
          corpus = Path('.corpus')
          manifest = json.loads((corpus/'migrations/ggen-v26.8.1/migration-manifest.json').read_text())

          guard_moves = [
              (Path('tools/v26.8.1/guard_fail_open_subprocess.py'), Path('scripts/ci/guard_fail_open_subprocess.py')),
              (Path('tools/v26.8.1/guard_short_test_timeout.py'), Path('scripts/ci/guard_short_test_timeout.py')),
          ]
          for source, destination in guard_moves:
              if not source.is_file():
                  raise SystemExit(f'GUARD_SOURCE_ABSENT_REFUSED path={source}')
              if destination.exists():
                  raise SystemExit(f'GUARD_DESTINATION_OCCUPIED_REFUSED path={destination}')
              destination.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['git','mv',str(source),str(destination)], check=True)

          workflow_component = next((item for item in manifest['components'] if item['component_id'] == 'GGEN-V26.8.1-SOURCE-WORKFLOW-EVIDENCE'), None)
          if workflow_component is None:
              raise SystemExit('WORKFLOW_LINEAGE_ABSENT_REFUSED')
          lineage = json.loads((corpus/workflow_component['migration_evidence']).read_text())
          workflow_paths = []
          for record in lineage['files']:
              path = Path(record['source_path'])
              if path.parts[:2] != ('.github', 'workflows'):
                  raise SystemExit(f'WORKFLOW_PATH_ESCAPE_REFUSED path={path}')
              workflow_paths.append(path)
              subprocess.run(['git','rm','-f','--ignore-unmatch','--',str(path)], check=True)

          for path in active:
              if not path.exists():
                  raise SystemExit(f'SOURCE_ROOT_ABSENT_REFUSED path={path}')
              subprocess.run(['git','rm','-r','--',str(path)], check=True)
          subprocess.run(['git','rm','-f','--ignore-unmatch','--','.github/workflows/temporary-v26-8-1-corpus-removal.yml'], check=True)

          replacements = {
              'tools/v26.8.1/guard_fail_open_subprocess.py': 'scripts/ci/guard_fail_open_subprocess.py',
              'tools/v26.8.1/guard_short_test_timeout.py': 'scripts/ci/guard_short_test_timeout.py',
          }
          just = Path('justfile')
          text = just.read_text()
          for old, new in replacements.items():
              text = text.replace(old, new)
          lines = text.splitlines(keepends=True)
          out = []
          skipping = False
          recipe = re.compile(r'^([A-Za-z0-9_.-]+)(?:\s+[^:]*)?:')
          assignment = re.compile(r'^[A-Za-z_][A-Za-z0-9_-]*\s*[:?+]?=')
          for line in lines:
              top = bool(line.strip()) and not line[0].isspace()
              match = recipe.match(line) if top else None
              if match and match.group(1).startswith('v26-8-1-'):
                  skipping = True
                  continue
              if skipping and top and (match or assignment.match(line)):
                  skipping = False
              if not skipping:
                  out.append(line)
          text = ''.join(out)
          if re.search(r'(?m)^v26-8-1-[^:]*:', text):
              raise SystemExit('V26_RECIPE_REMAINS_REFUSED')
          just.write_text(text)

          governance = Path('crates/ggen-config/tests/governance_precommit_gate_count_test.rs')
          gtext = governance.read_text()
          for old, new in replacements.items():
              gtext = gtext.replace(old, new)
          governance.write_text(gtext)

          foundry = Path('tools/architecture-foundry/src/bin/admit_observation.rs')
          ftext = foundry.read_text()
          ftext, count_default = re.subn(r'default_value\s*=\s*"docs/v26\.8\.1/document-evidence-index\.json"', 'default_value = "HEAD"', ftext)
          ftext, count_root = re.subn(r'cli\.source\.join\(&cli\.evidence_ref\)', 'cli.corpus.join(&cli.evidence_ref)', ftext)
          if count_default != 1 or count_root != 1:
              raise SystemExit(f'FOUNDRY_PATCH_PRECONDITION_REFUSED default={count_default} root={count_root}')
          foundry.write_text(ftext)

          corpus_head = subprocess.check_output(['git','-C',str(corpus),'rev-parse','HEAD'], text=True).strip()
          config = Path('config/ggen-legacy-corpus.toml')
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text('[corpus]\nrepository = "seanchatmangpt/ggen-legacy"\n' + f'ref = "{corpus_head}"\n' + 'migration = "migrations/ggen-v26.8.1/migration-receipt.json"\ncomposition = "project versioned corpus roots over this ggen kernel checkout"\n')

          roles = Path('docs/architecture-foundry/REPOSITORY_ROLES.md')
          roles.write_text(roles.read_text() + '\n\n## Migrated v26.8.1 corpus\n\nThe versioned reconstruction corpus is owned by `seanchatmangpt/ggen-legacy`; see `config/ggen-legacy-corpus.toml` for the exact admitted coordinate. The generalized manufacturing kernel remains in this repository.\n')

          report = {
              'schema': 'ggen.source-removal-plan/1',
              'source_base': '8351af4c5bbbf60bd99ab8417752a1762c6ea4e3',
              'corpus_head': corpus_head,
              'removed_roots': [str(path) for path in active],
              'removed_workflows': [str(path) for path in sorted(workflow_paths)],
              'retained_kernel_context': ['rustfmt.toml', 'tools/architecture-foundry'],
              'relocated_guards': [{'source': str(a), 'destination': str(b)} for a,b in guard_moves],
              'standing': 'UNKNOWN',
          }
          evidence = Path('evidence/ggen-v26.8.1-source-removal-plan.json')
          evidence.parent.mkdir(parents=True, exist_ok=True)
          evidence.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY

      - name: Commit removal checkpoint
        shell: bash
        run: |
          set -euo pipefail
          printf '/.baseline-ggen\n/.corpus\n' >> .git/info/exclude
          git config user.name 'ggen migration agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git ls-files --stage .baseline-ggen .corpus | grep -q .; then
            echo 'CHECKOUT_STAGED_REFUSED' >&2
            exit 3
          fi
          git commit -m 'refactor(corpus): remove migrated v26.8.1 enterprise corpus'

      - name: Verify source kernel and destination composition
        shell: bash
        run: |
          set -euo pipefail
          for path in docs/v26.8.1 ontology/v26.8.1 planning/v26.8.1 tools/v26.8.1 packs/legacy-equivalence-verifier-pack; do test ! -e "$path"; done
          test -f rustfmt.toml
          cmp scripts/ci/guard_fail_open_subprocess.py .corpus/tools/v26.8.1/guard_fail_open_subprocess.py
          cmp scripts/ci/guard_short_test_timeout.py .corpus/tools/v26.8.1/guard_short_test_timeout.py
          just --list >/tmp/just-list.txt
          cargo test --manifest-path tools/architecture-foundry/Cargo.toml --all-targets
          cargo test -p ggen-config --test governance_precommit_gate_count_test
          if grep -R -n -E 'docs/v26\.8\.1|ontology/v26\.8\.1|planning/v26\.8\.1|tools/v26\.8\.1|packs/legacy-equivalence-verifier-pack' justfile .github/workflows scripts crates tools/architecture-foundry --exclude='*.md' --exclude='*.json' --exclude='*.toml'; then
            echo 'OPERATIONAL_SOURCE_REFERENCE_REMAINS_REFUSED' >&2
            exit 3
          fi
          rm -rf /tmp/ggen-composed
          mkdir -p /tmp/ggen-composed
          rsync -a --exclude .git --exclude .baseline-ggen --exclude .corpus --exclude target ./ /tmp/ggen-composed/
          for path in docs/v26.8.1 ontology/v26.8.1 planning/v26.8.1 tools/v26.8.1 packs/legacy-equivalence-verifier-pack; do
            mkdir -p "/tmp/ggen-composed/$(dirname "$path")"
            cp -a ".corpus/$path" "/tmp/ggen-composed/$path"
          done
          cp .corpus/rustfmt.toml /tmp/ggen-composed/rustfmt.toml
          python3 /tmp/ggen-composed/planning/v26.8.1/verify_planning.py >/tmp/composed-planning.json
          python3 /tmp/ggen-composed/tools/v26.8.1/validate_shacl.py --root /tmp/ggen-composed >/tmp/composed-shacl.txt
          cargo test --manifest-path /tmp/ggen-composed/tools/v26.8.1/Cargo.toml --all-targets

      - name: Manufacture source-removal receipt and publish branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          corpus = Path('.corpus')
          receipt = json.loads((corpus/'migrations/ggen-v26.8.1/migration-receipt.json').read_text())
          subject = {
              'schema': 'ggen.source-removal-receipt/1',
              'source_repository': 'seanchatmangpt/ggen',
              'source_base': '8351af4c5bbbf60bd99ab8417752a1762c6ea4e3',
              'removal_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'corpus_repository': 'seanchatmangpt/ggen-legacy',
              'corpus_head': subprocess.check_output(['git','-C',str(corpus),'rev-parse','HEAD'], text=True).strip(),
              'destination_receipt_run_id': receipt['run_id'],
              'destination_standing': receipt['standing'],
              'composition': 'PASS',
              'kernel_tests': 'PASS',
              'source_roots_absent': True,
              'rustfmt_context_retained': True,
              'replay': 'REPLAY_MATCH',
              'standing': 'PARTIAL_ALIVE',
              'claim_boundary': 'source removal and recomposition only; no repository crown or release claim',
          }
          encoded = (json.dumps(subject, sort_keys=True, separators=(',', ':')) + '\n').encode()
          subject['receipt_sha256'] = hashlib.sha256(encoded).hexdigest()
          path = Path('evidence/ggen-v26.8.1-source-removal-receipt.json')
          path.write_text(json.dumps(subject, indent=2, sort_keys=True) + '\n')
          PY
          git add evidence/ggen-v26.8.1-source-removal-receipt.json evidence/ggen-v26.8.1-source-removal-plan.json
          git commit -m 'chore(corpus): receipt v26.8.1 source removal and recomposition'
          git push origin HEAD:agent/migrate-v26-8-1-corpus-to-ggen-legacy
