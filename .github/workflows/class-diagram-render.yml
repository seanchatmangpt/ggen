name: Class diagram render

on:
  push:
    branches:
      - agent/ggen-class-diagram-renderer
  pull_request:
    paths:
      - scripts/render_class_diagrams.py
      - templates/class-diagram.md.tera
      - .github/workflows/class-diagram-render.yml
      - docs/architecture/class-diagrams/files/**

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Record subject
        run: |
          mkdir -p target/class-diagram-receipt
          git rev-parse HEAD | tee target/class-diagram-receipt/head.sha
          git show -s --format=%T HEAD | tee target/class-diagram-receipt/tree.sha
          python3 --version | tee target/class-diagram-receipt/python.txt

      - name: Render all admitted Rust sources
        run: |
          python3 scripts/render_class_diagrams.py --root . \
            | tee target/class-diagram-receipt/render.json
          python3 scripts/render_class_diagrams.py --root . --check \
            | tee target/class-diagram-receipt/check.json
          find docs/architecture/class-diagrams/files -type f -name '*.md' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > target/class-diagram-receipt/outputs.sha256
          find docs/architecture/class-diagrams/files -type f -name '*.md' \
            | wc -l \
            | tr -d ' ' \
            | tee target/class-diagram-receipt/output-count.txt

      - name: Publish generated projection
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- docs/architecture/class-diagrams/files)" ]; then
            echo unchanged | tee target/class-diagram-receipt/publication.txt
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add docs/architecture/class-diagrams/files
            git commit -m 'docs: render per-source class diagrams'
            git fetch origin agent/ggen-class-diagram-renderer
            git rebase origin/agent/ggen-class-diagram-renderer
            git push origin HEAD:agent/ggen-class-diagram-renderer
            echo published | tee target/class-diagram-receipt/publication.txt
          fi

      - name: Package generated projection
        run: |
          tar -czf target/class-diagrams.tar.gz docs/architecture/class-diagrams/files

      - uses: actions/upload-artifact@v4
        with:
          name: class-diagram-render
          path: |
            target/class-diagrams.tar.gz
            target/class-diagram-receipt
          if-no-files-found: error

  ggen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Record toolchain
        run: |
          mkdir -p target/ggen-receipt
          git rev-parse HEAD | tee target/ggen-receipt/head.sha
          rustc --version | tee target/ggen-receipt/rustc.txt
          cargo --version | tee target/ggen-receipt/cargo.txt
          printf 'RUSTC_WRAPPER=%s\n' "${RUSTC_WRAPPER:-}" | tee target/ggen-receipt/rustc-wrapper.txt

      - name: Build canonical ggen
        run: |
          cargo build -p ggen-cli-lib --bin ggen
          ./target/debug/ggen --version | tee target/ggen-receipt/ggen-version.txt
          ./target/debug/ggen --help > target/ggen-receipt/ggen-help.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ggen-command-surface
          path: target/ggen-receipt
          if-no-files-found: warn
