name: Foundry Clean-Room Semantic Replay

on:
  pull_request:
    paths:
      - "tools/architecture-foundry/src/bin/admit_clean_room.rs"
      - ".github/workflows/foundry-clean-room-semantic-replay.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundry-clean-room-semantic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: ""
      CORPUS_SHA: 86c3ff13f0373cdb0000586a387cdd8554a6c58a
    steps:
      - name: Checkout exact runtime candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          path: ggen

      - name: Checkout exact A-I admitted corpus
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/ggen-legacy
          ref: ${{ env.CORPUS_SHA }}
          fetch-depth: 0
          path: corpus

      - name: Manufacture semantic clean-room theorem
        working-directory: ggen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/architecture-foundry/src/bin/admit_clean_room.rs")
          text = path.read_text()

          old_import = '''    load_program, replay_all_receipts, snapshot_repository, validate_program, verify_corpus,
              Receipt, WorkstreamStateFile, RECEIPT_SCHEMA,
          '''
          new_import = '''    load_program, replay_all_receipts, snapshot_repository, validate_program, verify_corpus,
              Receipt, VerificationReport, WorkstreamStateFile, RECEIPT_SCHEMA,
          '''
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif "Receipt, VerificationReport, WorkstreamStateFile" not in text:
              raise SystemExit("verification report import marker missing")

          old_run = '''    receipts_replayed: usize,
              verification_digest: String,
              foundry_tree_digest: String,
              clean_after_run: bool,
          '''
          new_run = '''    receipts_replayed: usize,
              verification_valid: bool,
              verification_digest: String,
              foundry_tree_digest: String,
              clean_after_run: bool,
          '''
          if old_run in text:
              text = text.replace(old_run, new_run, 1)
          elif "verification_valid: bool" not in text:
              raise SystemExit("clean-room run shape marker missing")

          old_report = '''    clean_room_build_success: bool,
              replay_differences: usize,
              generated_drift: usize,
          '''
          new_report = '''    clean_room_build_success: bool,
              clean_room_verification_success: bool,
              replay_differences: usize,
              generated_drift: usize,
          '''
          if old_report in text:
              text = text.replace(old_report, new_report, 1)
          elif "clean_room_verification_success: bool" not in text:
              raise SystemExit("clean-room report shape marker missing")

          old_compare = '''    let clean_room_build_success = first.runtime_tests_passed && second.runtime_tests_passed;
              let replay_differences = usize::from(first.verification_digest != second.verification_digest);
              let generated_drift = usize::from(first.foundry_tree_digest != second.foundry_tree_digest);
          '''
          new_compare = '''    let clean_room_build_success = first.runtime_tests_passed && second.runtime_tests_passed;
              let clean_room_verification_success = first.verification_valid && second.verification_valid;
              let replay_differences = usize::from(first.verification_digest != second.verification_digest);
              let generated_drift = usize::from(first.foundry_tree_digest != second.foundry_tree_digest);
          '''
          if old_compare in text:
              text = text.replace(old_compare, new_compare, 1)
          elif "let clean_room_verification_success" not in text:
              raise SystemExit("clean-room comparison marker missing")

          old_refusal = '''    if !clean_room_build_success || replay_differences != 0 || generated_drift != 0 {
              bail!(
                  "CLEAN_ROOM_REFUSED: build={clean_room_build_success}, replay={replay_differences}, drift={generated_drift}"
              );
          }
          '''
          new_refusal = '''    if !clean_room_build_success
              || !clean_room_verification_success
              || replay_differences != 0
              || generated_drift != 0
          {
              bail!(
                  "CLEAN_ROOM_REFUSED: build={clean_room_build_success}, verification={clean_room_verification_success}, replay={replay_differences}, drift={generated_drift}"
              );
          }
          '''
          if old_refusal in text:
              text = text.replace(old_refusal, new_refusal, 1)
          elif "verification={clean_room_verification_success}" not in text:
              raise SystemExit("clean-room refusal marker missing")

          old_report_init = '''        clean_room_build_success,
                  replay_differences,
                  generated_drift,
          '''
          new_report_init = '''        clean_room_build_success,
                  clean_room_verification_success,
                  replay_differences,
                  generated_drift,
          '''
          if old_report_init in text:
              text = text.replace(old_report_init, new_report_init, 1)
          elif "clean_room_verification_success," not in text:
              raise SystemExit("clean-room report initializer marker missing")

          old_verify = '''    let verification = verify_corpus(program, &source_clone, &corpus_clone)?;
              let verification_digest = digest_bytes(&serde_json::to_vec(&verification)?);
              let foundry_tree_digest = digest_tree(&corpus_clone.join("foundry"))?;
          '''
          new_verify = '''    let verification = verify_corpus(program, &source_clone, &corpus_clone)?;
              let verification_valid = verification.program_valid
                  && verification.manifest_valid
                  && verification.invalid_lineage_records.is_empty()
                  && verification.invalid_receipts.is_empty();
              let verification_digest = semantic_verification_digest(
                  &verification,
                  &source_clone,
                  &corpus_clone,
              )?;
              let foundry_tree_digest = digest_tree(&corpus_clone.join("foundry"))?;
          '''
          if old_verify in text:
              text = text.replace(old_verify, new_verify, 1)
          elif "semantic_verification_digest(" not in text:
              raise SystemExit("verification digest marker missing")

          old_run_refusal = '''    if !runtime_tests_passed || !clean_after_run {
              bail!(
                  "CLEAN_ROOM_RUN_FAILED: run={run}, tests={runtime_tests_passed}, clean={clean_after_run}"
              );
          }
          '''
          new_run_refusal = '''    if !runtime_tests_passed || !verification_valid || !clean_after_run {
              bail!(
                  "CLEAN_ROOM_RUN_FAILED: run={run}, tests={runtime_tests_passed}, verification={verification_valid}, invalid_lineage={}, invalid_receipts={}, clean={clean_after_run}",
                  verification.invalid_lineage_records.len(),
                  verification.invalid_receipts.len(),
              );
          }
          '''
          if old_run_refusal in text:
              text = text.replace(old_run_refusal, new_run_refusal, 1)
          elif "invalid_lineage={}" not in text:
              raise SystemExit("clean-room run refusal marker missing")

          old_run_init = '''        receipts_replayed,
                  verification_digest,
                  foundry_tree_digest,
          '''
          new_run_init = '''        receipts_replayed,
                  verification_valid,
                  verification_digest,
                  foundry_tree_digest,
          '''
          if old_run_init in text:
              text = text.replace(old_run_init, new_run_init, 1)
          elif "verification_valid," not in text:
              raise SystemExit("clean-room run initializer marker missing")

          marker = "fn git_clone(source: &Path, destination: &Path) -> Result<()> {"
          helper = '''fn semantic_verification_digest(
              report: &VerificationReport,
              source_root: &Path,
              corpus_root: &Path,
          ) -> Result<String> {
              let mut value = serde_json::to_value(report)?;
              normalize_verification_paths(&mut value, source_root, corpus_root);
              Ok(digest_bytes(&serde_json::to_vec(&value)?))
          }

          fn normalize_verification_paths(value: &mut JsonValue, source_root: &Path, corpus_root: &Path) {
              match value {
                  JsonValue::String(text) => {
                      let source = source_root.to_string_lossy();
                      let corpus = corpus_root.to_string_lossy();
                      *text = text.replace(source.as_ref(), "$SOURCE");
                      *text = text.replace(corpus.as_ref(), "$CORPUS");
                  }
                  JsonValue::Array(values) => {
                      for value in values {
                          normalize_verification_paths(value, source_root, corpus_root);
                      }
                  }
                  JsonValue::Object(values) => {
                      for value in values.values_mut() {
                          normalize_verification_paths(value, source_root, corpus_root);
                      }
                  }
                  _ => {}
              }
          }

          '''
          if marker in text and "fn semantic_verification_digest(" not in text:
              text = text.replace(marker, helper + marker, 1)
          elif "fn semantic_verification_digest(" not in text:
              raise SystemExit("semantic digest insertion marker missing")

          path.write_text(text)
          PY
          cargo fmt --manifest-path tools/architecture-foundry/Cargo.toml --all
          git config user.name "ggen-foundry-controller"
          git config user.email "ggen-foundry-controller@users.noreply.github.com"
          git add tools/architecture-foundry/src/bin/admit_clean_room.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix(foundry): compare clean-room verifier semantics"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove complete runtime suite
        working-directory: ggen
        run: |
          cargo fmt --manifest-path tools/architecture-foundry/Cargo.toml --all -- --check
          cargo test --manifest-path tools/architecture-foundry/Cargo.toml --all-targets
          cargo build --manifest-path tools/architecture-foundry/Cargo.toml --bin admit_clean_room

      - name: Execute J against exact A-I corpus
        run: |
          test "$(git -C corpus rev-parse HEAD)" = "$CORPUS_SHA"
          test -z "$(git -C corpus status --porcelain=v1 --untracked-files=all)"
          set +e
          ggen/tools/architecture-foundry/target/debug/admit_clean_room \
            --program ggen/docs/architecture-foundry/work-program.yaml \
            --source ggen \
            --corpus corpus \
            > "$RUNNER_TEMP/j-report.json" \
            2> "$RUNNER_TEMP/j-stderr.log"
          status=$?
          set -e
          cat "$RUNNER_TEMP/j-stderr.log"
          cat "$RUNNER_TEMP/j-report.json"
          test "$status" -eq 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("${{ runner.temp }}/j-report.json").read_text())
          assert report["clean_room_build_success"] is True, report
          assert report["clean_room_verification_success"] is True, report
          assert report["replay_differences"] == 0, report
          assert report["generated_drift"] == 0, report
          assert report["second_run_semantic_result"] == "NO_SEMANTIC_CHANGE", report
          state = json.loads(Path("corpus/foundry/workstreams/state.json").read_text())
          assert state["workstreams"]["J"]["status"] == "ADMITTED"
          assert state["workstreams"]["K"]["status"] == "READY"
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Replay J receipt on exact consequence
        run: |
          git -C corpus config user.name foundry-verifier
          git -C corpus config user.email foundry-verifier@example.invalid
          git -C corpus add foundry
          git -C corpus commit --quiet -m "proof: admit workstream J"
          ggen/tools/architecture-foundry/target/debug/ggen-foundry replay \
            --source ggen --corpus corpus

      - name: Publish verified runtime theorem
        working-directory: ggen
        run: git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"

      - name: Publish exact J evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundry-clean-room-semantic-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/j-report.json
            ${{ runner.temp }}/j-stderr.log
            corpus/foundry/workstreams/J/admission-report.json
            corpus/foundry/receipts/workstream-J.json
            corpus/foundry/workstreams/state.json
          if-no-files-found: warn
