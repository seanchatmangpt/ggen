name: GitHub Package Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/actions/setup-ggen/**'
      - '.github/workflows/package-contract.yml'
      - '.github/workflows/publish-packages.yml'
      - 'packaging/github/**'
      - 'scripts/github-package-manifest.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Release package contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact subject
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Static package machinery court
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/github-package-manifest.py
          sh -n packaging/github/bootstrap.sh
          ruby -e "require 'yaml'; YAML.load_file('.github/actions/setup-ggen/action.yml'); YAML.load_file('.github/workflows/publish-packages.yml')"

      - name: Exercise deterministic release manifest and digest refusal
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/package-contract"
          mkdir -p "$root/release"
          for target in x86_64 aarch64; do
            name="ggen-${target}-unknown-linux-gnu.tar.gz"
            printf 'fixture-%s\n' "$target" > "$root/release/$name"
            (cd "$root/release" && sha256sum "$name" > "$name.sha256")
          done
          python3 scripts/github-package-manifest.py --tag v1.2.3 --release-commit 0123456789abcdef0123456789abcdef01234567 --release-dir "$root/release" --output "$root/a.json"
          python3 scripts/github-package-manifest.py --tag v1.2.3 --release-commit 0123456789abcdef0123456789abcdef01234567 --release-dir "$root/release" --output "$root/b.json"
          cmp "$root/a.json" "$root/b.json"
          printf '%064d  ggen-x86_64-unknown-linux-gnu.tar.gz\n' 0 > "$root/release/ggen-x86_64-unknown-linux-gnu.tar.gz.sha256"
          if python3 scripts/github-package-manifest.py --tag v1.2.3 --release-commit 0123456789abcdef0123456789abcdef01234567 --release-dir "$root/release" --output "$root/refused.json"; then
            echo 'REFUSED:DIGEST_DRIFT_WAS_ACCEPTED' >&2
            exit 2
          fi
