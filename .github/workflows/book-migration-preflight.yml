name: Book Migration Preflight

on:
  pull_request:
    paths:
      - 'book/scripts/**'
      - 'book/src/**'
      - 'packs/level-five-book-pack/**'
      - '.github/workflows/book-migration-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    name: Complete book source-law migration preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/post-agi-docs-core-team
          fetch-depth: 1

      - name: Run complete migration without publication
        run: |
          set -euo pipefail
          python3 book/scripts/migrate_full_book_to_aligned_pack_law.py
          python3 book/scripts/check_book.py
