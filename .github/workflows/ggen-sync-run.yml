name: GGen Sync Run

on:
  workflow_call:
    inputs:
      ggen_release:
        description: Exact ggen release tag to execute, for example v26.8.27.
        required: true
        type: string
      ggen_asset_sha256:
        description: Expected SHA-256 of ggen-x86_64-unknown-linux-gnu.tar.gz.
        required: true
        type: string
      working_directory:
        description: Repository-relative directory containing ggen.toml.
        required: false
        default: .
        type: string
      dry_run:
        description: Execute ggen sync run --dry-run instead of writing projections.
        required: false
        default: false
        type: boolean
      artifact_retention_days:
        description: Retention for the replay/evidence artifact.
        required: false
        default: 30
        type: number
    outputs:
      changed:
        description: Whether ggen sync run changed the checked-out worktree.
        value: ${{ jobs.sync.outputs.changed }}
      sync_exit_code:
        description: Exit code returned by ggen sync run.
        value: ${{ jobs.sync.outputs.sync_exit_code }}
      ggen_binary_sha256:
        description: SHA-256 of the exact ggen executable used.
        value: ${{ jobs.sync.outputs.ggen_binary_sha256 }}
      receipt_sha256:
        description: SHA-256 of the GitHub execution receipt.
        value: ${{ jobs.sync.outputs.receipt_sha256 }}
  workflow_dispatch:
    inputs:
      ggen_release:
        description: Exact ggen release tag to execute, for example v26.8.27.
        required: true
        type: string
      ggen_asset_sha256:
        description: Expected SHA-256 of ggen-x86_64-unknown-linux-gnu.tar.gz.
        required: true
        type: string
      working_directory:
        description: Repository-relative directory containing ggen.toml.
        required: false
        default: .
        type: string
      dry_run:
        description: Execute ggen sync run --dry-run instead of writing projections.
        required: false
        default: false
        type: boolean
      artifact_retention_days:
        description: Retention for the replay/evidence artifact.
        required: false
        default: 30
        type: number

permissions:
  contents: read

concurrency:
  group: ggen-sync-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}
  cancel-in-progress: false

jobs:
  sync:
    name: Deterministic manufacture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.evidence.outputs.changed }}
      sync_exit_code: ${{ steps.run.outputs.exit_code }}
      ggen_binary_sha256: ${{ steps.install.outputs.binary_sha256 }}
      receipt_sha256: ${{ steps.evidence.outputs.receipt_sha256 }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Admit immutable inputs
        env:
          GGEN_RELEASE: ${{ inputs.ggen_release }}
          GGEN_ASSET_SHA256: ${{ inputs.ggen_asset_sha256 }}
          GGEN_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import PurePosixPath

          release = os.environ["GGEN_RELEASE"]
          digest = os.environ["GGEN_ASSET_SHA256"].lower()
          workdir = os.environ["GGEN_WORKING_DIRECTORY"]

          if not re.fullmatch(r"v[0-9][0-9A-Za-z.+-]*", release):
              raise SystemExit("REFUSED_GGEN_RELEASE: ggen_release must be an explicit release tag")
          if not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("REFUSED_GGEN_DIGEST: ggen_asset_sha256 must be exactly 64 hex characters")

          path = PurePosixPath(workdir)
          if path.is_absolute() or ".." in path.parts:
              raise SystemExit("REFUSED_WORKDIR: working_directory must remain inside the checkout")
          PY

          test -d "$GGEN_WORKING_DIRECTORY" || {
            echo "REFUSED_WORKDIR: directory does not exist: $GGEN_WORKING_DIRECTORY" >&2
            exit 1
          }
          test -f "$GGEN_WORKING_DIRECTORY/ggen.toml" || {
            echo "REFUSED_MANIFEST: missing $GGEN_WORKING_DIRECTORY/ggen.toml" >&2
            exit 1
          }

      - name: Install exact ggen release asset
        id: install
        env:
          GGEN_RELEASE: ${{ inputs.ggen_release }}
          GGEN_ASSET_SHA256: ${{ inputs.ggen_asset_sha256 }}
        run: |
          set -euo pipefail
          asset="ggen-x86_64-unknown-linux-gnu.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          extract="$RUNNER_TEMP/ggen-release"
          bin_dir="$RUNNER_TEMP/ggen-bin"
          url="https://github.com/seanchatmangpt/ggen/releases/download/${GGEN_RELEASE}/${asset}"

          curl --fail --location --retry 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 \
            --output "$archive" "$url"

          printf '%s  %s\n' "$GGEN_ASSET_SHA256" "$archive" | sha256sum --check --strict

          mkdir -p "$extract" "$bin_dir"
          tar -xzf "$archive" -C "$extract"
          mapfile -t candidates < <(find "$extract" -type f -name ggen -print)
          if [[ "${#candidates[@]}" -ne 1 ]]; then
            echo "REFUSED_GGEN_ASSET: expected exactly one ggen binary, found ${#candidates[@]}" >&2
            exit 1
          fi

          install -m 0755 "${candidates[0]}" "$bin_dir/ggen"
          binary_sha256="$(sha256sum "$bin_dir/ggen" | awk '{print $1}')"
          echo "$bin_dir" >> "$GITHUB_PATH"
          echo "binary_sha256=$binary_sha256" >> "$GITHUB_OUTPUT"

      - name: Admit only exact ggen-marketplace Git packs
        env:
          GGEN_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/ggen-sync-receipt"
          mkdir -p "$receipt_dir"
          export GGEN_PACK_RECEIPT="$receipt_dir/packs.json"

          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path, PurePosixPath

          root = Path(os.environ["GGEN_WORKING_DIRECTORY"])
          with (root / "ggen.toml").open("rb") as handle:
              manifest = tomllib.load(handle)

          packs = manifest.get("packs")
          if not isinstance(packs, dict) or not packs:
              raise SystemExit(
                  "REFUSED_PACK_POLICY: ggen.toml must declare at least one [packs] entry"
              )

          admitted = []
          expected_git = "https://github.com/seanchatmangpt/ggen-marketplace.git"
          for alias, ref in sorted(packs.items()):
              if not isinstance(ref, dict):
                  raise SystemExit(f"REFUSED_PACK_POLICY: pack {alias!r} is not a structured Git reference")
              if ref.get("git") != expected_git:
                  raise SystemExit(
                      f"REFUSED_PACK_SOURCE: pack {alias!r} must come from {expected_git}"
                  )

              version = ref.get("version", "")
              if not isinstance(version, str) or not re.fullmatch(r"[0-9a-fA-F]{40}", version):
                  raise SystemExit(
                      f"REFUSED_PACK_PIN: pack {alias!r} version must be an exact 40-hex commit SHA"
                  )

              subdir = ref.get("subdir", "")
              subdir_path = PurePosixPath(subdir) if isinstance(subdir, str) else None
              if (
                  subdir_path is None
                  or subdir_path.is_absolute()
                  or ".." in subdir_path.parts
                  or len(subdir_path.parts) < 2
                  or subdir_path.parts[0] != "packs"
              ):
                  raise SystemExit(
                      f"REFUSED_PACK_SUBDIR: pack {alias!r} subdir must be a relative packs/<name> path"
                  )

              admitted.append(
                  {
                      "alias": alias,
                      "git": expected_git,
                      "version": version.lower(),
                      "subdir": subdir,
                  }
              )

          Path(os.environ["GGEN_PACK_RECEIPT"]).write_text(
              json.dumps(admitted, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Execute ggen sync run
        id: run
        env:
          GGEN_WORKING_DIRECTORY: ${{ inputs.working_directory }}
          GGEN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/ggen-sync-receipt"
          mkdir -p "$receipt_dir"

          set +e
          if [[ "$GGEN_DRY_RUN" == "true" ]]; then
            (
              cd "$GGEN_WORKING_DIRECTORY"
              ggen sync run --dry-run
            ) > >(tee "$receipt_dir/stdout.log") 2> >(tee "$receipt_dir/stderr.log" >&2)
          else
            (
              cd "$GGEN_WORKING_DIRECTORY"
              ggen sync run
            ) > >(tee "$receipt_dir/stdout.log") 2> >(tee "$receipt_dir/stderr.log" >&2)
          fi
          exit_code=$?
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$exit_code" > "$receipt_dir/sync-exit-code.txt"

      - name: Manufacture replay receipt
        id: evidence
        if: always()
        env:
          GGEN_RELEASE: ${{ inputs.ggen_release }}
          GGEN_ASSET_SHA256: ${{ inputs.ggen_asset_sha256 }}
          GGEN_WORKING_DIRECTORY: ${{ inputs.working_directory }}
          GGEN_DRY_RUN: ${{ inputs.dry_run }}
          GGEN_BINARY_SHA256: ${{ steps.install.outputs.binary_sha256 }}
          SYNC_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/ggen-sync-receipt"
          mkdir -p "$receipt_dir"

          git status --porcelain=v1 --untracked-files=all > "$receipt_dir/git-status.txt"
          git diff --binary --no-ext-diff > "$receipt_dir/tracked.patch"
          git diff --stat --no-ext-diff > "$receipt_dir/diff-stat.txt"

          if [[ -s "$receipt_dir/git-status.txt" ]]; then
            changed=true
          else
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          if [[ -f "$GGEN_WORKING_DIRECTORY/ggen.lock" ]]; then
            cp "$GGEN_WORKING_DIRECTORY/ggen.lock" "$receipt_dir/ggen.lock"
          fi
          if [[ -f "$GGEN_WORKING_DIRECTORY/.ggen/receipts/latest.json" ]]; then
            cp "$GGEN_WORKING_DIRECTORY/.ggen/receipts/latest.json" "$receipt_dir/ggen-receipt.json"
          fi

          python3 - <<'PY'
          import os
          import subprocess
          import tarfile
          from pathlib import Path

          receipt_dir = Path(os.environ["RUNNER_TEMP"]) / "ggen-sync-receipt"
          raw = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard", "-z"]
          )
          paths = [Path(p.decode()) for p in raw.split(b"\0") if p]
          paths = [p for p in paths if ".ggen-v2" not in p.parts]
          with tarfile.open(receipt_dir / "untracked-output.tar.gz", "w:gz") as tar:
              for path in sorted(paths, key=lambda p: p.as_posix()):
                  if path.exists():
                      tar.add(path, arcname=path.as_posix(), recursive=False)
          PY

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg release "$GGEN_RELEASE" \
            --arg release_asset_sha256 "$GGEN_ASSET_SHA256" \
            --arg binary_sha256 "$GGEN_BINARY_SHA256" \
            --arg working_directory "$GGEN_WORKING_DIRECTORY" \
            --arg dry_run "$GGEN_DRY_RUN" \
            --arg sync_exit_code "${SYNC_EXIT_CODE:-not-run}" \
            --arg changed "$changed" \
            --slurpfile packs "$receipt_dir/packs.json" \
            '{
              repository: $repository,
              source_sha: $source_sha,
              workflow_ref: $workflow_ref,
              run_id: $run_id,
              run_attempt: $run_attempt,
              ggen: {
                release: $release,
                release_asset_sha256: $release_asset_sha256,
                binary_sha256: $binary_sha256
              },
              working_directory: $working_directory,
              dry_run: ($dry_run == "true"),
              packs: ($packs[0] // []),
              sync_exit_code: $sync_exit_code,
              changed: ($changed == "true")
            }' > "$receipt_dir/github-sync-receipt.json"

          receipt_sha256="$(sha256sum "$receipt_dir/github-sync-receipt.json" | awk '{print $1}')"
          echo "receipt_sha256=$receipt_sha256" >> "$GITHUB_OUTPUT"

          {
            echo "## GGen sync receipt"
            echo
            echo "- source: \`$GITHUB_REPOSITORY@$GITHUB_SHA\`"
            echo "- ggen release: \`$GGEN_RELEASE\`"
            echo "- ggen binary SHA-256: \`$GGEN_BINARY_SHA256\`"
            echo "- changed: \`$changed\`"
            echo "- sync exit: \`${SYNC_EXIT_CODE:-not-run}\`"
            echo "- receipt SHA-256: \`$receipt_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deterministic replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ggen-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ggen-sync-receipt
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Enforce ggen sync standing
        if: always()
        env:
          SYNC_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [[ "${SYNC_EXIT_CODE:-not-run}" != "0" ]]; then
            echo "ggen sync run did not reach ALIVE; exit=${SYNC_EXIT_CODE:-not-run}" >&2
            exit 1
          fi
