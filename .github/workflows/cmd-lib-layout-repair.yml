name: CMD library layout repair

on:
  push:
    branches:
      - agent/combinatorial-maximalism-pack
    paths:
      - '.github/workflows/cmd-lib-layout-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/combinatorial-maximalism-pack
          fetch-depth: 0
      - name: Apply rustfmt-stable template layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packs/ggen-combinatorial-maximalism-pack/templates/lib.rs.tmpl')
          text = path.read_text()
          replacements = [
              ('};\n{% endfor %}\n\n{% for d in design %}const DESIGN:',
               '};{% endfor %}\n\n{% for d in design %}const DESIGN:'),
              ('};\n{% endfor %}\n\n#[derive(Debug)]',
               '};{% endfor %}\n\n#[derive(Debug)]'),
              ('        return refuse("INSUFFICIENT_DIMENSIONS", DESIGN.dimensions.len().to_string());',
               '        return refuse(\n            "INSUFFICIENT_DIMENSIONS",\n            DESIGN.dimensions.len().to_string(),\n        );'),
              ('        return refuse("CANDIDATE_BOUND_VIOLATION", DESIGN.candidates.len().to_string());',
               '        return refuse(\n            "CANDIDATE_BOUND_VIOLATION",\n            DESIGN.candidates.len().to_string(),\n        );'),
              ('            format!("{} != {}", DESIGN.candidates.len(), DESIGN.expected_candidates),',
               '            format!(\n                "{} != {}",\n                DESIGN.candidates.len(),\n                DESIGN.expected_candidates\n            ),'),
              ('            let expected = options_by_dimension.values().try_fold(1usize, |total, options| {\n                total\n                    .checked_mul(options.len())\n                    .ok_or_else(|| CmdError::new("COMBINATION_COUNT_OVERFLOW", DESIGN.title))\n            })?;',
               '            let expected = options_by_dimension\n                .values()\n                .try_fold(1usize, |total, options| {\n                    total\n                        .checked_mul(options.len())\n                        .ok_or_else(|| CmdError::new("COMBINATION_COUNT_OVERFLOW", DESIGN.title))\n                })?;'),
              ('            return refuse("RECEIPT_SUBJECT_MISMATCH", receipt_path.display().to_string());',
               '            return refuse(\n                "RECEIPT_SUBJECT_MISMATCH",\n                receipt_path.display().to_string(),\n            );'),
              ('        let output = transaction.join(safe_relative(\n            &envelope.receipt.output_relative_path,\n        )?);',
               '        let output = transaction.join(safe_relative(&envelope.receipt.output_relative_path)?);'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'CMD_LIB_LAYOUT_SOURCE_MISMATCH:{old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/cmd-lib-layout-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packs/ggen-combinatorial-maximalism-pack/templates/lib.rs.tmpl .github/workflows/cmd-lib-layout-repair.yml
          git commit -m 'fix(cmd): render rustfmt-stable library layout'
          git push origin HEAD:agent/combinatorial-maximalism-pack
