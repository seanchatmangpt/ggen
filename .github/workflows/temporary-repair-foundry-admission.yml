name: Temporary repair foundry migration admission

on:
  push:
    branches: [agent/migrate-v26-8-1-corpus-to-ggen-legacy]

permissions:
  contents: write

concurrency:
  group: repair-foundry-migration-admission
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source-removal branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/migrate-v26-8-1-corpus-to-ggen-legacy
          fetch-depth: 0

      - name: Replace obsolete rewrite with semantic admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/temporary-v26-8-1-corpus-removal.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          foundry = Path('tools/architecture-foundry/src/bin/admit_observation.rs')
          ftext = foundry.read_text()
          ftext, count_default = re.subn(r'default_value\\s*=\\s*"docs/v26\\.8\\.1/document-evidence-index\\.json"', 'default_value = "HEAD"', ftext)
          ftext, count_root = re.subn(r'cli\\.source\\.join\\(&cli\\.evidence_ref\\)', 'cli.corpus.join(&cli.evidence_ref)', ftext)
          if count_default != 1 or count_root != 1:
              raise SystemExit(f'FOUNDRY_PATCH_PRECONDITION_REFUSED default={count_default} root={count_root}')
          foundry.write_text(ftext)
'''
          new = '''          foundry = Path('tools/architecture-foundry/src/bin/admit_observation.rs')
          ftext = foundry.read_text()
          required_foundry_semantics = (
              'let corpus = snapshot_repository(&cli.corpus)?;',
              'let foundry_root = cli.corpus.join("foundry");',
          )
          missing_foundry_semantics = [
              semantic for semantic in required_foundry_semantics if semantic not in ftext
          ]
          if missing_foundry_semantics:
              raise SystemExit(
                  f'FOUNDRY_CORPUS_BOUNDARY_REFUSED missing={missing_foundry_semantics}'
              )
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'FOUNDRY_ADMISSION_PATCH_PRECONDITION_REFUSED count={count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/temporary-repair-foundry-admission.yml .migration-foundry-repair-trigger
          git config user.name 'ggen migration agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(migration): admit existing foundry corpus boundary'
          git push origin HEAD:agent/migrate-v26-8-1-corpus-to-ggen-legacy
