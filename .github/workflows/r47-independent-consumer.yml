name: R47 Independent Consumer Court

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: r47-consumer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact consumer subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Checkout exact producer evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seanchatmangpt/ggen-marketplace
          ref: b942ff54f7d00e376dd2f28beb930390f4feb97b
          path: _r47_producer
          persist-credentials: false
      - name: Run consumer falsifiers
        run: python3 verification/r47-consumer/test_verify.py
      - name: Qualify independent consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r47"
          python3 verification/r47-consumer/verify.py \
            --repo "$GITHUB_REPOSITORY" \
            --candidate-sha "$GITHUB_SHA" \
            --producer-fixture "_r47_producer/packs/epistemic-sensor-factory-pack/fixtures/r46-live-replication.ttl" \
            --receipt "$RUNNER_TEMP/r47/receipt.json"
          python3 -m json.tool "$RUNNER_TEMP/r47/receipt.json" >/dev/null
      - name: Refuse source mutation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Preserve qualification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r47-ggen-consumer-receipt
          path: ${{ runner.temp }}/r47/receipt.json
          retention-days: 14
