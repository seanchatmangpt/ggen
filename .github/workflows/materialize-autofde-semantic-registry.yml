name: Materialize AutoFDE semantic registry

on:
  push:
    branches:
      - agent/autofde-semantic-registry
    paths:
      - ".agent-input/autofde-semantic-registry.part*.b64"
      - ".github/workflows/materialize-autofde-semantic-registry.yml"

permissions:
  contents: write

concurrency:
  group: autofde-semantic-registry-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct admitted source capsule
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-input/autofde-semantic-registry.part*.b64 \
            | base64 --decode \
            > /tmp/autofde-semantic-registry.tar.gz
          observed="$(sha256sum /tmp/autofde-semantic-registry.tar.gz | cut -d' ' -f1)"
          test "$observed" = "cc8429156526b5090dabf9e90133bb58c7a8ef2a0c9446cb330c1a3224cc73c7"
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          archive = "/tmp/autofde-semantic-registry.tar.gz"
          with tarfile.open(archive, "r:gz") as tf:
              for member in tf.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"REFUSED: unsafe archive member {member.name!r}")
              tf.extractall(".")
          PY

      - name: Build deterministic ontology aggregate
        shell: bash
        run: |
          set -euo pipefail
          python3 packs/autofde-semantic-registry-pack/gates/build_aggregate.py

      - name: Install pinned verifier dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input "rdflib==7.5.0" "PyYAML==6.0.3"

      - name: Verify exact materialized subject
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            packs/autofde-semantic-registry-pack/gates/build_aggregate.py \
            packs/autofde-semantic-registry-pack/gates/verify_registry.py
          python3 packs/autofde-semantic-registry-pack/gates/build_aggregate.py --check
          python3 packs/autofde-semantic-registry-pack/gates/verify_registry.py \
            --receipt /tmp/autofde-semantic-registry-receipt.json
          cat /tmp/autofde-semantic-registry-receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish expanded pack
        shell: bash
        run: |
          set -euo pipefail
          rm -f .agent-input/autofde-semantic-registry.part*.b64
          rmdir .agent-input
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && {
            echo "REFUSED: materialization produced no diff" >&2
            exit 2
          }
          git commit -m "add AutoFDE federated semantic registry [skip ci]"
          git push origin HEAD:agent/autofde-semantic-registry
