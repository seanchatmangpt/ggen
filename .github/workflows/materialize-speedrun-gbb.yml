name: Materialize Speedrun GBB

on:
  push:
    branches:
      - agent/gbb-speedrun-talent-network
  pull_request:
    branches:
      - agent/ggen-v26.7.30-consolidated

permissions:
  contents: write

concurrency:
  group: materialize-speedrun-gbb
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'pull_request' || github.event.head_commit.message != 'feat(architecture): add Speedrun Talent Network building block'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/gbb-speedrun-talent-network
          fetch-depth: 0

      - name: Provision pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: materialize-speedrun-gbb

      - name: Materialize digest-bound source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .github/speedrun-gbb/payload-*.b64 >/tmp/speedrun-gbb.b64
          base64 --decode /tmp/speedrun-gbb.b64 >/tmp/speedrun-gbb.tar.gz
          printf '%s  %s\n' 'df3197edc4c05fbbfd1d418fba4e1b3c795c41176a140bc4a0b401ff69141b18' '/tmp/speedrun-gbb.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/speedrun-gbb.tar.gz --directory "$GITHUB_WORKSPACE"
          rm -rf .github/speedrun-gbb
          rm .github/workflows/materialize-speedrun-gbb.yml

      - name: Normalize and execute narrow verifier
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/ggen-architecture/Cargo.toml --all
          cargo fmt --manifest-path crates/ggen-architecture/Cargo.toml --all -- --check
          cargo test --manifest-path crates/ggen-architecture/Cargo.toml --workspace --all-targets speedrun_talent
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          for path in Path('packs/speedrun-talent-network-pack').rglob('*.toml'):
              tomllib.loads(path.read_text())
          print('SPEEDRUN_GBB_SOURCE rest=8 mcp=10 resources=3')
          PY

      - name: Commit exact bounded tree
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test -n "$changed"
          unexpected="$(git status --short | awk '{print $2}' | grep -vE '^(crates/ggen-architecture/src/(canonical|speedrun_talent)\.rs|packs/speedrun-talent-network-pack/|docs/architecture/SPEEDRUN_TALENT_NETWORK_GBB\.md|\.github/speedrun-gbb/|\.github/workflows/(speedrun-talent-network-gbb|materialize-speedrun-gbb)\.yml)' || true)"
          test -z "$unexpected"
          git config user.name 'ggen architecture manufacturer'
          git config user.email 'ggen-architecture@users.noreply.github.com'
          git add -A
          git commit -m 'feat(architecture): add Speedrun Talent Network building block'
          git push origin HEAD:agent/gbb-speedrun-talent-network
