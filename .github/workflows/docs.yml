# The previous file was a write-enabled one-off mutator hard-coded to PR #501.
# It is retired from ambient pull-request execution. The governed replacement
# is .github/workflows/frontmatter-best-practices.yml.
name: Docs Historical Mutation Refusal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refused:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse obsolete duplicate mutator
        run: |
          echo 'REFUSED:OBSOLETE_ONE_OFF_MUTATION'
          echo 'Use .github/workflows/frontmatter-best-practices.yml for the governed capability.'
          exit 1
