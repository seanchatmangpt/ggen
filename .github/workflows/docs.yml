name: Docs

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: frontmatter-best-practices-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontmatter-best-practices:
    if: github.event.pull_request.number == 501 && github.head_ref == 'agent/frontmatter-maximalism'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Provision siblings and pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          components: rustfmt
          cache-key-suffix: frontmatter-best-practices

      - name: Apply semantic and pre-actuation best practices
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/frontmatter-best-practices.yml').read_text()
          embedded = source.split("python3 <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          script = script.replace(
              '.as_deref().is_none_or(|v| v.trim().is_empty())',
              '.as_deref().map_or(true, |v| v.trim().is_empty())',
          )
          script = script.replace(
              'hook.is_some_and(|value| value.trim().is_empty())',
              'hook.map_or(false, |value| value.trim().is_empty())',
          )
          exec(compile(script, '<frontmatter-best-practices>', 'exec'))
          PY

          cargo fmt --all
          git diff --check

      - name: Execute frontmatter falsifiers
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p ggen-engine --lib template::tests -- --nocapture
          cargo test -p ggen-engine --lib write::tests -- --nocapture
          cargo test -p ggen-engine --lib lint::tests -- --nocapture
          cargo test -p ggen-engine --test frontmatter_best_practices_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_lint_best_practices -- --nocapture
          cargo test -p ggen-engine --test frontmatter_fortune5_hardening_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_cardinality_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_matchers_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_maximalism_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_schema_match -- --nocapture

      - name: Publish verified best practices and restore workflows
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/docs.yml
          rm .github/workflows/frontmatter-best-practices.yml
          rm docs/.frontmatter-best-practices-trigger
          git diff --check
          git config user.name "ggen frontmatter best practices"
          git config user.email "actions@github.com"
          git add crates/ggen-engine/src/template.rs \
                  crates/ggen-engine/src/sync.rs \
                  crates/ggen-engine/src/write.rs \
                  crates/ggen-engine/src/lint.rs \
                  crates/ggen-engine/schema/frontmatter-schema.ttl \
                  crates/ggen-engine/tests/frontmatter_best_practices_e2e.rs \
                  crates/ggen-engine/tests/frontmatter_lint_best_practices.rs \
                  docs/reference/frontmatter-maximalism.md \
                  docs/reference/template-directives.md \
                  docs/.frontmatter-best-practices-trigger \
                  .github/workflows/docs.yml \
                  .github/workflows/frontmatter-best-practices.yml
          git commit -m "feat(engine): enforce frontmatter best practices"
          git push origin HEAD:agent/frontmatter-maximalism
