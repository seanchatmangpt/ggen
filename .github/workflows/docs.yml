name: Docs

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: fortune5-frontmatter-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fortune5-frontmatter-hardening:
    if: github.event.pull_request.number == 501 && github.head_ref == 'agent/frontmatter-maximalism'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Provision siblings and pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          components: rustfmt
          cache-key-suffix: fortune5-frontmatter-hardening

      - name: Execute canonical hardening program
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          source = Path('.github/workflows/fortune5-frontmatter-hardening.yml').read_text()
          embedded = source.split("python3 <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )

          # One launcher fragment encoded Rust indentation through a Python
          # triple-quoted string. Remove only that labeled transformation and
          # apply its law below using syntax-oriented matching.
          fragment = re.compile(
              r"\nsync = replace_once\(\n    sync,\n    '''        else \{.*?"
              r"    'when-false target admission',\n\)\n",
              re.DOTALL,
          )
          script, removed = fragment.subn("\n", script, count=1)
          if removed != 1:
              raise SystemExit(f'when-false launcher fragment removal count={removed}')

          exec(compile(script, '<fortune5-frontmatter-hardening>', 'exec'))

          sync_path = Path('crates/ggen-engine/src/sync.rs')
          sync = sync_path.read_text()
          when_false = re.compile(
              r'(?m)^(?P<i>[ \t]*)let reason = format!\("when guard false \(\{\}\)", tpl_path\.display\(\)\);\n'
              r'(?P=i)decisions\.insert\(tpl\.frontmatter\.to\.clone\(\), format!\("skipped: \{reason\}"\)\);\n'
              r'(?P=i)skipped\.push\(\(PathBuf::from\(&tpl\.frontmatter\.to\), reason\)\);\n'
              r'(?P=i)continue;'
          )

          def replace_when_false(match: re.Match[str]) -> str:
              i = match.group('i')
              return (
                  f'{i}let reason = format!("when guard false ({{}})", tpl_path.display());\n'
                  f'{i}let evidence_key = if tpl.frontmatter.to.contains("{{{{")\n'
                  f'{i}    || tpl.frontmatter.to.contains("{{%")\n'
                  f'{i}{{\n'
                  f'{i}    format!("@template/{{}}", rel_display(root, tpl_path))\n'
                  f'{i}}} else {{\n'
                  f'{i}    crate::write::resolve_target(root, &tpl.frontmatter.to)?;\n'
                  f'{i}    tpl.frontmatter.to.clone()\n'
                  f'{i}}};\n'
                  f'{i}decisions.insert(evidence_key.clone(), format!("skipped: {{reason}}"));\n'
                  f'{i}skipped.push((PathBuf::from(evidence_key), reason));\n'
                  f'{i}continue;'
              )

          sync, changed = when_false.subn(replace_when_false, sync, count=1)
          if changed != 1:
              raise SystemExit(f'when-false syntax patch count={changed}')
          sync_path.write_text(sync)

          # Repair the generated test's expected-hash lifetime before rustc.
          test_path = Path('crates/ggen-engine/tests/frontmatter_fortune5_hardening_e2e.rs')
          test = test_path.read_text()
          old_assert = '''    assert_eq!(
              report.closure.get("shapes/policy.ttl").map(String::as_str),
              Some(blake3::hash(shape).to_hex().to_string().as_str())
          );
          '''
          new_assert = '''    let expected = blake3::hash(shape).to_hex().to_string();
              assert_eq!(report.closure.get("shapes/policy.ttl"), Some(&expected));
          '''
          if test.count(old_assert) != 1:
              raise SystemExit(f'shape hash assertion patch count={test.count(old_assert)}')
          test_path.write_text(test.replace(old_assert, new_assert, 1))
          PY

          cargo fmt --all
          git diff --check

      - name: Execute focused falsifiers
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ggen-engine --lib write::tests -- --nocapture
          cargo test -p ggen-engine --lib template::tests -- --nocapture
          cargo test -p ggen-engine --test frontmatter_fortune5_hardening_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_cardinality_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_matchers_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_maximalism_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_schema_match -- --nocapture

      - name: Publish verified implementation and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/docs.yml
          rm .github/workflows/fortune5-frontmatter-hardening.yml
          rm -f docs/.fortune5-trigger
          git diff --check
          git config user.name "ggen Fortune 5 hardening"
          git config user.email "actions@github.com"
          git add crates/ggen-engine/src/sync.rs \
                  crates/ggen-engine/src/write.rs \
                  crates/ggen-engine/tests/frontmatter_fortune5_hardening_e2e.rs \
                  docs/reference/frontmatter-maximalism.md \
                  docs/reference/template-directives.md \
                  docs/.fortune5-trigger \
                  .github/workflows/docs.yml \
                  .github/workflows/fortune5-frontmatter-hardening.yml
          git commit -m "feat(engine): add Fortune 5 frontmatter hardening"
          git push origin HEAD:agent/frontmatter-maximalism
