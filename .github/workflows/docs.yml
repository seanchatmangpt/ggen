name: Docs

# Fast repository link diagnostics plus a blocking self-hosted book gate.
# The book gate builds the real ggen CLI, executes book/ggen.toml, verifies
# receipts, runs both structural checkers, renders mdBook, and proves that a
# second sync changes no tracked book content outside runtime receipt state.

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'book/**'
      - 'packs/level-five-book-pack/**'
      - 'ggen.toml'
      - 'justfile'
      - '.github/workflows/docs.yml'
  push:
    branches: [main, agent/post-agi-docs-core-team]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'book/**'
      - 'packs/level-five-book-pack/**'
      - 'ggen.toml'
      - 'justfile'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links:
    name: Relative markdown links (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Check relative links (warn only)
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          ROOT = Path('.').resolve()
          SKIP_DIRS = {'.git', 'node_modules', 'target', '__pycache__', '.venv'}
          LINK = re.compile(r'\[[^\]]*\]\(\s*<?([^)\s>]+)>?(?:\s+"[^"]*")?\s*\)')
          FENCE = re.compile(r'^\s*(```|~~~)')

          def is_external(dest: str) -> bool:
              return (
                  dest.startswith(('http://', 'https://', 'mailto:', 'tel:', '//'))
                  or dest.startswith('#')
                  or dest.startswith('{')
                  or '://' in dest
              )

          md_files = [
              p for p in ROOT.rglob('*.md')
              if not any(part in SKIP_DIRS for part in p.relative_to(ROOT).parts)
          ]

          broken = []
          checked = 0
          for md in md_files:
              try:
                  lines = md.read_text(encoding='utf-8', errors='replace').splitlines()
              except OSError as exc:
                  print(f'::warning::cannot read {md}: {exc}')
                  continue
              in_fence = False
              for line_number, line in enumerate(lines, 1):
                  if FENCE.match(line):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  for match in LINK.finditer(line):
                      dest = match.group(1).strip()
                      if not dest or is_external(dest):
                          continue
                      path_part = dest.split('#', 1)[0].split('?', 1)[0]
                      if not path_part:
                          continue
                      target = (md.parent / path_part).resolve()
                      checked += 1
                      if not target.exists():
                          broken.append((md.relative_to(ROOT), line_number, dest))

          print(f'Scanned {len(md_files)} markdown files; checked {checked} relative links.')
          if broken:
              for rel, line_number, dest in broken:
                  print(f'::warning file={rel},line={line_number}::broken relative link -> {dest}')
              print(f'ADVISORY: {len(broken)} broken relative link(s) found.')
          else:
              print('OK: all relative markdown links resolve.')
          sys.exit(0)
          PY

  book-self-hosted:
    name: ggen self-hosted mdBook
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Provision siblings and pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: book-self-hosted

      - name: Build the real ggen CLI
        run: cargo build -p ggen-cli-lib --bin ggen

      - name: First ggen manufacture and receipt verification
        run: |
          set -euo pipefail
          cd book
          ../target/debug/ggen sync run
          ../target/debug/ggen receipt verify

      - name: Validate every selected chapter and Level Five artifact
        run: |
          set -euo pipefail
          python3 book/scripts/check_book.py
          python3 book/scripts/check_level_five.py

      - name: Build the mdBook renderer
        run: cargo install mdbook --locked --version 0.4.52

      - name: Render the complete mdBook
        run: mdbook build book

      - name: Refuse first-run source or generated-product drift
        run: |
          set -euo pipefail
          drift=$(git status --porcelain=v1 --untracked-files=all -- \
            book \
            ':(exclude)book/.ggen-v2/**' \
            ':(exclude)book/book/**')
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo '::error::book/ggen.toml did not reproduce the committed book source byte-for-byte.'
            exit 1
          fi

      - name: Second ggen manufacture proves idempotency
        run: |
          set -euo pipefail
          cd book
          ../target/debug/ggen sync run
          ../target/debug/ggen receipt verify
          cd ..
          drift=$(git status --porcelain=v1 --untracked-files=all -- \
            book \
            ':(exclude)book/.ggen-v2/**' \
            ':(exclude)book/book/**')
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo '::error::second ggen sync changed tracked book content.'
            exit 1
          fi
          echo 'ggen self-hosted mdBook: sync, receipt, checkers, render, and idempotency are green.'
