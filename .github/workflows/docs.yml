name: Docs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: restore-frontmatter-template-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  restore-and-verify:
    if: github.head_ref == 'agent/frontmatter-maximalism'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore exact verified source blob
        shell: bash
        run: |
          set -euo pipefail
          git checkout 8625840c1fa9f9e4a29fed9824e77f94a920ab28 -- crates/ggen-engine/src/template.rs
          test "$(git hash-object crates/ggen-engine/src/template.rs)" = "f3d1e2cc5c9ec7752f532fc18784aeb7d412e378"
          git diff --check

      - name: Provision siblings and pinned toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          components: rustfmt
          cache-key-suffix: restore-frontmatter-template

      - name: Re-run cardinality and schema falsifiers
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p ggen-engine --lib template::tests -- --nocapture
          cargo test -p ggen-engine --test frontmatter_schema_match -- --nocapture
          cargo test -p ggen-engine --test frontmatter_cardinality_e2e -- --nocapture
          cargo test -p ggen-engine --test frontmatter_maximalism_e2e -- --nocapture

      - name: Publish restoration and restore Docs workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/docs.yml
          git config user.name "ggen source restoration"
          git config user.email "actions@github.com"
          git add crates/ggen-engine/src/template.rs .github/workflows/docs.yml
          git commit -m "fix(engine): restore verified frontmatter template implementation"
          git push origin HEAD:agent/frontmatter-maximalism
