name: Docs

# Advisory repository-link diagnostics plus blocking self-hosted book and claim
# gates. The gates regenerate the committed book from pack law, independently
# cross-check TTL/Tera/output closure, exercise named capability falsifiers and
# pack consumers, render mdBook, repeat sync, and refuse tracked drift.

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'book/**'
      - 'packs/**'
      - 'examples/**'
      - 'marketplace/**'
      - 'crates/ggen-engine/**'
      - 'crates/ggen-graph/**'
      - 'crates/ggen-marketplace/**'
      - 'crates/ggen-cheat-scanner/**'
      - 'ggen.toml'
      - 'justfile'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'book/**'
      - 'packs/**'
      - 'examples/**'
      - 'marketplace/**'
      - 'crates/ggen-engine/**'
      - 'crates/ggen-graph/**'
      - 'crates/ggen-marketplace/**'
      - 'crates/ggen-cheat-scanner/**'
      - 'ggen.toml'
      - 'justfile'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  links:
    name: Relative markdown links (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Check relative links (warn only)
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          root = Path('.').resolve()
          skip_dirs = {'.git', 'node_modules', 'target', '__pycache__', '.venv'}
          link = re.compile(r'\[[^\]]*\]\(\s*<?([^)\s>]+)>?(?:\s+"[^"]*")?\s*\)')
          fence = re.compile(r'^\s*(```|~~~)')

          def external(dest: str) -> bool:
              return (
                  dest.startswith(('http://', 'https://', 'mailto:', 'tel:', '//', '#', '{'))
                  or '://' in dest
              )

          markdown = [
              path for path in root.rglob('*.md')
              if not any(part in skip_dirs for part in path.relative_to(root).parts)
          ]
          broken = []
          checked = 0
          for source in markdown:
              in_fence = False
              for number, line_text in enumerate(
                  source.read_text(encoding='utf-8', errors='replace').splitlines(), 1
              ):
                  if fence.match(line_text):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  for match in link.finditer(line_text):
                      dest = match.group(1).strip()
                      if not dest or external(dest):
                          continue
                      relative = dest.split('#', 1)[0].split('?', 1)[0]
                      if not relative:
                          continue
                      checked += 1
                      if not (source.parent / relative).resolve().exists():
                          broken.append((source.relative_to(root), number, dest))

          print(f'Scanned {len(markdown)} markdown files; checked {checked} relative links.')
          for source, number, dest in broken:
              print(f'::warning file={source},line={number}::broken relative link -> {dest}')
          print(
              f'ADVISORY: {len(broken)} broken relative link(s) found.'
              if broken else 'OK: all relative markdown links resolve.'
          )
          sys.exit(0)
          PY

  book-self-hosted:
    name: ggen self-hosted mdBook and claim graph
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Provision siblings and pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: phase2

      - name: Build the real ggen CLI
        run: cargo build -p ggen-cli-lib --bin ggen

      - name: Manufacture from committed pack law and verify receipt
        run: |
          set -euo pipefail
          cd book
          ../target/debug/ggen sync run
          ../target/debug/ggen receipt verify

      - name: Validate TTL, Tera, and generated bytes independently
        run: |
          set -euo pipefail
          python3 book/scripts/validate_transcription_360.py
          python3 book/scripts/validate_transcription_360.py --sabotage

      - name: Audit capability claims and declared gaps
        run: |
          set -euo pipefail
          python3 book/scripts/audit_claim_coverage.py

      - name: Execute named capability falsifiers
        run: |
          set -euo pipefail
          cargo test -p ggen-engine --test reasoner_independence_e2e
          cargo test -p ggen-graph
          cargo test -p ggen-marketplace
          cargo test -p ggen-cheat-scanner

      - name: Parse pack and marketplace manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          roots = [Path('packs'), Path('marketplace/packs')]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(root.rglob('*.toml'))
          failures = []
          for path in sorted(files):
              try:
                  with path.open('rb') as stream:
                      tomllib.load(stream)
              except Exception as error:
                  failures.append(f'{path}: {error}')
          print(f'TOML_CENSUS files={len(files)} failures={len(failures)}')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Parse pack and consumer ontologies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'rdflib==7.1.4'
          python3 - <<'PY'
          from pathlib import Path
          from rdflib import Graph

          files = sorted(set(Path('packs').rglob('*.ttl')) | set(Path('examples').rglob('*.ttl')))
          failures = []
          triples = 0
          for path in files:
              graph = Graph()
              try:
                  graph.parse(path, format='turtle')
                  triples += len(graph)
              except Exception as error:
                  failures.append(f'{path}: {error}')
          print(f'TTL_CENSUS files={len(files)} triples={triples} failures={len(failures)}')
          if failures:
              raise SystemExit('\n'.join(failures[:50]))
          PY

      - name: Syntax-check generated shell laboratories
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' script; do
            bash -n "$script"
            count=$((count + 1))
          done < <(find book/src/listings -type f -name '*.sh' -print0)
          echo "SHELL_LAB_CENSUS scripts=$count syntax_failures=0"

      - name: Replay discoverable pack consumers twice
        run: |
          set -euo pipefail
          validate_consumer() {
            local consumer="$1"
            local pack="$2"
            if [ ! -f "$consumer/ggen.toml" ]; then
              echo "::error::$consumer has no ggen.toml"
              return 1
            fi
            (
              cd "$consumer"
              ../../target/debug/ggen sync run
              ../../target/debug/ggen receipt verify
              ../../target/debug/ggen sync run
              ../../target/debug/ggen receipt verify
            )
            local drift
            drift=$(git status --porcelain=v1 --untracked-files=all -- \
              "$consumer" "packs/$pack" \
              ":(exclude)$consumer/.ggen-v2/**")
            if [ -n "$drift" ]; then
              printf '%s\n' "$drift"
              echo "::error::$consumer / $pack is not byte-idempotent or leaves unowned output"
              return 1
            fi
            echo "CONSUMER_WITNESS consumer=$consumer pack=packs/$pack syncs=2 receipts=2 drift=0"
          }

          validate_consumer examples/star-toml-verify star-toml-pack
          validate_consumer examples/lsp-max-verify lsp-max-pack
          validate_consumer examples/affidavit-verify affidavit-pack

      - name: Validate every chapter and Level Five artifact
        run: |
          set -euo pipefail
          python3 book/scripts/check_book.py
          python3 book/scripts/check_level_five.py

      - name: Render the complete mdBook
        run: |
          set -euo pipefail
          cargo install mdbook --locked --version 0.4.52 --quiet
          mdbook build book

      - name: Refuse first-sync tracked drift
        run: |
          set -euo pipefail
          drift=$(git status --porcelain=v1 --untracked-files=all -- \
            book \
            packs/level-five-book-pack \
            ':(exclude)book/.ggen-v2/**' \
            ':(exclude)book/book/**')
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo '::error::ggen did not reproduce the committed book and pack law byte-for-byte.'
            exit 1
          fi

      - name: Second manufacture proves content idempotency
        run: |
          set -euo pipefail
          cd book
          ../target/debug/ggen sync run
          ../target/debug/ggen receipt verify
          cd ..
          drift=$(git status --porcelain=v1 --untracked-files=all -- \
            book \
            packs/level-five-book-pack \
            ':(exclude)book/.ggen-v2/**' \
            ':(exclude)book/book/**')
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo '::error::second ggen sync changed tracked book or pack-law content.'
            exit 1
          fi
          echo 'ggen self-hosted mdBook: manufacture, claim audit, consumer replay, 360 validation, receipt, render, and idempotency are green.'
