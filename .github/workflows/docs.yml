name: Docs

# Fast link diagnostics plus a blocking self-hosted book gate.  On this feature
# branch, the PR job performs the one-shot source-law migration: every chapter
# is aligned, promoted into level-five-book-pack ontology law, regenerated by
# the real ggen CLI, checked, rendered, idempotency-tested, then committed.

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'book/**'
      - 'packs/level-five-book-pack/**'
      - 'ggen.toml'
      - 'justfile'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'book/**'
      - 'packs/level-five-book-pack/**'
      - 'ggen.toml'
      - 'justfile'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  links:
    name: Relative markdown links (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Check relative links (warn only)
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          ROOT = Path('.').resolve()
          SKIP_DIRS = {'.git', 'node_modules', 'target', '__pycache__', '.venv'}
          LINK = re.compile(r'\[[^\]]*\]\(\s*<?([^)\s>]+)>?(?:\s+"[^"]*")?\s*\)')
          FENCE = re.compile(r'^\s*(```|~~~)')

          def is_external(dest: str) -> bool:
              return (
                  dest.startswith(('http://', 'https://', 'mailto:', 'tel:', '//'))
                  or dest.startswith('#')
                  or dest.startswith('{')
                  or '://' in dest
              )

          md_files = [
              p for p in ROOT.rglob('*.md')
              if not any(part in SKIP_DIRS for part in p.relative_to(ROOT).parts)
          ]
          broken = []
          checked = 0
          for md in md_files:
              lines = md.read_text(encoding='utf-8', errors='replace').splitlines()
              in_fence = False
              for line_number, line in enumerate(lines, 1):
                  if FENCE.match(line):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  for match in LINK.finditer(line):
                      dest = match.group(1).strip()
                      if not dest or is_external(dest):
                          continue
                      path_part = dest.split('#', 1)[0].split('?', 1)[0]
                      if not path_part:
                          continue
                      target = (md.parent / path_part).resolve()
                      checked += 1
                      if not target.exists():
                          broken.append((md.relative_to(ROOT), line_number, dest))

          print(f'Scanned {len(md_files)} markdown files; checked {checked} relative links.')
          for rel, line_number, dest in broken:
              print(f'::warning file={rel},line={line_number}::broken relative link -> {dest}')
          if broken:
              print(f'ADVISORY: {len(broken)} broken relative link(s) found.')
          else:
              print('OK: all relative markdown links resolve.')
          sys.exit(0)
          PY

  migrate-book-law:
    name: Align, manufacture, and validate every book chapter
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/post-agi-docs-core-team' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/post-agi-docs-core-team
          fetch-depth: 0

      - name: Provision siblings and pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: phase2

      - name: Rebuild all chapters, align evidence, and promote exact bytes
        run: python3 book/scripts/migrate_full_book_to_aligned_pack_law.py

      - name: Update pack census and intentionally re-lock
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packs/level-five-book-pack/pack.toml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('366 book:Chapter + 366 book:Listing', '367 book:Chapter + 367 book:Listing')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f book/ggen.lock

      - name: Build the real ggen CLI
        run: cargo build -p ggen-cli-lib --bin ggen

      - name: Manufacture from promoted ontology law
        run: |
          set -euo pipefail
          cd book
          ../target/debug/ggen sync run
          ../target/debug/ggen receipt verify

      - name: Validate all chapters and Level Five assets
        run: |
          set -euo pipefail
          python3 book/scripts/check_book.py
          python3 book/scripts/check_level_five.py

      - name: Install and render mdBook
        run: |
          set -euo pipefail
          cargo install mdbook --locked --version 0.4.52
          mdbook build book

      - name: Capture first-sync candidate bytes
        run: |
          set -euo pipefail
          git add \
            book/src \
            book/ggen.lock \
            packs/level-five-book-pack/ontology.ttl \
            packs/level-five-book-pack/pack.toml
          git diff --cached --binary -- \
            book/src \
            book/ggen.lock \
            packs/level-five-book-pack/ontology.ttl \
            packs/level-five-book-pack/pack.toml > /tmp/book-first-sync.patch
          test -s /tmp/book-first-sync.patch

      - name: Second ggen manufacture proves content idempotency
        run: |
          set -euo pipefail
          cd book
          ../target/debug/ggen sync run
          ../target/debug/ggen receipt verify
          cd ..
          git add \
            book/src \
            book/ggen.lock \
            packs/level-five-book-pack/ontology.ttl \
            packs/level-five-book-pack/pack.toml
          git diff --cached --binary -- \
            book/src \
            book/ggen.lock \
            packs/level-five-book-pack/ontology.ttl \
            packs/level-five-book-pack/pack.toml > /tmp/book-second-sync.patch
          cmp /tmp/book-first-sync.patch /tmp/book-second-sync.patch
          echo 'Second sync preserved all staged source-law and generated-product bytes.'

      - name: Commit the admitted source law and generated product
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(book): align complete book through ggen pack law'
          git push origin HEAD:agent/post-agi-docs-core-team

  book-self-hosted:
    name: ggen self-hosted mdBook
    if: >-
      !(github.event_name == 'pull_request' &&
        github.head_ref == 'agent/post-agi-docs-core-team' &&
        github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Provision siblings and pinned Rust toolchain
        uses: ./.github/actions/setup-ggen-build
        with:
          cache-key-suffix: phase2

      - name: Build the real ggen CLI
        run: cargo build -p ggen-cli-lib --bin ggen

      - name: First ggen manufacture and receipt verification
        run: |
          set -euo pipefail
          cd book
          ../target/debug/ggen sync run
          ../target/debug/ggen receipt verify

      - name: Validate every chapter and Level Five artifact
        run: |
          set -euo pipefail
          python3 book/scripts/check_book.py
          python3 book/scripts/check_level_five.py

      - name: Build and render the complete mdBook
        run: |
          set -euo pipefail
          cargo install mdbook --locked --version 0.4.52
          mdbook build book

      - name: Refuse first-run source or generated-product drift
        run: |
          set -euo pipefail
          drift=$(git status --porcelain=v1 --untracked-files=all -- \
            book \
            ':(exclude)book/.ggen-v2/**' \
            ':(exclude)book/book/**')
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo '::error::book/ggen.toml did not reproduce the committed book byte-for-byte.'
            exit 1
          fi

      - name: Second ggen manufacture proves idempotency
        run: |
          set -euo pipefail
          cd book
          ../target/debug/ggen sync run
          ../target/debug/ggen receipt verify
          cd ..
          drift=$(git status --porcelain=v1 --untracked-files=all -- \
            book \
            ':(exclude)book/.ggen-v2/**' \
            ':(exclude)book/book/**')
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo '::error::second ggen sync changed tracked book content.'
            exit 1
          fi
          echo 'ggen self-hosted mdBook: sync, receipt, all chapters, render, and idempotency are green.'
