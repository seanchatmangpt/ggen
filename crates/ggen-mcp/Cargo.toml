[package]
name = "ggen-mcp"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "ggen-mcp"
description = "MCP server exposing ggen's SPARQL/frontmatter/diagnostic introspection surface as tool calls (crates/ggen-mcp; see README.md)."

[[bin]]
name = "ggen-mcp"
path = "src/bin/ggen-mcp.rs"

# Corpus growth via a local LLM. Separate binary, never a test: an LLM in
# the assertion path would make a red suite unreproducible.
[[bin]]
name = "ggen-selfplay-explore"
path = "src/bin/ggen-selfplay-explore.rs"

[dependencies]
# Path deps only -- ggen-lsp is `publish = false`, so this crate must stay a
# workspace member, never an external/published consumer.
ggen-engine = { path = "../ggen-engine" }
ggen-graph = { path = "../ggen-graph" }
ggen-config = { path = "../ggen-config" }
# Default features only: ggen-lsp's own `mcp` feature (which pulls a SECOND
# rmcp dependency edge) stays off here, so ggen-mcp's own compiled dependency
# graph resolves exactly one rmcp major version (verify with `cargo tree -p
# ggen-mcp | grep rmcp`). Note: crates/ggen-engine also carries its own
# independent, currently-dormant `rmcp = "0.11.0"` optional dependency behind
# its own (unrelated) `mcp` feature (default off) -- Cargo.lock itself already
# contains both rmcp 0.11.0 and 1.8.0 for that reason. Do not add
# features = ["mcp"] to either the ggen-lsp or ggen-engine dep here.
ggen-lsp = { path = "../ggen-lsp" }
# Diagnostic type (`Diagnostic`/`Range`/`NumberOrString`) used by
# `crate::bridge` to build push-notification content -- same crate ggen-lsp
# itself uses, not a re-derivation.
lsp-max = { workspace = true }

# Exact match to crates/ggen-lsp/Cargo.toml's own rmcp pin -- do not drift.
rmcp = { version = "1.7.0", features = ["transport-io", "schemars"] }
schemars = "1.2.1"
regex = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
toml = { workspace = true }
# Real dependency, not dev-only: `selfplay::Board` manufactures arena
# directories at runtime, so this is part of the library surface.
tempfile = { workspace = true }
# Local-only HTTP to the TurboFieldfare OpenAI-compatible server.
reqwest = { workspace = true }
# CP15: real filesystem watcher backing `crate::watcher` -- same crate/version
# `ggen-engine::watch` already uses (see crates/ggen-engine/src/watch.rs), not
# a new dependency edge for the workspace.
notify = { workspace = true }
notify-debouncer-full = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
# Test-only: `crate::bridge`'s end-to-end test constructs a real MCP client
# (ClientHandler, RoleClient) over an in-process duplex transport. The
# production server code never uses the `client` feature.
rmcp = { version = "1.7.0", features = ["client"] }
