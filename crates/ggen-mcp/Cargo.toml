[package]
name = "ggen-mcp"
version = "0.1.0"
edition = "2021"
publish = false
description = "MCP server exposing ggen's SPARQL/frontmatter/diagnostic introspection surface as tool calls (crates/ggen-mcp; see docs/2026-08-03-ggen-mcp-plan.md)."

[[bin]]
name = "ggen-mcp"
path = "src/bin/ggen-mcp.rs"

[dependencies]
# Path deps only -- ggen-lsp is `publish = false`, so this crate must stay a
# workspace member, never an external/published consumer.
ggen-engine = { path = "../ggen-engine" }
ggen-graph = { path = "../ggen-graph" }
ggen-config = { path = "../ggen-config" }
# Default features only: ggen-lsp's own `mcp` feature (which pulls a SECOND
# rmcp dependency edge) stays off here, so exactly one rmcp major version
# resolves in the workspace lock. Do not add features = ["mcp"] to this dep.
ggen-lsp = { path = "../ggen-lsp" }

# Exact match to crates/ggen-lsp/Cargo.toml's own rmcp pin -- do not drift.
rmcp = { version = "1.7.0", features = ["transport-io", "schemars"] }
schemars = "1.2.1"

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = { workspace = true }
