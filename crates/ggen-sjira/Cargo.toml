[package]
name = "ggen-sjira"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Native Rust port of the ggen_igniter SemanticJira admission kernel (core slice): WorkOrder representation, typed admission, definition digest."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
blake3 = { workspace = true }
# SovereignLease multi-party signature verification (lease.rs; disclosed dep,
# ported from ggen_igniter sovereign_lease.ex's :crypto EdDSA law).
ed25519-dalek = { workspace = true }
# E80-03 (disclosed, outside lane file ownership): path dependency so the
# SymbolGraph seam is backed by the real ggen-scip index (ScipGraph).
ggen-scip = { path = "../ggen-scip" }
