[package]
name = "ggen-scip"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "SCIP (JSON encoding) indexer of ggen's generated surface: emits .ggen/scip.json with definitions and references extracted via tree-sitter-rust."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
tree-sitter = "0.26.13"
tree-sitter-rust = "0.23.3"

[dev-dependencies]
# Chicago: tests exercise the real emitter against real generated files; no mocks.
