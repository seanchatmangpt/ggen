[package]
name = "ggen-abb-sbb"
version.workspace = true
edition = "2021"
license = "MIT"
repository = "https://github.com/seanchatmangpt/ggen"
description = "IO-free ABB/SBB manufacture admission kernel: SELECT existing SBB || MANUFACTURE missing realization, never DO."
readme = "README.md"
keywords = ["admission", "planning", "dependency-graph", "code-generation", "rdf"]
categories = ["development-tools", "algorithms"]
# `include` is load-bearing for publish: the repo-wide .gitignore pattern
# `generated/` (line 158) excludes src/generated/ from `cargo package`, which
# broke `cargo publish --dry-run -p ggen-abb-sbb` with E0583 ("file not found
# for module `generated`"). An explicit include list overrides ignore rules,
# forcing the generated module into the tarball. Benches are included because
# the [[bench]] target below must resolve inside the package. tests/,
# examples/, fixtures/ are deliberately excluded (not needed by consumers;
# keeps the .crate at ~30KB packed).
include = [
    "Cargo.toml",
    "README.md",
    "/LICENSE",
    "src/**/*",
    "benches/**/*",
]

[package.metadata.ggen]
rfc = "docs/rfc/v26.9.26/abb-sbb-implementation.md"
authority = "NONE"
ceiling = "CONSTRUCT"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = { workspace = true }
star-toml = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "manufacture"
harness = false
