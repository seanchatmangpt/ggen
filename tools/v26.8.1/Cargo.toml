[workspace]

[package]
name = "ggen-v26-8-1-verifier"
version = "26.8.1"
edition = "2021"
publish = false
license = "MIT"
description = "Exact-head repository observer and crown verifier for ggen v26.8.1 and ggen-legacy sunset"

[lib]
name = "v26_8_1_tools"
path = "src/lib.rs"

[[bin]]
name = "ggen-v26-8-1-verifier"
path = "src/main.rs"

[[bin]]
name = "subsystem_verifier"
path = "src/bin/subsystem_verifier.rs"

[[bin]]
name = "project_coverage"
path = "src/bin/project_coverage.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
