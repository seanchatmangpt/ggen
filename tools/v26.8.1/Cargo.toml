[workspace]

[package]
name = "ggen-v26-8-1-verifier"
version = "26.8.1"
edition = "2021"
publish = false
license = "MIT"
description = "Exact-head repository observer and crown verifier for ggen v26.8.1 and ggen-legacy sunset"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.5"

[lints.rust]
unsafe_code = "forbid"
