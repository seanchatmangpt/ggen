[package]
name = "ggen-pack-gall"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[workspace]

[dependencies]
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "pack-gall-observe"
path = "src/bin/observe.rs"

[[bin]]
name = "pack-gall-verify"
path = "src/bin/verify.rs"
