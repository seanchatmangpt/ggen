[project]
name = "ggen"
version = "26.9.8"
description = "Specification-driven code generation from RDF ontologies — A = μ(O)"
authors = ["Sean Chatman <sean@chatmangpt.com>"]
license = "MIT"
repository = "https://github.com/seanchatmangpt/ggen"

[ontology]
source = ".specify/cli-commands.ttl"
base_iri = "http://ggen.org/cli#"
imports = [
  ".specify/cli-commands.ttl",
  ".specify/cli-proof-tests.ttl",
  ".specify/repo-facts.ttl",
  ".specify/maturity.ttl",
  ".specify/pack-l5-promotion.ttl",
  ".specify/ggen-product.ttl",
  ".specify/generations.ttl",
  ".specify/combinatorial.ttl",
  ".specify/combinatorial-instances.ttl",
  "packs/ggen-constitution-pack/ontology.ttl",
  "packs/ggen-release-pack/ontology.ttl",
  "packs/ggen-verify-pack/ontology.ttl",
  "packs/claude-code-pack/ontology.ttl",
  "packs/gh-actions-errc-pack/ontology.ttl",
  ".specify/ci-workflows.ttl",
  "evidence/ontology.ttl",
  "evidence/l5-template-derivation.ttl",
  "evidence/producers/docs-manifest.ttl",
  "evidence/producers/receipts-check.ttl",
  "evidence/producers/evidence-check.ttl",
]

[ontology.prefixes]
cli     = "http://ggen.org/cli#"
cmx     = "http://ggen.org/combinatorial#"
paas    = "http://ggen.org/paas#"
rdf     = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs    = "http://www.w3.org/2000/01/rdf-schema#"
owl     = "http://www.w3.org/2002/07/owl#"
xsd     = "http://www.w3.org/2001/XMLSchema#"
dcterms = "http://purl.org/dc/terms/"
skos    = "http://www.w3.org/2004/02/skos/core#"

[validation]
gates = [
  ".specify/gates/cross-pack-contamination.rq",
  ".specify/gates/every-action-has-binding.rq",
  ".specify/gates/every-binding-has-output-pattern.rq",
  ".specify/gates/every-binding-has-template.rq",
  ".specify/gates/every-command-has-handler.rq",
  ".specify/gates/every-generator-has-action.rq",
  ".specify/gates/l5-cap05-template-derivation-claim.rq",
  ".specify/gates/l5-level5-requires-sabotage-evidence.rq",
  ".specify/gates/l5-level5-standing-requires-closed-capabilities.rq",
  ".specify/gates/no-orphan-actions.rq",
]

[inference]

[[inference.rules]]
name = "command-projection"
construct = """
PREFIX cli:   <http://ggen.org/cli#>
PREFIX rdfs:  <http://www.w3.org/2000/01/rdf-schema#>
CONSTRUCT {
  ?cmd a cli:Command ;
       rdfs:label ?label ;
       rdfs:comment ?comment .
}
WHERE {
  ?cmd a cli:Command ;
       rdfs:label ?label .
  OPTIONAL { ?cmd rdfs:comment ?comment . }
}
ORDER BY ?label
"""

[generation]
output_dir = "."

[[generation.rules]]
name         = "github-actions-workflows"
query        = { inline = """
PREFIX gha:  <http://seanchatmangpt.github.io/packs/github-actions#>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
SELECT ?wf ?fileName ?purpose ?onBlock ?concurrencyPolicy ?permissionCeiling
       (GROUP_CONCAT(DISTINCT ?triggerLabel; separator=",") AS ?triggers)
       (GROUP_CONCAT(DISTINCT ?envKv; separator=",") AS ?workflowEnv)
WHERE {
  ?wf a gha:Workflow ; gha:fileName ?fileName .
  FILTER NOT EXISTS { ?wf gha:ownedBy ?owner }
  OPTIONAL { ?wf gha:purpose ?purpose . }
  OPTIONAL { ?wf gha:onBlock ?onBlock . }
  OPTIONAL { ?wf gha:concurrencyPolicy ?concurrencyPolicy . }
  OPTIONAL { ?wf gha:permissionCeiling ?permissionCeiling . }
  OPTIONAL { ?wf gha:trigger ?t . ?t rdfs:label ?triggerLabel . }
  OPTIONAL { ?wf gha:workflowEnv ?envKv . }
}
GROUP BY ?wf ?fileName ?purpose ?onBlock ?concurrencyPolicy ?permissionCeiling
ORDER BY ?fileName
""" }
template     = { file = "packs/github-actions-pack/templates/workflow.yml.tmpl" }
# Scratch path, deliberately not ".github/workflows/{{ fileName }}" yet:
# this repo's own CI actually executes `ggen sync run` as part of its
# self-host/dogfood verification (self-host/scripts/verify_root_regeneration.py),
# so pointing this at the real workflow path would make CI regenerate the
# live ci.yml for real on every run -- confirmed the hard way: the first
# version of this rule targeted the real path and tripped
# manufacture-own-repository's unauthorized-write refusal
# (`.github/workflows/ci.yml` had no declared output owner). Switching to
# the real path is a deliberate follow-up decision (needs an owner
# declaration for that output, or a receipt-authorized regeneration path),
# not an automatic consequence of this rule existing.
output_file  = ".specify/ci-workflows-rendered/{{ fileName }}"
mode         = "Overwrite"

[[generation.rules]]
name = "cli-commands-reference"
query = { inline = """
PREFIX cli:  <http://ggen.org/cli#>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
SELECT ?cmd ?label ?comment
WHERE {
  ?cmd a cli:Command ;
       rdfs:label ?label .
  OPTIONAL { ?cmd rdfs:comment ?comment . }
}
ORDER BY ?label
""" }
template = { file = ".specify/templates/cli/commands-reference.rs.tera" }
output_file = "crates/ggen-cli/src/generated_commands.rs"
mode = "Overwrite"

[[generation.rules]]
name         = "cli-proof-tests"
query        = { file = ".specify/queries/cli-proof-tests.rq" }
template     = { file = ".specify/templates/cli/cli_proof_test.rs.tera" }
output_file  = "crates/ggen-cli/tests/generated/cli_proof_tests.rs"
skip_empty   = false
mode         = "Overwrite"

# ── Self-generated manuals (2026-07-19): the repo's own docs precipitate from
# .specify/{repo-facts,maturity}.ttl. Each template pulls its tables itself via
# the sparql() Tera function; the rule-level query is a minimal deterministic
# anchor (ORDER BY per E0013 discipline). CLAUDE.md / README.md use mode=Merge:
# only the single <<<<<<< GENERATED … >>>>>>> MANUAL region is replaced, every
# byte outside the markers is preserved (generation_rules.rs `mod merge`).

