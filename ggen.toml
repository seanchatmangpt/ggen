# ── Combinatorial Maximalism ─────────────────────────────────────────────────
# All rules below derive from .specify/combinatorial.ttl +
# .specify/combinatorial-instances.ttl.
# A = μ(O): every artifact is correct by construction once the law gate passes.
# The BLAKE3 receipt chain (generated by ggen sync) is the externalizable proof.
# Do not add post-hoc tests for generated output — the derivation IS the proof.
# ─────────────────────────────────────────────────────────────────────────────

# Import the combinatorial ontology into the [ontology] imports list.
# (This stanza is a comment-marker; the actual import is in [ontology].imports.)

# ── INFERENCE STAGE ──────────────────────────────────────────────────────────
# Two CONSTRUCT rules run before any [[generation.rules]].
# Order 10-11 places them after any pre-existing inference rules.

[[inference.rules]]
name  = "combinatorial-materialize-action-for-generator"
order = 10
construct = """
PREFIX cmx: <http://ggen.org/combinatorial#>

# Materialize the inverse: every Action referenced by cmx:hasAction
# gets a cmx:forGenerator back-link. This lets the cross-product query
# walk act → gen without a SPARQL 1.1 property path.
CONSTRUCT {
  ?act cmx:forGenerator ?gen .
}
WHERE {
  ?gen a cmx:Generator ;
       cmx:hasAction ?act .
}
ORDER BY ?gen ?act
"""

[[inference.rules]]
name  = "combinatorial-materialize-cmd-bound-templates"
order = 11
construct = """
PREFIX cli: <http://ggen.org/cli#>
PREFIX cmx: <http://ggen.org/combinatorial#>

# Bind every cli:Command to every cmx:TemplateBinding that belongs to the
# combinatorial-cross generator. This is the cross-product materializer:
# N commands × M bindings = N×M cmx:hasBoundTemplate triples.
# Only bindings whose action belongs to a generator with
# cmx:generatorId "combinatorial-cross" are materialized here,
# keeping other generators' bindings scoped to their own queries.
CONSTRUCT {
  ?cmd cmx:hasBoundTemplate ?binding .
}
WHERE {
  ?cmd  a cli:Command .
  ?gen  a cmx:Generator ;
        cmx:generatorId "combinatorial-cross" ;
        cmx:hasAction   ?act .
  ?act  cmx:hasBinding  ?binding .
}
ORDER BY ?cmd ?binding
"""

# ── GENERATION RULES ─────────────────────────────────────────────────────────

# ── proof-gate / gate-rq ─────────────────────────────────────────────────────
# One SPARQL ASK .rq file per cmx:ProofGate instance.
# These gate files are consumed by ggen's own law gate stage on next sync.
[[generation.rules]]
name       = "combinatorial-proof-gate-rq"
query      = { file = ".specify/queries/combinatorial/proof-gate.rq" }
template   = { file = ".specify/templates/combinatorial/proof-gate.rq.tera" }
output_file = ".specify/gates/{{ gate_id }}.rq"
skip_empty = false
mode       = "Overwrite"

# ── proof-gate / gate-doc ─────────────────────────────────────────────────────
# One markdown doc per cmx:ProofGate instance.
[[generation.rules]]
name        = "combinatorial-proof-gate-doc"
query       = { file = ".specify/queries/combinatorial/proof-gate.rq" }
template    = { file = ".specify/templates/combinatorial/proof-gate-doc.md.tera" }
output_file = "docs/gates/{{ gate_id }}.md"
skip_empty  = false
mode        = "Overwrite"

# ── crate / new ──────────────────────────────────────────────────────────────
# One Cargo.toml per cmx:Crate instance.
[[generation.rules]]
name        = "combinatorial-crate-cargo-toml"
query       = { file = ".specify/queries/combinatorial/crate-new.rq" }
template    = { file = ".specify/templates/combinatorial/crate-cargo-toml.tera" }
output_file = "crates/{{ crate_name }}/Cargo.toml"
skip_empty  = false
mode        = "Create"

# ── crate / lib ───────────────────────────────────────────────────────────────
# One src/lib.rs skeleton per cmx:Crate instance.
[[generation.rules]]
name        = "combinatorial-crate-lib-rs"
query       = { file = ".specify/queries/combinatorial/crate-lib.rq" }
template    = { file = ".specify/templates/combinatorial/crate-lib-rs.tera" }
output_file = "crates/{{ crate_name }}/src/lib.rs"
skip_empty  = false
mode        = "Create"

# ── combinatorial-cross / cmd-template ────────────────────────────────────────
# The key cross-product rule.
# After inference rule order=11 materializes cmx:hasBoundTemplate triples,
# this SELECT returns N_cmd × M_bindings rows. Each row renders one output file
# at the Tera-interpolated output_path. The receipt for each file is chained
# into .ggen/receipts/ by ggen sync — that IS the proof of correctness.
[[generation.rules]]
name        = "combinatorial-cross-cmd-template"
query       = { file = ".specify/queries/combinatorial/cmd-template-cross.rq" }
template    = { file = ".specify/templates/combinatorial/cmd-template-cross.tera" }
output_file = "crates/ggen-cli/src/cmds/{{ cmd_label | snake }}_{{ action_id | snake }}.rs"
skip_empty  = true
mode        = "Overwrite"

# ── gh-actions-errc-pack ──────────────────────────────────────────────────────
# Advisory/additive only: renders the ERRC grid doc and a non-wired proposed
# setup-ggen-build replacement. Never touches .github/workflows/* or the real
# .github/actions/setup-ggen-build/action.yml. See packs/gh-actions-errc-pack/.
[[generation.rules]]
name        = "gh-actions-errc-grid"
query       = { inline = """
PREFIX errc: <http://seanchatmangpt.github.io/packs/gh-actions-errc#>
SELECT ?body WHERE { errc:ErrcGridDocument errc:body ?body . } ORDER BY ?body
""" }
template    = { file = "packs/gh-actions-errc-pack/templates/errc_grid.md.tmpl" }
output_file = "docs/ci/GH_ACTIONS_ERRC_GRID.md"
mode        = "Overwrite"

[[generation.rules]]
name        = "gh-actions-errc-proposed-action"
query       = { inline = """
PREFIX errc: <http://seanchatmangpt.github.io/packs/gh-actions-errc#>
SELECT ?body WHERE { errc:ProposedSetupGgenBuildAction errc:body ?body . } ORDER BY ?body
""" }
template    = { file = "packs/gh-actions-errc-pack/templates/proposed_action.yml.tmpl" }
output_file = ".github/actions/setup-ggen-build-errc-proposed/action.yml"
mode        = "Overwrite"

