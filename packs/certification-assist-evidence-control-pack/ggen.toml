[project]
name = "certification-assist-evidence-control-consumer"
version = "26.7.31"
description = "Manufacture automatic and autonomic evidence control for learner efficacy, psychometrics, and issuer standing"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatmangpt.com/ontology/certification-assist-evidence-control#"
imports = []

[ontology.prefixes]
caec = "https://chatmangpt.com/ontology/certification-assist-evidence-control#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
prov = "http://www.w3.org/ns/prov#"
dcterms = "http://purl.org/dc/terms/"
ceterms = "https://purl.org/ctdl/terms/"
ceasn = "https://purl.org/ctdlasn/terms/"

[generation]
output_dir = "."

[[generation.rules]]
name = "cargo-manifest"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/Cargo.toml.tmpl" }
output_file = "consumer/evidence-control/Cargo.toml"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "library"
query = { file = "queries/model.rq" }
template = { file = "templates/src/lib.rs.tmpl" }
output_file = "consumer/evidence-control/src/lib.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "tests"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/tests/full_contract.rs.tmpl" }
output_file = "consumer/evidence-control/tests/full_contract.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "verifier"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/src/bin/verify.rs.tmpl" }
output_file = "consumer/evidence-control/src/bin/verify.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "documentation"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/docs/EVIDENCE_CONTROL.md.tmpl" }
output_file = "consumer/evidence-control/docs/EVIDENCE_CONTROL.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "mcp-contract"
query = { file = "queries/protocol.rq" }
template = { file = "templates/protocol/mcp-server.json.tmpl" }
output_file = "consumer/evidence-control/protocol/mcp-server.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "a2a-agent-card"
query = { file = "queries/protocol.rq" }
template = { file = "templates/protocol/a2a-agent-card.json.tmpl" }
output_file = "consumer/evidence-control/protocol/a2a-agent-card.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "control-policy"
query = { file = "queries/policies.rq" }
template = { file = "templates/automation/CONTROL_POLICY.json.tmpl" }
output_file = "consumer/evidence-control/automation/CONTROL_POLICY.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "release-standing"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/RELEASE_STANDING.json.tmpl" }
output_file = "consumer/evidence-control/RELEASE_STANDING.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "verification-script"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/scripts/verify.sh.tmpl" }
output_file = "consumer/evidence-control/scripts/verify.sh"
skip_empty = false
mode = "Overwrite"
