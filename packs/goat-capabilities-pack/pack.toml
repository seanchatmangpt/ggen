[pack]
name = "goat-capabilities-pack"
version = "0.1.0"
description = "Model-conformance validation for autofde-lab's *goat security domains, per docs/jira/v26.8.12/cloud-cert-wbpr-prd.md FR6 and .claude/skills/l5-pack-method. Proof-of-concept scoped to the two domains with existing hand-written fidelity checks to generate from: AzureGoatPrivescEnvironment (10 AttackStep individuals, verbatim-transcribed from vendor/gyms/azuregoat/attack-manuals/module-1/05-Privilege Escalation.md's real numbered steps 1-9, step 8 split into 8a/8b matching the domain's own real ATTACK_STEPS tuple) and TerraGoatRemediation (8 Finding individuals, verbatim-transcribed from vendor/gyms/terragoat/terraform/aws/s3.tf's real '# <misconfiguration>' comments, capped at 8 matching parse_findings(max_findings=8)'s real default). Reference is vendored read-only via autofde-lab's own git submodules; this pack never copies or edits vendor/gyms/**, it only transcribes verbatim into ontology.ttl sourceText/description literals. Gates (gates/010_step_count_matches_manual.rq) check ontology self-consistency: each domain's declared stepCount fact must equal the actual count of AttackStep/Finding individuals present -- a real, checkable invariant against silent transcription drift (an individual added/removed without updating the declared count fails the gate). The deeper fidelity check -- that transcribed content matches the real upstream file byte-for-byte -- is proven by the generated proof test importing the real azuregoat_privesc.ATTACK_STEPS/terragoat_remediation.parse_findings and asserting equality against SPARQL-derived values, mirroring azuregoat's own existing test_attack_steps_match_real_manual_commands_parsed_at_runtime. Named, disclosed residual gap (not silently claimed solved): precondition/effect *topology* fidelity against the manual's prose is not checked here or anywhere else in this repo -- only step identity, manual-step label, and command/description text."
