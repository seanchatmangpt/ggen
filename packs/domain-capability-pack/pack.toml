[pack]
name = "domain-capability-pack"
version = "0.2.0"
description = """
Canonical domain-capability source and projection pack implementing the ERRC production closure.

The pack owns the cross-repository vocabulary for executable-world capabilities, source provenance,
consumer allowlists and drift guards. The worked SREGym source contains 14 real gymact capabilities.
Consumer configuration is no longer expected to maintain an independent capability enumeration:
`templates/autofde_lab_gymact_capabilities.toml.tmpl` manufactures the consumer TOML from admitted
graph facts, and `templates/cross_repo_capability_patterns.toml.tmpl` projects Chatman Ecosystem
capability facts into a capability→implementation-pattern manifest without granting authority.

ERRC constraints implemented here:
- ELIMINATE consumer-local capability enumeration as a source of truth.
- ELIMINATE any new ERRC vocabulary; reuse gh-actions-errc-pack's queryable `errc:Finding` shape.
- REDUCE architecture to the load-bearing authority/observation/world-lab projection surfaces;
  production actuation remains outside this pack.
- RAISE fidelity with exact per-source counts, allowlist-subset checks, unique source/slug/order
  identity, and a closed READ|DO world-consequence carrier.
- RAISE proof discipline by requiring downstream implementations to supply positive execution,
  negative refusal and receipt-replay evidence before MuStar canonical selection.
- CREATE generated AutoFDE and cross-repo pattern projections from admitted semantic facts.

This pack does not acquire SELECT or DO authority. A generated projection is data/construct output;
selection belongs to MuStar and consequential execution remains broker-owned.
"""
category = "architecture"
author = "ggen"
license = "MIT OR Apache-2.0"
production_ready = false

[pack.metadata]
tags = ["ggen", "errc", "capability", "authority", "projection", "drift-guard"]
keywords = ["ontology", "sparql", "capability", "allowlist", "proof-surface", "errc"]

[pack.metadata.standing]
source_graph = "CANDIDATE"
generated_projection = "CANDIDATE"
production_actuation = "UNSUPPORTED"

[pack.metadata.falsifiers]
items = [
  "a generated allowlist contains a capability absent from the admitted domain graph",
  "duplicate slug/order identity exists within one source",
  "a world consequence is outside READ|DO",
  "a generated projection is treated as SELECT or DO authority",
]
