[pack]
name = "domain-capability-pack"
version = "0.2.0"
description = """
Canonical domain-capability source and consumer-projection pack implementing the ERRC production closure.

The pack owns the shared vocabulary for executable-world capabilities, source provenance, consumer
allowlists and drift guards. The worked SREGym source contains 14 real gymact capabilities. Consumer
configuration is no longer expected to maintain an independent capability enumeration:
`templates/autofde_lab_gymact_capabilities.toml.tmpl` manufactures the AutoFDE consumer TOML from
the admitted SREGym graph facts.

The cross-repository Chatman Ecosystem capability→implementation-pattern projection is intentionally
NOT generated here because this pack does not own or load that ABox. Its lawful generator lives beside
the canonical capability TTLs in `chatman-ecosystem/packs/platform-console-capability-projection` and
uses ggen `extra_ontologies` to union those exact source files without copying their 44+ individuals.

ERRC constraints implemented here:
- ELIMINATE consumer-local capability enumeration as a source of truth.
- ELIMINATE any new ERRC vocabulary; reuse gh-actions-errc-pack's queryable `errc:Finding` shape.
- REDUCE architecture to the load-bearing authority/observation/world-lab projection surfaces;
  production actuation remains outside this pack.
- RAISE fidelity with exact per-source counts, allowlist-subset checks, unique source/slug/order
  identity, and a closed READ|DO world-consequence carrier.
- RAISE proof discipline by making positive execution, negative refusal and receipt replay explicit
  downstream admission requirements rather than assuming build success implies runtime standing.
- CREATE the generated AutoFDE projection from admitted semantic facts.

This pack does not acquire SELECT or DO authority. A generated projection is data/construct output;
selection belongs to its separate SELECT owner and consequential execution remains broker-owned.
"""
category = "architecture"
author = "ggen"
license = "MIT OR Apache-2.0"
production_ready = false

[pack.metadata]
tags = ["ggen", "errc", "capability", "authority", "projection", "drift-guard"]
keywords = ["ontology", "sparql", "capability", "allowlist", "proof-surface", "errc"]

[pack.metadata.standing]
source_graph = "CANDIDATE"
generated_projection = "CANDIDATE"
production_actuation = "UNSUPPORTED"

[pack.metadata.falsifiers]
items = [
  "a generated allowlist contains a capability absent from the admitted domain graph",
  "duplicate slug/order identity exists within one source",
  "a world consequence is outside READ|DO",
  "a generated projection is treated as SELECT or DO authority",
]
