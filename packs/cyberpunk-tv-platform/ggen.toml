[project]
name = "cyberpunk-tv-platform"
version = "26.8.3"
description = "Manufacture capability-dense television runtime bodies from public semantic authority."
authors = ["Sean Chatman <sean@chatmangpt.com>"]
license = "AGPL-3.0-or-later"

[ontology]
source = "ontology/platform.ttl"
imports = [
  "ontology/platform-shapes.ttl",
  "ontology/vision2030.ttl",
  "fixtures/valid-session.ttl",
  "fixtures/refused-session.ttl",
]
base_iri = "https://ggen.dev/ontology/cyberpunk-tv#"

[ontology.prefixes]
tv = "https://ggen.dev/ontology/cyberpunk-tv#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
owl = "http://www.w3.org/2002/07/owl#"
xsd = "http://www.w3.org/2001/XMLSchema#"
dct = "http://purl.org/dc/terms/"
dcat = "http://www.w3.org/ns/dcat#"
prov = "http://www.w3.org/ns/prov#"
schema = "https://schema.org/"
skos = "http://www.w3.org/2004/02/skos/core#"
foaf = "http://xmlns.com/foaf/0.1/"
org = "http://www.w3.org/ns/org#"
odrl = "http://www.w3.org/ns/odrl/2/"
sh = "http://www.w3.org/ns/shacl#"

[inference]
rules = [
  { name = "derive-device-projections", order = 1, construct = """
PREFIX tv: <https://ggen.dev/ontology/cyberpunk-tv#>
CONSTRUCT { ?device tv:supportsProjection ?projection . }
WHERE {
  ?device a tv:DeviceProfile ; tv:hasCapability ?capability .
  ?projection a tv:Projection ; tv:requiresCapability ?capability .
}
ORDER BY ?device ?projection
""" },
  { name = "derive-majority-settlement", order = 2, construct = """
PREFIX tv: <https://ggen.dev/ontology/cyberpunk-tv#>
PREFIX prov: <http://www.w3.org/ns/prov#>
CONSTRUCT {
  ?motion tv:motionState "adopted" ; tv:adoptsSettlement ?settlement .
  ?settlement tv:standing "adopted-awaiting-brce" ;
              tv:receiptedBy tv:ReceiptPolicyBlake3 ;
              prov:wasDerivedFrom ?proposalA, ?proposalB .
}
WHERE {
  ?motion a tv:Motion ; tv:quorumRequired ?required ; tv:yesVotes ?yes ; tv:noVotes ?no ;
          tv:hasProposal ?proposalA, ?proposalB .
  FILTER(?proposalA != ?proposalB)
  ?proposalA tv:proposalDigest ?digestA .
  ?proposalB tv:proposalDigest ?digestB .
  FILTER(?digestA != ?digestB)
  BIND((?yes + ?no) AS ?present)
  FILTER(?present >= ?required)
  FILTER(?yes > ?no)
  ?settlement a tv:Settlement ; tv:standing "candidate" .
}
ORDER BY ?motion ?settlement
""" },
  { name = "derive-clean-refusal", order = 3, construct = """
PREFIX tv: <https://ggen.dev/ontology/cyberpunk-tv#>
CONSTRUCT { ?motion tv:standing "clean-refusal" . }
WHERE {
  ?motion a tv:Motion ; tv:quorumRequired ?required ; tv:yesVotes ?yes ; tv:noVotes ?no .
  BIND((?yes + ?no) AS ?present)
  FILTER(?present < ?required || ?no >= ?yes)
}
ORDER BY ?motion
""" },
]

