[pack]
name = "pddl-embedded-workflow-pack"
version = "0.1.0"
description = "Generates a Rust command enum, ActionBinding impl, TryFrom<ActionInvocation> impl, and an execution-kind routing function for one bcinr-pddl embedded-workflow domain from hand-authored wf:Action individuals (see ontology.ttl's schema section for wf:Domain/wf:Action/wf:executionKind). This pack does NOT parse PDDL text -- wf:Action individuals are a direct, hand-written transcription of a domain's actions (name, Rust variant, execution kind), the same authoring shape as this repo's other packs; the real PDDL domain text stays hand-written and owned separately by the consumer, passed to bcinr_pddl::EmbeddedWorkflow::new as always. wf:executionKind (wf:Local | wf:Durable | wf:HumanApproval) records which of bcinr-pddl's three existing workflow_cmd::adapters projections (TaskGroupAdapter/OutboxAdapter/ApprovalAdapter) an action's command should route through by default -- generated as a plain fn a consumer can override per-deployment, not a hard-coded dispatch decision baked into the command type, so planning semantics (what an action means) and execution adapter (how a given deployment runs it) stay orthogonal axes per the source repo's authority-separation rule. Demonstrated here against examples/embedded_workflow.rs's fulfillment domain (order-42, reserve-inventory + notify-customer) from bcinr's own workflow_cmd_chicago.rs test fixtures -- the first ontology individuals in this pack are that exact domain, not an invented example. Every wf:Action row is checked at gate time (gates/010_required.rq, gates/020_duplicate_action_name.rq) for the same defects BindingRegistry::new would otherwise only refuse at runtime (missing fields, duplicate action names) -- catching them at generation time instead. Run with `ggen sync run` from a bcinr checkout root; the generated file's `to:` path targets crates/bcinr-pddl/tests/embedded_workflow_generated.rs (tests/, not examples/, since the generated file is a module of bindings plus a #[cfg(test)] proof, not a fn-main binary) -- never overwriting the hand-written examples/embedded_workflow.rs it is modeled on."
