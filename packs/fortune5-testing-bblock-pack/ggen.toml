[project]
name = "fortune5-testing-bblock-consumer"
version = "26.7.31"
description = "Manufacture distinct executable verification suites and replayable evidence"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.io/ontology/testing-bblock#"
imports = []

[ontology.prefixes]
tb = "https://ggen.io/ontology/testing-bblock#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
prov = "http://www.w3.org/ns/prov#"
dcterms = "http://purl.org/dc/terms/"

[generation]
output_dir = "."

[[generation.rules]]
name = "testing-verifier"
query = { file = "queries/testing-bblock.rq" }
template = { file = "templates/consumer/testing-bblock/testing_bblock.py.tmpl" }
output_file = "consumer/testing-bblock/testing_bblock.py"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "protocol-unit-suite"
query = { file = "queries/testing-bblock.rq" }
template = { file = "templates/consumer/testing-bblock/suites/suite.sh.tmpl" }
output_file = "consumer/testing-bblock/suites/protocol-unit.sh"
skip_empty = false
mode = "Overwrite"

