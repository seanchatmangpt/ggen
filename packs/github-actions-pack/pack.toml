[pack]
name = "github-actions-pack"
version = "0.2.0"
description = "TCPS production-process pack for GitHub Actions (生産設備と工程標準), rebuilt from first principles as a schema-only, project-agnostic pack: ontology.ttl carries ZERO gha:Workflow/gha:Job/gha:Step/gha:CompositeAction individuals (dspy-pack's proven contract — 'ontology.ttl ships zero individuals; a consumer project supplies its own individuals against this vocabulary in its own .ttl'). Prior revision (0.1.0) fused this schema with one project's (ggen's own) 21 gha:Wf*/7 gha:Job* as-built individuals, and its 4 templates only echoed a hardcoded gha:artifactBody YAML string literal per workflow -- not reusable by any other repo, and admitted as much at gha:L5C16: '複数リポジトリへ適用できる (applicable to multiple repos)... 未実施 (not yet done) -- single-repo model only.' This revision closes both gaps: (1) all project-specific individuals removed, ontology is pure vocabulary now; (2) a genuine gha:Step layer added (gha:inJob/gha:stepOrder/gha:usesAction/gha:runCommand/gha:withParam/gha:envVar/gha:continueOnError -- the layer the prior revision never modeled at all, without which nothing distinguishes one project's `cargo test` from another's `pnpm build`), and templates/workflow.yml.tmpl + templates/composite_action.yml.tmpl render REAL structured on:/permissions:/jobs:/steps: YAML from those typed facts via per-row SPARQL + Tera filter(attribute=,value=), not a blob echo. Each consumer wires this pack via its own ggen.toml (or ggen-engine's [ontology].imports + [[generation.rules]] convention, per project) and authors its own gha:Workflow/gha:Job/gha:Step facts in its own repo. Retains the 4-layer model (Event/Workflow/Job+Step/Production-output) and both real SPARQL refusal gates (010_required.rq, 020_security.rq — write-all, unspecified permissions, unnecessary contents:write, unbounded pull_request_target, unpinned third-party action refs, undeclared secret reasons); 010 gained a Step-required-facts branch, and 020's gha:usesAction branch is live for the first time (previously dead -- no individual ever populated that property). Two of the prior revision's four templates (reusable-rust-inspection workflow/caller, emit-evidence composite action) were inspection-workflow specifics with no generic value and are retired, not ported, in this pass -- named here, not silently dropped. First real consumer validated against: ggen's own .github/workflows/ci.yml, diffed for semantic equivalence against the real committed file, not assumed."
