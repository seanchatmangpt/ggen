[fence_classes]
verification = "Retain until an admitted reusable capability profile runs on the same exact head, preserves commands and evidence, passes refusal fixtures, and is externally witnessed as equivalent or stronger."
core_ci = "Retain until the control plane and reusable inspection run in exact-head shadow, preserve mandatory and advisory semantics, receive an equivalence receipt, and branch protection migrates to stable ci/* checks."
release = "Retain until exact admitted standing is required, the replacement proves output equivalence, external mutation is BRCE-admitted, and execution is replayably receipted."
mutation = "Retain until mutation is manufactured on a separate proposal branch, receives normal exact-head verification, and no verification workflow directly mutates source."
observation = "Retain until the external witness or admitted observer emits the same bounded observation, classifies absent evidence, and cannot self-promote or actuate."
acceptance = "Retain until the reusable infrastructure profile preserves real-boundary execution, immutable pins, bounded time and concurrency, and admitted evidence."

