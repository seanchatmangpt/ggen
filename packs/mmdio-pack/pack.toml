[pack]
name = "mmdio-pack"
version = "0.0.1"
description = "Python support matrix for mermaid-js diagram types; extends mermaid-pack with mer:pythonSupport and mer:grammarPath properties for 11 implemented types (flowchart, sequence, classDiagram, stateDiagram, er, gantt, pie, gitGraph, c4, mindmap, sankey). Generated from ~/mmdio source; see mmdio-pack/templates/registry.ttl.tmpl and gates for consistency checks."
