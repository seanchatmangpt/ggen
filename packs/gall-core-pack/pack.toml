[pack]
name = "gall-core-pack"
version = "26.7.30"
description = """
Constitutional ggen-first Gall checkpoint framework. Declares programs,
capabilities, dependency-closed checkpoints, APS-grade work items, evidence
obligations, exclusions, clean-revision replay, and release crowns as graph
objects. Generates the checkpoint roadmap, checkpoint and work-item DAGs, Jira
CSV, Jira ticket catalog, coding-agent work orders, evidence-derived status
ledger, crown report, and a real checkpoint runner that records command exit
codes into an admitted evidence mini-pack. Pack gates refuse incomplete
checkpoint or ticket contracts, cycles, duplicate identities, unsafe paths,
manually asserted standing, incomplete crowns, missing or red evidence,
non-independent replay, stale evidence, and ticket order that violates proof
order.
"""
