[pack]
name = "chicago-tdd-tools-pack"
version = "0.5.0"
description = "Generates CliHarness-based Chicago-style CLI boundary tests (#[test] fns crossing a real binary boundary) from ctt:CliBoundaryTest individuals, dispatching through one reusable generated module (tests/chicago_tdd_tools_boundary_runtime.rs, from cli_boundary_runtime.rs.tmpl) that defines the real run_boundary_spec(spec) -> Result<(), String> dispatch function (parse BoundarySpec -> dispatch via CliHarness -> emit Result) instead of duplicating CliHarness-spawn-and-assert logic per generated test. Also generates its own proof test (tests/chicago_tdd_tools_boundary_proof.rs): since both generated files are still independent Tera+SPARQL renders of the same sparql: tests query (this proof cannot call the OTHER template's render logic in-process), the proof reads the REAL rendered text of both sibling files off disk and asserts the query-derived literals -- fn signatures, BoundarySpec field literals, axiom doc-comments, the include!/dispatch-function/struct definitions, and a 1:1 call-site count -- appear in them verbatim. EXPECTED_TEST_COUNT is tests | length at render time, not a hardcoded literal. Since 2026-07-22 the ontology also carries a systematic negative-witness suite (5 sabotage individuals, up from 1 incidental case): three reuse ctt:composesCommand against a real required-arg cnv:Command (ReceiptEmit/UserCreate/SessionLogin) to hit clap's required-argument enforcement with the flag omitted, two use a hand-typed ctt:args literal to hit clap's subcommand-resolution (known noun, unrecognized verb) and unknown-argument enforcement (valid command, unrecognized flag) -- three distinct real clap failure modes, each stderrNeedle transcribed verbatim from a live run of the built examples/receiptctl binary, not invented. v0.5.0 (2026-08-03, adversarial-review follow-up): all four templates lacked `force: true`, so ggen's own default write-safety (no `mode` field exists in this frontmatter dialect -- the field is `force: bool`, confirmed against ggen-engine's Frontmatter struct) refused every regeneration once a consumer's ctt: facts legitimately changed, with FM-WRITE-005 (`target exists with differing content`) and no CLI-level override -- discovered live when correcting a fact in examples/ggen-cli-verify's sibling consumer tools/ggen-verifier-cli-verify (a separate repo, ggen-legacy). Added `force: true` to all four templates: these files are 100% generated (every one's own header says so) with no hand-edit convention anywhere in this pack or its consumers, so failing closed on a legitimate content change served no one. Also added a `binaries` SPARQL query (DISTINCT ?binary) to cli_boundary_doc.md.tmpl's frontmatter and a generated Prerequisites section listing them, since a consumer whose ctt:binary values aren't its own [[bin]] targets must resolve them via PATH (CliHarness::cargo_bin's resolution order) before cargo test passes -- previously undocumented, now derived from the ontology instead of hand-written per consumer."
