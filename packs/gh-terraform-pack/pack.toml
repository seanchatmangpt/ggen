[pack]
name = "gh-terraform-pack"
version = "0.2.0"
description = "Generates Terraform GitHub-management config (integrations/github provider, real HCL bodies modeled verbatim on ~/dev/ranchr and ~/dev/beamops) plus a reusable gh CLI shell-script library, all driven from ghtf:/ghcli: RDF individuals whose bodies are real, byte-for-byte content — no engine changes, template files only echo stored literals. Multi-org/tenant support: ghtf:OrgTenant individuals (provider alias, BU, tier inheritance) drive per-org providers.tf aliasing and orgs/<alias>/{repos,backend}.tf file-layout generation, isolating state per business unit. v2 additions: backend-agnostic remote-state modeling (ghtf:BackendConfig, S3+DynamoDB+KMS / GCS / Terraform Cloud remote, verbatim HCL per kind); org-level security & compliance instances (SSO enforcement doc, 2FA requirement, IP allow list, audit-log-stream flag, required signed commits — modeled as ghtf:RepoManagementInstance rows in new families org-security/ip-allowlist); a policy-as-code SPARQL refusal gate (gates/030_policy.rq) enforcing critical-tier review-count minimums, deprecated-without-successor refusal, and SSO-required-org webhook-auth refusal; and multi-org/tenant modeling (ghtf:OrgTenant: alias, BU, tier inheritance) driving per-org provider aliasing and infra/terraform/github/orgs/<alias>/ file layout for blast-radius-isolated state per business unit."
