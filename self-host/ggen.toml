[project]
name = "ggen-self-host"
version = "26.7.30"
description = "ggen repository dogfood consumer: observe exact tree, admit RDF, manufacture retrofit work and receipts"

[ontology]
source = "ontology.ttl"
base_iri = "http://seanchatmangpt.github.io/packs/ggen-self-host#"

[ontology.prefixes]
gsh = "http://seanchatmangpt.github.io/packs/ggen-self-host#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
skos = "http://www.w3.org/2004/02/skos/core#"

[packs]
ggen-self-host-pack = { path = "../packs/ggen-self-host-pack" }

[templates]
dir = "templates"
aggregate_modules = true

[sync]
enabled = true
on_change = "manual"
validate_after = true
conflict_mode = "fail"

[rdf]
formats = ["turtle"]
default_format = "turtle"
strict_validation = true
