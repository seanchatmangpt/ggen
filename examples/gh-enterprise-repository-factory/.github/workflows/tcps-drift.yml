name: tcps-drift

# GENERATED by `ggen sync` from packs/gh-terraform-pack/ontology.ttl
# (ghtf:TcpsDriftWorkflow). Scheduled drift detection, 第二十九章 condition 8.
# Read-only observation: terraform plan only — this workflow never applies
# anything (第四章: plan は差分観測であり、作動許可ではない).

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Bootstrap fallback: prefer the latest release binary (asset name from
      # release.yml's package step: ggen-x86_64-unknown-linux-gnu.tar.gz);
      # only cargo-build when no runnable release binary exists.
      - name: Try release ggen binary
        id: relbin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/relbin"
          mkdir -p "$dir"
          set +e
          gh release download --repo seanchatmangpt/ggen --pattern 'ggen-x86_64-unknown-linux-gnu.tar.gz' --dir "$dir" &&
            tar -xzf "$dir/ggen-x86_64-unknown-linux-gnu.tar.gz" -C "$dir" &&
            "$dir/ggen" --version
          ok=$?
          set -e
          if [ "$ok" -eq 0 ]; then
            echo "release binary usable - skipping cargo build"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$dir/ggen" >> "$GITHUB_OUTPUT"
          else
            echo "no usable release binary - falling back to cargo build"
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "path=$GITHUB_WORKSPACE/target/debug/ggen" >> "$GITHUB_OUTPUT"
          fi

      - uses: Swatinem/rust-cache@v2
        if: steps.relbin.outputs.found != 'true'

      - name: Build ggen
        if: steps.relbin.outputs.found != 'true'
        run: cargo build -p ggen-cli-lib --bin ggen

      - name: Scaffold consumer and sync
        env:
          GGEN_BIN: ${{ steps.relbin.outputs.path }}
        run: |
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer/templates"
          : > "$consumer/ontology.ttl"
          {
            echo '[project]'
            echo 'name = "drift-consumer"'
            echo ''
            echo '[ontology]'
            echo 'source = "ontology.ttl"'
            echo ''
            echo '[packs]'
            echo 'gh-terraform-pack = { path = "'"$GITHUB_WORKSPACE"'/packs/gh-terraform-pack" }'
            echo ''
            echo '[templates]'
            echo 'dir = "templates"'
          } > "$consumer/ggen.toml"
          cd "$consumer"
          "$GGEN_BIN" sync run

      - name: Import state and report drift (read-only plan, never apply)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          consumer="$RUNNER_TEMP/consumer"
          cd "$consumer"
          bash scripts/gh/accept-import.sh --dir infra/terraform/github --owner seanchatmangpt --repo ggen
          set +e
          report=$(bash scripts/gh/drift-report.sh --dir infra/terraform/github --owner seanchatmangpt --repo ggen --secret-value drift-scan-placeholder)
          set -e
          echo "$report" > "$RUNNER_TEMP/drift-report.json"
          {
            echo '## tcps-drift report'
            echo '```json'
            cat "$RUNNER_TEMP/drift-report.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drift report artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: ${{ runner.temp }}/drift-report.json

      - name: Open andon issue on drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          andon=$(jq -r .andon "$RUNNER_TEMP/drift-report.json")
          echo "andon: $andon"
          if [ "$andon" = "GREEN" ]; then
            echo "andon GREEN - no issue"
            exit 0
          fi
          label_args=()
          if gh label list -R seanchatmangpt/ggen --json name --jq '.[].name' | grep -qx "Terraform漂流"; then
            label_args=(--label "Terraform漂流")
          fi
          body=$(cat "$RUNNER_TEMP/drift-report.json")
          bash "$RUNNER_TEMP/consumer/scripts/gh/issue-create.sh" --repo seanchatmangpt/ggen --title "Terraform漂流 detected" --body "$body" ${label_args[@]+"${label_args[@]}"}
