[workspace]

[package]
name = "receiptctl"
version = "0.1.0"
edition = "2021"
publish = false
description = "Canonical multi-pack ggen example: combines clap-noun-verb-pack, chicago-tdd-tools-pack, and the wasm4pm-*-pack family into one end-to-end CLI."

[dependencies]
clap-noun-verb = "=26.7.4"
clap-noun-verb-macros = "=26.7.4"
linkme = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
wasm4pm-compat = "=26.6.29"

[dev-dependencies]
# 2026-08-03: chicago-tdd-tools 26.8.3 is published with `cli-proof` included, so this uses
# the registry version directly rather than the (now-removed) vendored crates/chicago-tdd-tools
# copy.
chicago-tdd-tools = { version = "26.8.3", features = ["cli-proof"] }

[[bin]]
name = "receiptctl"
path = "src/main.rs"
