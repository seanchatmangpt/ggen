# Consumer: manufacturing DfLSS industry example.
# Pack: industry-manufacturing-dflss (canonical checkout
# /Users/sac/ggen-marketplace/packs/industry-manufacturing-dflss).
# ggen-marketplace checkout and renders the SHACL law shapes + client
# walkthrough from the pack's ontology.
[project]
name = "industry-manufacturing-dflss-example"
version = "26.10.0"
description = "Consumer example for industry-manufacturing-dflss (SHACL laws + client walkthrough)"


[ontology]
source = "/Users/sac/ggen-marketplace/packs/industry-manufacturing-dflss/ontology.ttl"
base_iri = "https://seanchatmangpt.github.io/packs/industry-manufacturing-dflss"

[ontology.prefixes]
dflss = "https://seanchatmangpt.github.io/packs/industry-manufacturing-dflss#"
ocel = "http://w3id.org/ocel/schema/"
xsd = "http://www.w3.org/2001/XMLSchema#"

[generation]
output_dir = "."

[[generation.rules]]
name = "shacl-manufacturing-shapes"
query = { file = "/Users/sac/ggen-marketplace/packs/industry-manufacturing-dflss/queries/refusal_laws.rq" }
template = { file = "/Users/sac/ggen-marketplace/packs/industry-manufacturing-dflss/templates/shacl-manufacturing-shapes.ttl.tmpl" }
output_file = "generated/shacl-manufacturing-shapes.ttl"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "client-walkthrough"
query = { file = "/Users/sac/ggen-marketplace/packs/industry-manufacturing-dflss/queries/refusal_laws.rq" }
template = { file = "/Users/sac/ggen-marketplace/packs/industry-manufacturing-dflss/templates/client-walkthrough.md.tmpl" }
output_file = "generated/client-walkthrough.md"
skip_empty = false
mode = "Overwrite"
