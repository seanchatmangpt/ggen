skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "client-walkthrough"
query = { file = "../../../../ggen-marketplace/packs/industry-aero-defense/queries/endpoints.rq" }
template = { file = "../../../../ggen-marketplace/packs/industry-aero-defense/templates/client-walkthrough.md.tera" }
