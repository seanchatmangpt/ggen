[project]
name = "cs2-projections"
version = "0.2.0"
description = "Deterministic multi-projection witness and fleet consumer contract for RFC-CS2-001"

[ontology]
source = "canonical.ttl"
base_iri = "https://chatman.ai/cs2#"

[ontology.prefixes]
cs2 = "https://chatman.ai/cs2#"

[inference]

[generation]
output_dir = "."

[[generation.rules]]
name = "cs2-consumers-json"
query = { file = "queries/consumers.rq" }
template = { file = "templates/consumers.json.tera" }
output_file = "generated/consumers.json"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "cs2-consumers-elixir"
query = { file = "queries/consumers.rq" }
template = { file = "templates/consumers.exs.tera" }
output_file = "generated/consumers.exs"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "cs2-fleet-contract-json"
query = { file = "queries/consumers.rq" }
template = { file = "templates/fleet-contract.json.tera" }
output_file = "generated/fleet-contract.json"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "cs2-marketplace-pack"
query = { file = "queries/consumers.rq" }
template = { file = "templates/marketplace-pack.ttl.tera" }
output_file = "generated/marketplace-pack.ttl"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "cs2-ash-a2a-fleet-contract"
query = { file = "queries/consumers.rq" }
template = { file = "templates/ash-a2a-fleet-contract.ex.tera" }
output_file = "generated/ash_a2a/generated_fleet_contract.ex"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "cs2-xaas-fleet-contract"
query = { file = "queries/consumers.rq" }
template = { file = "templates/xaas-fleet-contract.ex.tera" }
output_file = "generated/xaas/generated_fleet_contract.ex"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "cs2-semantic-jira-json"
query = { file = "semantic-jira.rq" }
template = { file = "templates/semantic-jira.json.tera" }
output_file = "generated/semantic-jira.json"
mode = "Overwrite"
skip_empty = true
