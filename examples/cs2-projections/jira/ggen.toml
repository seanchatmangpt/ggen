[project]
name = "cs2-jira-work-orders"
version = "0.1.0"
description = "Deterministic Jira-ready work-order projections for RFC-CS2-001"

[ontology]
source = "canonical-work-orders.ttl"
base_iri = "https://chatman.ai/cs2#"

[ontology.prefixes]
cs2 = "https://chatman.ai/cs2#"

[inference]

[generation]
output_dir = "."

[[generation.rules]]
name = "cs2-jira-work-orders-json"
query = { file = "queries/work-orders.rq" }
template = { file = "templates/work-orders.json.tera" }
output_file = "generated/work-orders.json"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "cs2-jira-work-orders-ndjson"
query = { file = "queries/work-orders.rq" }
template = { file = "templates/work-orders.ndjson.tera" }
output_file = "generated/work-orders.ndjson"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "cs2-jira-work-orders-markdown"
query = { file = "queries/work-orders.rq" }
template = { file = "templates/work-orders.md.tera" }
output_file = "generated/work-orders.md"
mode = "Overwrite"
skip_empty = true
