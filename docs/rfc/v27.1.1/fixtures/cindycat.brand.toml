# CindyCat — Gate-1 dual-surface brand + CindyCat-first patronage messaging
# Surface A (ggen rhythm court): [rhythm] / [[rhythm.spacing]] / [[rhythm.fluid]]
# Surface B (ggen_igniter BrandTheme): DTCG [primitive.space] grown from [rhythm]
#   (px ladder → 0 / 0_5 / 1 / 1_5 / 2… keys; touch floors from rhythm).
# Color / type / CASTLE inventories remain Gate 2+ (not invented here).
# Messaging slots are plain TOML keys for castle publish + ggen —
# no private ontology namespaces.

dtcg_version = "2025.10"
brand_id = "cindycat"

[brand]
id = "cindycat"
name = "CindyCat"
short_name = "CindyCat"
tagline = "Reverse Gloo"
house = "woman-owned house"

[messaging.patronage]
headline = "Her Patronage Restored"
fair_pay = "Luke 10:7 fair pay"
custody = "0% custody"
skimming = "0.00% skimming"
tagline = "Reverse Gloo"
house = "woman-owned house"

[messaging.commercial]
custody_pct = 0.0
skimming_pct = 0.0
transaction_rent_pct = 0.0

[tokens.dtcg]
spec_version = "2025.10"
surface_target = "css-theme-spacing"
surface_target_note = "Gate-1 rhythm is the spacing token surface; color/type/CASTLE inventories Gate 2+."

[rhythm]
rem_base_px = 16
grid_base_px = 8
grid_half_px = 4
touch_floor_material_px = 48
touch_floor_apple_px = 44
inter_target_gap_px = 8

[[rhythm.spacing]]
name = "0"
px = 0

[[rhythm.spacing]]
name = "1"
px = 4

[[rhythm.spacing]]
name = "2"
px = 8

[[rhythm.spacing]]
name = "3"
px = 12

[[rhythm.spacing]]
name = "4"
px = 16

[[rhythm.spacing]]
name = "5"
px = 24

[[rhythm.spacing]]
name = "6"
px = 32

[[rhythm.spacing]]
name = "7"
px = 48

[[rhythm.spacing]]
name = "8"
px = 64

[[rhythm.fluid]]
name = "space-fluid-sm"
min_px = 4
preferred = "1.5cqi"
max_px = 12
slope_cqi = 1.5

[[rhythm.fluid]]
name = "space-fluid-md"
min_px = 12
preferred = "3cqi"
max_px = 24
slope_cqi = 3.0

[[rhythm.fluid]]
name = "type-body-fluid"
min_px = 16
preferred = "2cqi"
max_px = 20
slope_cqi = 2.0

# --- DTCG BrandTheme surface (grown from [rhythm] — hop-4 OEM pair) ---

[meta]
id = "cindycat"
name = "CindyCat"
dtcg = "2025.10"
grid_base_px = 8
grid_micro_px = 4

[primitive.space]
"$type" = "dimension"

[primitive.space."0"]
"$value" = "0px"

[primitive.space."0_5"]
"$value" = "4px"

[primitive.space."1"]
"$value" = "8px"

[primitive.space."1_5"]
"$value" = "12px"

[primitive.space."2"]
"$value" = "16px"

[primitive.space."3"]
"$value" = "24px"

[primitive.space."4"]
"$value" = "32px"

[primitive.space."6"]
"$value" = "48px"

[primitive.space."8"]
"$value" = "64px"

[primitive.fontSize]
"$type" = "dimension"

[primitive.fontSize.base]
"$value" = "1rem"

[primitive.fontSize.floor]
"$value" = "16px"
"$description" = "Hard floor: base ≥ rem_base_px"

[primitive.touch]
"$type" = "dimension"

[primitive.touch.apple]
"$value" = "44px"
"$description" = "tap ≥ apple floor"

[primitive.touch.material]
"$value" = "48px"

[primitive.touch.gap]
"$value" = "8px"

[semantic.space]
"$type" = "dimension"

[semantic.space.tight]
"$value" = "{primitive.space.0_5}"

[semantic.space.related]
"$value" = "{primitive.space.1}"

[semantic.space.space_fluid_sm]
"$value" = "clamp(4px, 1.5cqi, 12px)"

[semantic.space.space_fluid_md]
"$value" = "clamp(12px, 3cqi, 24px)"

[semantic.space.type_body_fluid]
"$value" = "clamp(16px, 2cqi, 20px)"

[semantic.touch]
"$type" = "dimension"

[semantic.touch.target_min]
"$value" = "{primitive.touch.apple}"

[semantic.touch.target_comfortable]
"$value" = "{primitive.touch.material}"

[semantic.touch.gap_min]
"$value" = "{primitive.touch.gap}"

[semantic.viewport]
"$type" = "dimension"

[semantic.viewport.height]
"$value" = "100dvh"

[semantic.viewport.prose_max]
"$value" = "40rem"

[semantic.viewport.container_max]
"$value" = "65rem"

[component.card]
"$type" = "dimension"

[component.card.padding]
"$value" = "clamp(1rem, 0.333rem + 3.333cqi, 2rem)"

[component.input]
"$type" = "dimension"

[component.input.font_size]
"$value" = "max(16px, 1rem)"

[extensions.ggen.invariants]
no_property_on_cqi = true
units_px_rem_only = true
touch_floor_apple_px = 44
touch_floor_material_px = 48
font_base_min_px = 16
no_shipping_120hz = true
no_shipping_webgpu = true
brand_theme_emit_standing = "PARTIAL_ALIVE"
