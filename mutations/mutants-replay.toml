    # envelope_receipt_binding_test (its test names carry no "determinism"/
    # "sync" token — dispatch it explicitly, e.g. cargo-mutants
    # `-- envelope_receipt_binding`, until a pass filter covers it).
    "crates/ggen-engine/src/envelope.rs",
    "crates/ggen-engine/src/write.rs",
    "crates/ggen-engine/src/court/*.rs",
    "crates/ggen-engine/src/generated/*.rs",
